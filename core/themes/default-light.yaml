# ─────────────────────────────────────────────────────────────────────────────
#  default-light — 參考實作主題（淺色）
#
#  與 default-dark 結構完全對稱，但刻意在若干欄位上採用不同的「結構性」取值
#  （elevation、border_width、shadow 強度），用以證明一件事：
#  深淺兩色並非只有顏色不同，因此規範選擇「一份檔案描述一種外觀」。
#
#  規範：docs/theme-format.md
# ─────────────────────────────────────────────────────────────────────────────

format: rime-theme/1
id: default-light
revision: 1

name:
  en: "Default Light"
  zh-Hant: "預設淺色"
  zh-Hans: "默认浅色"

description:
  en: "Reference light theme. Every field written out explicitly."
  zh-Hant: "參考淺色主題，所有欄位皆明確寫出。"

author: "rime-quad"
license: "CC0-1.0"

appearance: light
counterpart: default-dark
inherits: null

palette:
  bg:               "#D6D9E0"
  surface:          "#F7F8FA"
  surface_alt:      "#FFFFFF"
  key:              "#FFFFFF"
  key_pressed:      "#DCE0E8"
  key_mod:          "#C4C9D4"
  key_mod_pressed:  "#B0B6C4"
  accent:           "#2563EB"
  accent_pressed:   "#1D4FD7"
  on_accent:        "#FFFFFF"
  fg:               "#11151C"
  fg_dim:           "#3C4453"
  muted:            "#6B7484"
  divider:          "#D3D8E0"
  shadow:           "#0F172A33"
  danger:           "#D92D20"

typography:
  respect_system_font_scale: true
  font_scale_min: 0.85
  font_scale_max: 1.30

  fonts:
    ui:
      family: ["$system"]
      weight: 400
      italic: false
      script_fallback:
        hant: ["$system-hant", "Noto Sans CJK TC", "PingFang TC", "Microsoft JhengHei UI"]
        hans: ["$system-hans", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei UI"]
        jpan: ["$system-jpan", "Noto Sans CJK JP", "Hiragino Sans", "Yu Gothic UI"]
        kore: ["$system-kore", "Noto Sans CJK KR", "Apple SD Gothic Neo", "Malgun Gothic"]

    candidate:
      family: ["$system"]
      weight: 400
      italic: false
      script_fallback:
        hant: ["$system-hant", "Noto Serif CJK TC", "Noto Sans CJK TC", "PingFang TC", "Microsoft JhengHei UI"]
        hans: ["$system-hans", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei UI"]
        jpan: ["$system-jpan", "Noto Sans CJK JP", "Hiragino Sans", "Yu Gothic UI"]
        kore: ["$system-kore", "Noto Sans CJK KR", "Apple SD Gothic Neo", "Malgun Gothic"]

    label:
      family: ["$system"]
      weight: 500
      italic: false
      script_fallback: {}

    comment:
      family: ["$system"]
      weight: 400
      italic: false
      script_fallback:
        hant: ["$system-hant", "Noto Sans CJK TC"]
        hans: ["$system-hans", "Noto Sans CJK SC"]

    key:
      family: ["$system"]
      weight: 400
      italic: false
      script_fallback:
        hant: ["$system-hant", "Noto Sans CJK TC", "PingFang TC"]
        hans: ["$system-hans", "Noto Sans CJK SC", "PingFang SC"]

    preedit:
      family: ["$mono", "$system"]
      weight: 400
      italic: false
      script_fallback: {}

  assets: []

metrics:
  corner_radius: 7
  border_width: 0
  padding: 6
  spacing: 4
  elevation: 0

candidates:
  orientation: horizontal

  label:
    show: true
    format: "{label}"
    size: 12
    color: "$muted"
    highlight_color: "$on_accent@75%"

  text:
    size: 20
    color: "$fg"
    highlight_color: "$on_accent"

  comment:
    show: true
    position: after
    size: 12
    color: "$muted"
    highlight_color: "$on_accent@70%"

  item:
    padding_h: 10
    padding_v: 6
    spacing: 4
    corner_radius: 6
    min_width: 0
    background: transparent
    highlight_background: "$accent"
    border_width: 0
    border_color: transparent
    highlight_border_width: 0
    highlight_border_color: transparent

  separator:
    show: false
    color: "$divider"
    width: 1

  page_indicator:
    show: true
    style: arrows
    color: "$muted"
    disabled_color: "$muted@40%"
    size: 14

  bar:
    # ── §8.6.4.2 行動端候選列的密度 ──────────────────────────────────────
    #
    #  這三個值是使用者拿三星比對之後量出來的。實測（1080×2400 @420dpi ＝
    #  411.43 dp 寬）：改之前一列只排得下 **3 個**，同一台機器上語燕是 6 個。
    #
    #  ⚠ **`item` 這一段只覆寫 `bar`，不動上面共用的那一份。** 桌面端的
    #    `window` 沿用 `padding_h: 10` / `min_width: 0` —— §8.6.4.2 是
    #    行動端的規則（觸控目標、一列排幾個），桌面端沒有觸控目標這回事。
    item:
      # 10 → 8。單獨改這一項只省 7.6 dp/格、結果仍然是 3 個；它要跟
      # 「註解與消歧欄互斥」一起做才有意義（那一項才是 35.3%）。
      padding_h: 8
      # 觸控目標的下界（ui-design §3.6）。**空白必須由 padding 提供、
      # 不得由 spacing 提供**：兩者畫出來一模一樣，但 padding 算在候選的
      # 觸控目標裡、spacing 不算。照著三星的截圖抄「格間 20 dp」而把它
      # 放進 spacing，抄出來的是一排點不到的候選。
      min_width: 48
    height: 44
    background: "$surface"
    border_top_width: 1
    border_top_color: "$divider"
    orientation: horizontal
    max_visible: 0
    scroll: expandable
    expand_button:
      show: true
      color: "$muted"
      size: 18
    show_preedit_inline: true
    empty_shows_toolbar: true
    # 無候選時顯示的工具列。這不是裝飾 —— schema:picker 是方案切換的唯一入口,
    # 所以規範 §8.6.6.1 把它列為必備項:主題就算刪掉,解析器也會補回來。
    toolbar:
      show: true
      items:
        - { icon: "globe",          tap: "schema:picker" }
        - { label_from: input_mode_pair, tap: "input_mode:toggle" }
        - { label_from: variant,    tap: "toggle:simplification" }
        - { icon: "emoji",          tap: "emoji" }
        - { icon: "settings",       tap: "settings" }
        - { icon: "keyboard_hide",  tap: "hide_keyboard" }

  window:
    background: "$surface"
    orientation: horizontal
    corner_radius: 10
    padding: 8
    border_width: 1
    border_color: "$divider"
    min_width: 120
    max_width: 520
    placement: auto
    offset_x: 0
    offset_y: 6
    follow_caret: true
    backdrop: none
    opacity: 1.0
    shadow:
      show: true
      radius: 22
      offset_x: 0
      offset_y: 6
      color: "$shadow"

preedit:
  show: true
  size: 16
  color: "$fg_dim"
  background: transparent
  padding_h: 10
  padding_v: 6
  corner_radius: 0
  caret:
    show: true
    color: "$accent"
    width: 1.5
    blink: true
  selection:
    color: "$accent@25%"
    text_color: "$fg"

keyboard:
  background: "$bg"

  # §8.8.0 高度模型：參考格 → 高度預算 → 列高。
  # 鍵盤總高只看裝置寬度與下面這組參考格，**與當前佈局的欄數、列數無關**；
  # 佈局只負責把預算依 Σ row.weight 分掉。所以打開數字列鍵盤不會長高。
  #
  # Gboard 實測基準（同一份 Gboard，兩種螢幕）：
  #   1080x2400 @420dpi（411dp 寬）  鍵 35.4 x 47.0 dp   aspect 1.33
  #   1440x3120 @505dpi（456dp 寬）  鍵 39.6 x 47.2 dp   aspect 1.19
  # 鍵高兩邊都是 47dp —— Gboard 其實用固定鍵高，aspect 只是被動結果。
  # 我們仍以 aspect 為主控，但它現在描述的是**參考格上那顆鍵**的胖瘦，
  # 所以「鍵高隨螢幕寬度成長、平板不會出現極扁的鍵」這個好處留著，
  # 而「列數一多鍵盤就長高」那個副作用沒了。
  #
  # 參考鍵高 = clamp(39.2 x 1.38, 44, 54) = **54 dp**（S24U 456.2dp 寬）。
  # 這個值刻意落在 Gboard（47.2）與三星（54.4）之間、靠三星那一側：
  #   · 本專案的使用者是 CJK 使用者，而九宮格是 CJK 專屬的鍵盤形狀。
  #     5 欄的九宮格鍵很寬（平均 84.4 dp），鍵高若停在 Gboard 的 47，
  #     長寬比會到 1.80 —— 遠離競品區間（語燕 1.36、三星 1.53）。
  #   · 要精確對齊 Gboard 的主題已經有一份：`intl-gboard-*`（key_height 46–48）。
  #     預設主題不必兼任那個角色。
  # 實測（S24U，本主題）：QWERTY 列高 54.0、九宮格平均鍵寬 84.4 → w/h 1.56。
  key_aspect: 1.38
  key_height:            # 夾制的是「參考鍵高」，也就是預算的基準
    min: 44
    max: 54

  # 參考格：預算 = 這麼多列這麼寬的鍵排滿的高度。10 欄 4 列 = 一般全鍵盤。
  reference_grid:
    units: 10
    rows: 4

  # 預算除完之後的可用性護欄。護欄生效時總高才會偏離預算 ——
  # 與其給一顆 20dp 高按不到的鍵，不如讓鍵盤高一點。
  row_height:
    min: 32
    max: 96
  max_screen_ratio:
    portrait: 0.45
    landscape: 0.62

  padding:
    left: 5
    right: 5
    top: 4
    bottom: 4

  row_spacing: 12
  key_spacing: 6
  honor_bottom_inset: true

  key_styles:
    default:
      background: "$key"
      pressed_background: "$key_pressed"
      foreground: "$fg"
      pressed_foreground: "$fg"
      corner_radius: 7
      border_width: 0
      border_color: transparent
      elevation: 0
      font: key
      label_size: 26
      hint_size: 11
      hint_color: "$muted"
      hint_position: top_right
      icon_size: 24
      active_background: "$accent"
      active_foreground: "$on_accent"

    modifier:
      background: "$key_mod"
      pressed_background: "$key_mod_pressed"
      foreground: "$fg_dim"
      pressed_foreground: "$fg"
      corner_radius: 7
      border_width: 0
      border_color: transparent
      elevation: 0
      font: key
      label_size: 18
      hint_size: 10
      hint_color: "$muted"
      hint_position: none
      icon_size: 22
      active_background: "$accent@30%"
      active_foreground: "$fg"

    action:
      background: "$accent"
      pressed_background: "$accent_pressed"
      foreground: "$on_accent"
      pressed_foreground: "$on_accent"
      corner_radius: 7
      border_width: 0
      border_color: transparent
      elevation: 0
      font: key
      label_size: 18
      hint_size: 10
      hint_color: "$on_accent@70%"
      hint_position: none
      icon_size: 22
      active_background: "$accent_pressed"
      active_foreground: "$on_accent"

    space:
      background: "$key"
      pressed_background: "$key_pressed"
      foreground: "$muted"
      pressed_foreground: "$fg"
      corner_radius: 7
      border_width: 0
      border_color: transparent
      elevation: 0
      font: key
      label_size: 14
      hint_size: 10
      hint_color: "$muted"
      hint_position: none
      icon_size: 20
      active_background: "$key_pressed"
      active_foreground: "$fg"

    accent:
      background: "$accent@14%"
      pressed_background: "$accent@28%"
      foreground: "$accent"
      pressed_foreground: "$on_accent"
      corner_radius: 7
      border_width: 1
      border_color: "$accent@35%"
      elevation: 0
      font: key
      label_size: 24
      hint_size: 11
      hint_color: "$accent@70%"
      hint_position: top_right
      icon_size: 22
      active_background: "$accent"
      active_foreground: "$on_accent"

  popup:
    show: true
    background: "$surface_alt"
    foreground: "$fg"
    highlight_background: "$accent"
    highlight_foreground: "$on_accent"
    corner_radius: 8
    item_size: 22
    item_padding: 10
    elevation: 8
    max_columns: 6

  press_preview:
    show: true
    background: "$surface_alt"
    foreground: "$fg"
    size: 28
    corner_radius: 8
    elevation: 8

motion:
  enabled: true
  respect_reduce_motion: true
  curve: standard
  key_press_ms: 40
  key_release_ms: 90
  candidate_change_ms: 120
  popup_ms: 90
  window_show_ms: 110

feedback:
  haptic: true
  haptic_strength: medium
  sound: false
  sound_volume: 0.3

platform_overrides:
  android: {}
  ios:
    keyboard:
      height:
        portrait:
          ratio: 0.31
  macos:
    candidates:
      window:
        backdrop: vibrancy
  windows:
    candidates:
      window:
        corner_radius: 8
