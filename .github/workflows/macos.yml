name: macOS (核心 + 輸入法 + 設定介面)

# 這個 workflow 分兩層,對應 docs/handoff-macos.md §7:
#
#   (a) CI 驗得了的 —— 純邏輯單元測試、核心層打得出字、.app 編得起來、
#       bundle 結構與 IMKit 宣告齊全、二進位真的連上 librime、
#       **.pkg 真的裝到正確的位置**、單一連網出口沒有破功。
#   (b) 只有人做得到的 —— 在真的 Mac 上裝起來實際用。**這裡一項都驗不到。**
#
# ⚠ macos runner **沒有登入的圖形工作階段**,系統不會從 ~/Library/Input Methods
#   載入輸入法。所以「候選窗有沒有出現」「設定視窗長什麼樣」「按下去有沒有反應」
#   在這裡全部驗不了。這個 workflow 全綠**不代表能用**。
#   沒被驗到的完整清單見 apple/README.md §3。
#
# 步驟順序是刻意的:不需要 librime 的檢查排在前面。單元測試 40 秒就跑完,
# 而從原始碼建 librime 要 4 分鐘 —— Kit 壞掉時不該讓人等那 4 分鐘。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-verify:
    runs-on: macos-latest
    timeout-minutes: 75

    steps:
      - name: 取出原始碼
        uses: actions/checkout@v4

      - name: 記錄工具鏈版本（失敗時要能重建現場）
        run: |
          sw_vers
          echo "arch: $(uname -m)"
          cmake --version | head -1
          clang++ --version | head -1
          swift --version
          bash --version | head -1

      # ── (a-0) 名字:不編譯、不需要 macOS,30 毫秒,所以排最前面 ──
      # 改名最典型的失敗是「改了一半」,而它的症狀全都是
      # 「裝得起來、看得到、不能用,而且沒有錯誤訊息」。這一關把
      # bundle id / TISInputSourceID / .lproj 的鍵 / @objc 類別名 /
      # 腳本裡的產物路徑釘在一起,順便擋住「這個 workflow 自己掉了一關」。
      - name: 名字一致性的反向測試（證明它真的會紅）
        run: python3 ./apple/scripts/verify_names.py --self-test

      - name: 名字一致性（bundle id / 輸入模式 id / 類別名 / 產物路徑）
        run: python3 ./apple/scripts/verify_names.py

      # ── (a-0b) 定位:一行 grep 就該看得完 ──────────────────────
      - name: 單一連網出口的反向測試（證明它真的會紅）
        run: ./apple/scripts/verify_single_egress.sh --expect-fail

      - name: 整個 app 只有一個地方連得上網
        run: ./apple/scripts/verify_single_egress.sh

      # ── (a-1) 純邏輯:不需要 librime,所以排最前面 ──────────────
      - name: 單元測試（主題 / keysym / 排版 / 上屏 / 設定 / 市集 / 詞庫 / 輸入模式）
        run: ./apple/scripts/run_kit_tests.sh

      # ── (a-2) 核心層:與上一輪相同,不得回歸 ────────────────────
      - name: 取得方案原始資料（版本已釘死）
        run: ./scripts/fetch_rime_data.sh

      - name: 編譯原生層（librime + 5 個依賴 + librime-lua + rime_console）
        run: ./apple/scripts/build_macos.sh

      - name: 組裝執行期資料
        run: ./scripts/collect_data.sh

      - name: 確認執行期資料真的齊全
        run: ./apple/scripts/verify_data.sh

      # ⚠ **ModifierGate 的前提是一份上游檔案,所以它要被檢查,不是被相信。**
      #   組字中按 Caps Lock 會清掉組字,靠的是隨附 default.yaml 裡的
      #   `ascii_composer/switch_key: { Caps_Lock: clear }`。那份檔案來自
      #   rime-prelude(上游),它哪天改了,ModifierGate 的理由就要重讀一次。
      #   這一關不是在驗我們的程式碼,是在驗**那個前提還在不在**。
      - name: 前提 — 隨附的 default.yaml 真的把 Caps Lock 綁成 clear
        run: |
          set -uo pipefail
          F=core/data/shared/default.yaml
          echo "== $F 的 ascii_composer =="
          grep -n -A8 '^ascii_composer:' "$F" | sed 's/^/    /'
          case "$(cat "$F")" in
            *"Caps_Lock: clear"*)
              echo "  ✓ 前提成立:Caps_Lock 綁的是 clear(librime 會 ctx->Clear())" ;;
            *)
              echo "!! 上游改了 ascii_composer/switch_key —— ModifierGate 的理由要重讀一次" >&2
              echo "   (LuminaKeyKit/InputModeSwitch.swift 的 ModifierGate)" >&2
              exit 1 ;;
          esac

      - name: 確認四個方案真的部署成功
        run: |
          # rime_console 的 deploy-only 模式（keys 傳 "-"）會印出機器可讀的
          # "[schema] <id><TAB><name>"。少了這一步，某個方案靜靜地從部署裡掉
          # 出去不會有人發現 —— 底下兩個打字斷言只碰得到 luna_pinyin_tw 與
          # bopomofo_tw，t9_pinyin / luna_pinyin 壞掉照樣全綠。
          set -uo pipefail
          OUT="$(./apple/build/rime_console core/data/shared core/data/user - 2>&1)"
          rc=$?
          printf '%s\n' "$OUT" | grep -E '^\[deploy-only\]' || true
          if [ "$rc" -ne 0 ]; then
            printf '%s\n' "$OUT"
            echo "!! rime_console 結束碼 $rc"
            exit 1
          fi
          printf '%s\n' "$OUT" \
            | awk -F'\t' '/^\[schema\] /{ sub(/^\[schema\] /, "", $1); print $1 }' \
            > /tmp/deployed_schemas.txt
          echo "已部署方案："; sed 's/^/    /' /tmp/deployed_schemas.txt
          fail=0
          for s in luna_pinyin_tw bopomofo_tw luna_pinyin t9_pinyin; do
            if grep -qx "$s" /tmp/deployed_schemas.txt; then
              echo "  ✓ $s"
            else
              echo "  !! 方案 $s 沒有部署成功"; fail=1
            fi
          done
          exit $fail

      # ⚠ **M-3 的重現,用真的 librime 跑,不是用猜的。**
      #   兩臂只差使用者目錄:有 default.custom.yaml / 空目錄。
      #   後者就是 .app 沒有附範本時使用者機器上的樣子。
      #   實測(run #101)結果比原本預期的更糟:B 那一臂**部署直接失敗**,
      #   一個方案都沒有 —— 上游 default.yaml 列了我們沒打包的 cangjie5/quick5。
      - name: 重現 — 少了 default.custom.yaml,引擎連部署都過不了
        run: ./apple/scripts/verify_schema_seed.sh

      - name: 斷言本體的反向測試（證明它真的會紅）
        run: |
          # 先證明斷言會失敗，再相信它的成功。
          ./apple/scripts/verify_console.sh --expect-fail nihao luna_pinyin_tw 這不可能是結果

      - name: 核心驗證 — 拼音 nihao → 你好
        run: ./apple/scripts/verify_console.sh nihao luna_pinyin_tw 你好

      - name: 核心驗證 — 注音 su3cl3 → 你好
        run: ./apple/scripts/verify_console.sh su3cl3 bopomofo_tw 你好

      # ── (a-2c) 候選翻頁:回答使用者的「翻不翻得了頁」 ────────────
      # 一頁的候選數來自 core/data/shared/default.yaml 的 menu/page_size(=5),
      # 四端同源;rs_snapshot 沒有任何天花板。所以「只有 5 個」是設定,
      # 而「下一頁就沒了」是另一件事 —— 這一關用真的 librime 分開這兩件事。
      # `=` / `-` 是 rime-prelude 的 paging_with_minus_equal(Page_Down / Page_Up)。
      - name: 核心驗證 — 候選真的翻得了頁（= 下一頁、- 上一頁）
        run: |
          set -uo pipefail
          set +e
          C=./apple/build/rime_console
          S=core/data/shared
          U=core/data/user
          # 抽 dump 那一行的「候選數」與「頁碼」。
          # ⚠ 只用 POSIX BRE:\| \+ \? 與 grep -P/\K 在 BSD 上不成立
          #   （docs/coordination.md §5 已經記過三次)。
          pageinfo() {
            printf '%s\n' "$1" \
              | sed -n 's/.*\[組字後\] 候選 \([0-9][0-9]*\) 個 (page \([0-9][0-9]*\).*/\1 \2/p' \
              | head -1
          }
          fail=0
          expect_page() {  # expect_page <按鍵> <期待頁碼> <說明>
            local out info count page
            out="$("$C" "$S" "$U" "$1" 1 luna_pinyin_tw 2>&1)"
            info="$(pageinfo "$out")"
            if [ -z "$info" ]; then
              echo "  !! [$3] 抽不出「候選 N 個 (page M」那一行 —— 抽取器壞了,不是沒有違規" >&2
              printf '%s\n' "$out" | grep '組字後' >&2
              fail=1; return
            fi
            count="${info%% *}"; page="${info##* }"
            if [ "$count" -le 0 ]; then
              echo "  !! [$3] 候選數是 $count —— 組字根本沒成立" >&2; fail=1; return
            fi
            if [ "$page" != "$2" ]; then
              echo "  !! [$3] 頁碼是 $page,期待 $2（按鍵「$1」）" >&2; fail=1; return
            fi
            echo "  ✓ [$3] 按鍵「$1」→ 候選 $count 個, page $page"
          }
          expect_page 'nihao'   0 '不按翻頁鍵'
          expect_page 'nihao='  1 '按 = 到下一頁'
          expect_page 'nihao=-' 0 '再按 - 回上一頁'
          # 一頁幾個是**設定**,不是上限。把它印出來當紀錄(不斷言數字,
          # 那是 core/data/ 的決定,協調端隨時可以改)。
          echo "一頁候選數的來源:"
          grep -n -A1 '^menu:' "$S/default.yaml" | sed 's/^/    /'
          [ "$fail" -eq 0 ] || exit 1
          echo "候選翻頁在核心層是通的 ✓（畫面上有沒有路是另一回事,見 apple/README.md §3）"

      # ── (a-2b) 使用者加的詞:證明那份 TSV 真的會影響輸出 ────────
      # 這一關驗的是 docs/settings-model.md §5 的格式。純邏輯測試只能證明
      # 我們**寫出**了正確的檔案,證明不了 librime **讀得懂**它 ——
      # 而「檔案格式其實沒生效」正是那種畫面完全正常的缺陷。
      #
      # ⚠ **這一關曾經是 `continue-on-error: true`**,因為它是紅的,
      #   而「自己加的詞」那一頁據此被下架。2026-08-09 找到原因(編碼欄的空格)
      #   並修好之後,它變成硬失敗,那一頁也回到線上。
      #   **它紅了就代表那一頁又變成「按得下去但什麼都不會發生」——
      #   那時要做的是修它,或把那一頁再拿下來,不是把這裡改回 continue-on-error。**
      - name: 使用者加的詞真的會改變輸出（綠了才准上架那一頁）
        run: ./apple/scripts/verify_user_dict.sh

      # ── (a-3) 輸入法本體 + 設定介面 ────────────────────────────
      - name: 建 LuminaKey.app（輸入法 + 內嵌的設定介面）
        run: ./apple/scripts/build_app.sh

      - name: 驗證 .app 的結構與 IMKit 宣告
        run: ./apple/scripts/verify_app_bundle.sh

      # ⚠ 一次植入三個違規、只斷言「有東西紅了」是不夠的:那證明不了
      #   **哪一條**斷言在做事,而沒在做事的那幾條看起來完全一樣。
      #   改成一次一個違規,而且斷言紅的是**它自己那一行**。
      #   其中「多打包了 core/layouts/」那條反向斷言在這之前從來沒有被
      #   反向驗過 —— 它可以整條被刪掉而 CI 全綠。
      - name: bundle 驗證的反向測試（7 個變異,每個都要紅在自己那一條）
        run: |
          set -uo pipefail
          # ⚠ Actions 的預設 shell 是 `bash -e {0}` —— errexit **本來就開著**,
          #   而 `set -uo pipefail` 不會把它關掉。留著的話,底下
          #   `out="$(verify_app_bundle.sh --expect-fail ...)"` 一旦回非零,
          #   整個 step 會在**印出原因之前**就被掐掉,於是唯一需要那段診斷的
          #   時候它不存在。失敗由這支腳本自己判定,所以明確關掉。
          set +e
          SRC=apple/build/LuminaKey.app
          PB=/usr/libexec/PlistBuddy
          BROKEN=/tmp/Broken.app
          fails=0

          fresh() { rm -rf "$BROKEN"; cp -R "$SRC" "$BROKEN"; }

          expect() {  # expect <這個變異的名字> <輸出裡必須出現的那一行>
            local label="$1" want="$2" out rc
            out="$(./apple/scripts/verify_app_bundle.sh --expect-fail "$BROKEN" 2>&1)"
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "!! [$label] 壞掉的 bundle 竟然通過了全部斷言（結束碼 $rc）"
              printf '%s\n' "$out"
              fails=$((fails + 1))
              return
            fi
            # ⚠ 不用 `grep -q`:本步驟開了 pipefail,命中即結束會讓上游收到
            #   SIGPIPE,整條 pipeline 判失敗（這個專案已經被咬過兩次）。
            #   用 shell 自己的 case 比對,不經管線。
            case "$out" in
              *"$want"*) echo "  ✓ [$label] 紅在對的地方：$want" ;;
              *) echo "!! [$label] 紅了,但不是因為「$want」："
                 printf '%s\n' "$out"
                 fails=$((fails + 1)) ;;
            esac
          }

          # 1. 少了連線名 → IMKServer 建不起來（裝得起來、按鍵沒反應）
          fresh
          "$PB" -c "Delete :InputMethodConnectionName" "$BROKEN/Contents/Info.plist"
          expect "少了 InputMethodConnectionName" "✗ InputMethodConnectionName"

          # 2. 類別名對不上 → NSClassFromString 回 nil。這一條由二進位自己
          #    照 IMKit 的作法查一次（--self-check），不是 grep 符號表。
          fresh
          "$PB" -c "Set :InputMethodServerControllerClass NoSuchClass" \
            "$BROKEN/Contents/Info.plist"
          expect "ServerControllerClass 指向不存在的類別" "✗ 二進位 --self-check 失敗"

          # 3. TISInputSourceID 沒有以 bundle id 為前綴 → 系統不列出這個輸入模式
          fresh
          "$PB" -c "Set :ComponentInputModeDict:tsInputModeListKey:org.luminakey.inputmethod.LuminaKey.Hant:TISInputSourceID com.example.NotOurs" \
            "$BROKEN/Contents/Info.plist"
          expect "TISInputSourceID 前綴不對" "✗ 每個 TISInputSourceID"

          # 4. 資源沒進 bundle
          fresh
          rm -rf "$BROKEN/Contents/Resources/themes"
          expect "沒有隨附主題" "✗ 隨附主題"

          # 5. **反過來的那一條**：多帶了東西也是錯的。
          #    桌面沒有軟鍵盤,core/layouts/ 進了 bundle 會讓人以為有。
          fresh
          mkdir -p "$BROKEN/Contents/Resources/layouts"
          expect "多打包了 core/layouts/" "✗ 沒有打包 core/layouts"

          # 6. **沒有使用者初始配置範本。** 少了它,librime 會照上游
          #    rime-prelude 的 default.yaml 部署,而那份 schema_list 裡沒有
          #    我們實際打包的臺灣字形方案,卻有兩個我們沒有打包的 ——
          #    真機上的症狀是「設定裡一列方案都沒有勾」。
          fresh
          rm -rf "$BROKEN/Contents/Resources/UserTemplate"
          expect "少了使用者初始配置範本" "✗ 隨附了使用者初始配置範本"

          # 7. **範本在,但寫錯了。** 後果與第 6 條一模一樣,而「檔案在不在」
          #    這種斷言完全看不出差別 —— 這一條就是為了不讓第 6 條變成
          #    「只要有個檔案就好」。
          fresh
          cat > "$BROKEN/Contents/Resources/UserTemplate/default.custom.yaml" <<'YAML'
          patch:
            schema_list:
              - schema: luna_pinyin_tw
              - schema: no_such_schema
          YAML
          expect "範本列了沒有打包的方案" "✗ 範本列的方案都有對應的 .schema.yaml"

          rm -rf "$BROKEN"
          if [ "$fails" -ne 0 ]; then
            echo "!! $fails 個反向測試沒有紅在對的地方" >&2
            exit 1
          fi
          echo "7 個變異全部紅在自己那一條 ✓"

      # ⚠ **「輕點 Shift 切中英」這件事的守門,自己必須被驗過。**
      #
      #   `LuminaKeyInputController.recognizedEvents(_:)` 少了那一行,IMKit
      #   就只送 keyDown,而修飾鍵在 macOS **不產生 keyDown** —— 於是
      #   ModifierTracker、processFlags()、librime 的 ascii_composer 這一整條
      #   路徑一次都不會被走到:使用者輕點 Shift 什麼都不會發生,沒有錯誤訊息,
      #   而單元測試照樣全綠(它們測的是純邏輯,碰不到 IMKit)。
      #
      #   所以這裡把那一行換成「IMKit 的預設值」、**真的重建一次**,
      #   斷言 `--self-check` 紅在它自己那一條;然後還原、再建一次、必須綠。
      #   植入之後先斷言檔案真的變了 —— 沒植入成功的樹當然是綠的,
      #   而報表上會寫成「守門不算數」,讀起來像守門有問題。
      - name: 中英切換守門的反向測試（拿掉宣告 → 重建 → --self-check 必須紅）
        run: |
          set -uo pipefail
          set +e
          SRC=apple/LuminaKey/AppSources/LuminaKeyInputController.swift
          BIN=apple/build/LuminaKey.app/Contents/MacOS/LuminaKey
          cp "$SRC" /tmp/controller.bak

          sed -i '' 's/Int(IMKRecognizedEvents\.mask)/Int(IMKRecognizedEvents.imkitDefault)/' "$SRC"
          if cmp -s "$SRC" /tmp/controller.bak; then
            echo "!! 變異沒有植入成功（錨點對不上）—— 這一關不算數" >&2
            cp /tmp/controller.bak "$SRC"
            exit 1
          fi

          ./apple/scripts/build_app.sh >/tmp/mutbuild.log 2>&1
          if [ $? -ne 0 ]; then
            echo "!! 變異版建不起來,反向測試無法進行" >&2
            tail -30 /tmp/mutbuild.log >&2
            cp /tmp/controller.bak "$SRC"
            exit 1
          fi

          OUT="$("$BIN" --self-check 2>&1)"; RC=$?
          cp /tmp/controller.bak "$SRC"

          rc_ok=1
          if [ "$RC" -eq 0 ]; then
            echo "!! 拿掉宣告之後 --self-check 竟然還是綠的 —— 那道守門沒有在守" >&2
            printf '%s\n' "$OUT" >&2
            rc_ok=0
          fi
          # ⚠ 不用 grep -q（本步驟的 pipeline 會 SIGPIPE，本專案被咬過兩次）。
          case "$OUT" in
            *"✗ controller 宣告要收 flagsChanged"*)
              echo "  ✓ 紅在對的那一條" ;;
            *) echo "!! 紅了,但不是因為那一條:" >&2
               printf '%s\n' "$OUT" >&2
               rc_ok=0 ;;
          esac

          echo "== 還原並重建 =="
          ./apple/scripts/build_app.sh >/tmp/rebuild.log 2>&1 \
            || { echo "!! 還原之後建不起來" >&2; tail -30 /tmp/rebuild.log >&2; exit 1; }
          "$BIN" --self-check || { echo "!! 還原之後 --self-check 仍然是紅的" >&2; exit 1; }
          [ "$rc_ok" -eq 1 ] || exit 1
          echo "中英切換的守門:拿掉會紅、放回去會綠 ✓"

      # ── (a-4) 安裝:這一輪新增,對應真機回報的兩個缺陷 ──────────
      - name: 做出 .pkg 安裝檔
        run: ./apple/scripts/build_pkg.sh

      - name: 真的裝一次,並問系統認不認得這個輸入法
        run: ./apple/scripts/verify_pkg.sh

      - name: 打包核心產物
        run: ./apple/scripts/package_core.sh

      - name: 上傳核心產物
        uses: actions/upload-artifact@v4
        with:
          name: rime-macos-core
          path: apple/build/dist/*.tar.gz
          if-no-files-found: error

      - name: 打包 .app
        run: |
          cd apple/build
          # 用 tar 而不是讓 upload-artifact 直接吃目錄:zip 會丟掉執行權限
          # 與符號連結,解開之後的 .app 是壞的。
          tar czf LuminaKey-app-$(uname -m).tar.gz LuminaKey.app
          ls -lh LuminaKey-app-*.tar.gz

      - name: 上傳 .app
        uses: actions/upload-artifact@v4
        with:
          name: rime-macos-app
          path: apple/build/LuminaKey-app-*.tar.gz
          if-no-files-found: error

      # ⚠ 這是使用者實際會拿到的東西。上傳成獨立的 artifact,
      #   免得他又要從一包 tar 裡自己找出 .app 並手動放進隱藏目錄。
      - name: 上傳 .pkg（使用者雙擊安裝的那一份）
        uses: actions/upload-artifact@v4
        with:
          name: rime-macos-installer
          path: apple/build/dist/LuminaKey-*.pkg
          if-no-files-found: error
