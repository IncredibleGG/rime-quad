# luminakey_charset.custom.yaml —— 字集守門接進方案的那一份 patch
#
# scripts/collect_charset_guard.sh 把這一份**原封不動**複製成
#   <shared>/luna_pinyin.custom.yaml
#   <shared>/bopomofo.custom.yaml
#   <shared>/t9_pinyin.custom.yaml
# 三份。librime 會自動把 `xxx.custom.yaml` 套在 `xxx.schema.yaml` 上，
# 不必去改上游的方案檔（上游日後更新才不會衝突）。`luna_pinyin_tw` 與
# `bopomofo_tw` 靠 `__include:` 繼承母方案，所以也一起吃到。
#
# ⚠ 使用者自己在 user_data_dir 放同名檔案時，那一份會**蓋掉**這一份
#   （librime 的搜尋順序是 user 先、shared 後）。那是 RIME 的既有契約，
#   代價是：使用者一旦自訂 luna_pinyin.custom.yaml，字集守門就沒了。
patch:
  # ── 1. 字集守門。實作在 <shared>/lua/luminakey_charset.lua。
  #
  # ⚠ 位置是 `@before last`，**不是** `@next`。
  #   上游的 filters 最後一個是 uniquifier，而 uniquifier 的去重是拿
  #   「Menu 已經收下的候選」來比對的。librime-lua 的 translation 會比 Menu
  #   **先跑一步**（要先知道下一個在不在，才答得出 exhausted），所以把 lua
  #   filter 掛在 uniquifier 後面時，uniquifier 問「這個字已經有了嗎」的那一刻
  #   前一個候選還沒被 Menu 收下 —— 去重就失效了。
  #
  #   實測（emulator-5558，luna_pinyin_tw，簡體，打 nihao）：
  #     @next        → 你好  你好  逆号  拟好  你      ← 補表把「妳好」轉成「你好」，兩個沒併
  #     @before last → 你好  逆号  拟好  你    拟      ← 併掉了，後面往前遞補
  #   兩者的候選數都是 5，畫面上看不出哪裡不對，只是多了一個一模一樣的字。
  "engine/filters/@before last": lua_filter@*luminakey_charset

  # ── 2. 補充轉換表。轉得掉的先轉掉 —— 轉掉不損失候選，濾掉會。
  #      只換掉 zh_hans 與 zh_hant_tw 兩支的設定檔，鏈的前半段與上游一致。
  #      zh_hant_hk（香港字形）維持 t2hk.json：Big5 不是香港的字集，
  #      要補它得先有 HKSCS 的判準，那不在這一版裡。
  "zh_hans/opencc_config": luminakey_t2s.json
  "zh_hant_tw/opencc_config": luminakey_t2tw.json
