name: Windows (核心驗證 + TSF)

# 這個 workflow 分成兩個 job,分界線是「要不要 librime」:
#
#   logic-x64  幾分鐘。瘦 DLL、單元測試、真實鍵盤佈局測試、二進位結構檢查。
#              **不需要 librime** —— 那本身就是架構的驗證:TSF 的 DLL 被載入到
#              每一個宿主進程裡,它如果需要 librime 才編得起來,就代表
#              librime 跑進了瀏覽器與提權進程。
#   core-x64   十幾分鐘(有快取時幾分鐘)。librime + 服務進程 + 端到端 IPC 驗證。
#
# ⚠ **綠燈不等於能用。** TSF 需要註冊 COM in-proc server 並有真實的文字輸入
#   情境,`windows-latest` runner 上做不到。所以:
#
#   CI 驗得到:編得起來、匯出的 COM 進入點齊全、DLL 沒有意外的相依、
#             按鍵映射(含真實的德文/法文佈局)、線路格式的編解碼、
#             組字政策、候選窗排版、fail-open 狀態機、
#             以及**經由真的具名管道**驅動服務打出「你好」。
#
#   ⚠ 這一輪從「驗不到」搬走了一大塊:**TSF 那一整條現在驗得到了。**
#     windows/verify_tsf.sh 用 rime_tsf_host.exe(一個假的文字編輯器)
#     建 ITfThreadMgr、給 ITextStoreACP 焦點、啟用我們的語言設定檔、
#     用 ITfKeystrokeMgr 送按鍵,於是系統會真的去讀登錄檔、
#     CoCreateInstance、把 rime_tsf.dll 載進來、呼叫 ActivateEx。
#     使用者回報的「切過去、一個字都打不出來、也沒有任何 UI」撞的正是這一段,
#     而在這之前 CI 從來沒有走過它(verify_ime.sh 走的是具名管道,繞過 TSF)。
#
#   CI 仍然驗不到:候選窗的樣子與位置、高 DPI、在**真的**記事本/瀏覽器/
#             Office/市集 App 裡的行為、語言列按鈕與系統匣圖示長什麼樣、
#             以及「每一顆鍵是不是都真的做了它宣稱的事」。
#             清單見 windows/README.md。
#
#   這個專案吃過「編得出來不等於能用」的虧:編譯成功、單元測試全過、
#   發布關卡全綠,而使用者一裝就按鍵永久變灰。**不要因為這裡綠了就說做完了。**

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────
  # 接線稽核(Ubuntu)。
  #
  # ⚠ 這個 job 補的是一格**空的**:`windows/audit_single_source.sh` 在這一輪
  #   之前**一次都沒有在任何車道上跑過**。它只掛在 `windows/run_logic_tests.sh`
  #   的尾巴,而那一支沒有任何 workflow 呼叫 —— 也就是說規則 4(輕點 Shift
  #   的狀態機有沒有真的接在 TSF 的 sink 上)與規則 5(換方案時傳進去的是
  #   哪兩份偏好)守的是**開發機**,不是這條車道。下面 logic-x64 的
  #   `rime_tests.exe` 只跑得到純函式那一半,而這兩條規則守的正好是
  #   「純函式驗不到的那一格」。
  #
  # ⚠ 為什麼不併進 logic-x64:那一支已經跑到 26 分鐘(見它的 timeout 註解),
  #   而這裡只需要 bash + python3,不編譯,一分鐘以內。
  #
  # ⚠ 兩步都要。第二步(--self-check)把 16 個植入各跑一次,證明第一步的
  #   綠燈算數 —— 這個專案的教訓一向不是「程式碼寫錯」,是「守門的東西
  #   沒有人守」(verify_product_ids.sh 6/6 全綠、check_ui_spec.sh 的 W29
  #   過期後蓋住訊號,兩個前科)。
  # ────────────────────────────────────────────────────────────────
  wiring-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        shell: bash

    steps:
      - name: 取出原始碼
        uses: actions/checkout@v4

      - name: 單一來源稽核(含輕點 Shift 的接線、換方案的簡繁來源)
        run: ./windows/audit_single_source.sh

      - name: 反向測試（每一個植入都必須真的會紅）
        run: ./windows/audit_single_source.sh --self-check

  # ────────────────────────────────────────────────────────────────
  # 設定介面的規範檢核(Ubuntu)。
  #
  # ⚠ 為什麼**不**留在 logic-x64 裡:`--self-check` 要把每一個植入各跑一次
  #   完整的 check_ui_spec.sh,而在 Windows runner 上一次要十幾秒。b1w 補了
  #   W38/W39/W40 三組(滾輪翻頁、頁碼、簡繁快捷鍵)之後,這一步在 ship 上
  #   實測跑了 **3485 秒還沒跑完**,把 logic-x64 整整 60 分鐘的額度吃光,
  #   job 被 runner 砍掉,結論是 cancelled。
  #
  # ⚠ 而真正的傷害不是慢,是**排在它後面的十關一步都沒跑**:二進位結構檢查、
  #   真的經過 TSF、離線稽核、產品識別碼逐列對帳、安裝程式在地化 ……
  #   全部 skipped。**cancelled 的 job 與 skipped 的步驟在 checks 上是灰的,
  #   不是紅的** —— 看起來跟「沒有問題」一模一樣。這正是這份 workflow 在
  #   logic-x64 的 timeout 註解裡已經寫過一次的教訓,這次換一個地方重演。
  #
  # ⚠ 判準與上面 wiring-audit 同一條:這兩步只要 bash + python3,只讀
  #   windows/ 底下的 .cc/.h 原始碼,**不編譯、不需要真的 Windows**,
  #   所以它們沒有理由佔著 windows-latest 的額度。搬到 Ubuntu 之後
  #   它與 logic-x64 平行跑,牆鐘時間不增加。
  #
  # ⚠ 兩步都要,理由與 wiring-audit 同一條:第二步證明第一步的綠燈算數。
  # ────────────────────────────────────────────────────────────────
  ui-spec:
    runs-on: ubuntu-latest
    # 實測:同樣這 147 條反向測試,在 Ubuntu 上 14m26s 跑完(EXIT=0),
    # 在 windows-latest 上跑了 3485 s 還沒跑完。同一份腳本、同一棵樹。
    # 45 分鐘 = 對實測值留約三倍餘裕(GitHub 的 runner 比這台建置機慢,
    # 而且這一步的成本隨植入條數線性成長,下一批再加幾組就會再長一截)。
    # ⚠ 它如果又逼近上限,正確的動作是**讓它變快或再拆**,不是無止境地
    #   加時間 —— 加時間這條路 30 → 60 已經走過一次了。
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      - name: 取出原始碼
        uses: actions/checkout@v4

      # ── 設定介面的規範檢核（docs/ui-design.md §12.12）────────────
      #
      # 23 條裡有 22 條機器驗得了,而**沒有一條需要真的 Windows** ——
      # 版面、色票、狀態列位置還原、候選窗排版全部抽成純函式,
      # 所以它們落在 logic-x64 的 `rime_tests.exe` 那一步裡(不是這裡);
      # 這一步是對原始碼的靜態掃描。
      #
      # ⚠ 但也因此,它們一條都證明不了「畫出來好看」或「按下去真的有反應」。
      #   那兩件事仍然在「人」那一欄,清單見 windows/README.md。
      - name: 設定介面規範檢核（§12.12）
        run: ./windows/check_ui_spec.sh

      # ⚠ 與「框架必須會紅」同一個約定,而且這一步**真的抓到過東西**:
      #   W7(catalog 以外不得有中文字面值)第一版用 `grep '[CJK 範圍]'`,
      #   而它在某些 locale 下回 "Invalid collation character"。
      #   stderr 被導去 /dev/null,於是錯誤變成零命中變成通過 ——
      #   那一條從第一天起就是假綠的,是這個反向測試把它翻出來的。
      - name: 反向測試（每一條檢核都必須真的會紅）
        run: ./windows/check_ui_spec.sh --self-check

  # ────────────────────────────────────────────────────────────────
  # 快速 job:不碰 librime。開發時最常紅的就是這一組,所以讓它先跑完。
  # ────────────────────────────────────────────────────────────────
  logic-x64:
    runs-on: windows-latest
    # ⚠ 30 分鐘不夠,而不夠的方式很難看:job 被 runner 砍掉,結論是
    #   **cancelled 而不是 failure**,已經跑過的那十幾步照樣顯示綠色,
    #   排在後面的每一關則是 skipped —— 兩種都是灰的,不是紅的。
    #
    #   這件事踩過兩次:第一次(run 31505165420)第 15 步跑完就 26 分鐘,
    #   於是 30 → 60;第二次是 ship 這一輪 —— b1w 補了 W38/W39/W40 之後,
    #   「反向測試（每一條檢核都必須真的會紅）」一步跑了 3485 秒還沒跑完,
    #   把 60 分鐘全部吃光,**後面十關一步都沒跑**。
    #
    #   第二次的修法不是再加時間:那兩步只要 bash + python3、不編譯、
    #   不需要真的 Windows,已經搬到上面的 ui-spec(Ubuntu,平行跑)。
    #   現在這裡最慢的是編譯與真的載入 DLL 那幾步,60 分鐘綽綽有餘。
    #   ⚠ 這個數字下次要再往上加之前,先問「是不是又有一步該搬走了」。
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    env:
      ARCH: x64

    steps:
      # runner 的系統 gitconfig 預設 core.autocrlf=true。不關掉的話 checkout
      # 會把所有 LF 換成 CRLF,bash 腳本的 shebang 變成 `#!/usr/bin/env bash\r`
      # 而直接無法執行。必須在 checkout **之前**設。
      - name: 關掉 autocrlf
        run: |
          git config --global core.autocrlf input
          git config --global core.longpaths true

      - name: 取出原始碼
        uses: actions/checkout@v4

      - name: 安裝 Ninja
        run: pip install ninja

      # 這一組不需要釘住 CMake 3.x —— 那個限制來自 librime 的
      # find_package(Boost),與瘦 DLL 和單元測試無關。runner 自帶的就夠。
      - name: 建置瘦 DLL、單元測試、probe
        run: ./windows/build.sh logic

      - name: 單元測試
        run: ./third_party/build/windows-x64/logic/bin/rime_tests.exe

      # 反向測試。這個專案有過「測試是綠的,因為它沒在測」:
      # 發布關卡的升級測試因步驟順序寫反被判「略過」而報出一片全綠。
      # 這一步故意讓一個斷言失敗,並要求它**非零結束** ——
      # 上面那一步的綠燈要成立,得先證明它會紅。
      - name: 反向測試（框架必須會紅）
        run: |
          if ./third_party/build/windows-x64/logic/bin/rime_tests.exe --self-check; then
            echo "!! --self-check 竟然以 0 結束 —— 測試框架不會紅,上面的綠燈都不算數" >&2
            exit 1
          fi
          echo "反向測試通過:框架會紅"

      # 匯出的四個 COM 進入點齊不齊、DLL 有沒有意外的相依。
      # 後者守的是 /MT:相依到 VCRUNTIME140.dll 的話,在沒裝 VC++ 執行檔套件
      # 的機器上 DLL 會在載入階段失敗,而症狀是「輸入法在某些程式裡不存在」。

      # 已推翻的主張不可以在別處以現況陳述留著。判準很窄:只追
      # docs/refuted-claims.tsv 裡逐字登記過的那幾句(集合封閉,誤報率 0)。
      # ⚠ 自我檢查證兩個方向 —— 沒有記號要紅,補上記號要綠。
      #   只證會紅的話,一支永遠紅的守門也會通過。
      - name: 已推翻的主張沒有留在樹上(自我檢查)
        run: ./windows/check_refuted_claims.sh --self-check

      - name: 已推翻的主張沒有留在樹上
        run: ./windows/check_refuted_claims.sh

      # ── 升級不重開機那一節的判準,自己先驗一次 ────────────────
      #
      # ⚠ windows/verify_installer.sh 只有在**真的裝過一次**的 runner 上
      #   才跑得完(core-x64 的最後面),而它 §13 的紅線
      #   「升級沒有把任何東西排進開機佇列」以前只問了一個檔名
      #   (rime_tsf.dll)。那一節的宣稱比它驗的大很多,中間的差距
      #   (rime_service.exe、data\shared 的四十份 yaml、.ocd2)全是綠的。
      #
      #   判準本身是純文字處理,所以它可以在這裡先被驗一次:
      #   --self-check-pending 餵合成的佇列內容,並且逐項證明
      #   **舊判準漏掉、新判準抓到**。
      - name: 開機佇列的判準必須抓得到不只 rime_tsf.dll
        run: ./windows/verify_installer.sh --self-check-pending

      - name: 二進位結構檢查（匯出符號、相依白名單、**瘦 DLL 零網路相依**）
        run: ./windows/check_binaries.sh third_party/build/windows-x64/logic/bin

      # 離線稽核。Android 端的 scripts/audit_offline.sh 在原始碼層面守
      # 「整個 app 只有一個檔案碰得到網路」,這一支是 Windows 端的對應物,
      # 而主張現在與 Android 一樣:**只有 service/net_gate.cc 一個檔案**。
      # ⚠ 那支腳本的允許清單比對的是**路徑**不是檔名,而且會反過來斷言
      #   那個路徑真的存在、真的碰得到網路 API —— 出口哪天搬走了,
      #   留在原地的豁免就是一個沒有人守著的洞。
      # ⚠ 這一步是這一輪加的,而且它補的是**使用者實際撞到的那一段**。
      #
      # 在它之前,「切到這個輸入法之後 ActivateEx 有沒有被呼叫」整條是紙上的:
      # CI 驗得到註冊、驗得到引擎、驗得到經由具名管道打出「你好」,
      # 就是沒有一格經過「系統把 DLL 載入宿主進程」這件事。
      #
      # 它會**動到這台機器的登錄檔**(全機註冊),所以腳本裡有 trap 保證
      # 反註冊;沒有的話,同一台快取機器上的下一個 job 會在
      # verify_installer.sh 的第一條斷言(「安裝之前 check 必須紅」)失敗,
      # 而那個失敗看起來與這裡完全無關。
      #
      # 快速 job 裡沒有服務也沒有詞庫,所以只要求走到 ActivateEx 與
      # 「按鍵映得出 keysym」。真的打出字那一段在 install-x64 裡(--full)。
      - name: 真的經過 TSF（載入 DLL → ActivateEx → 送按鍵）
        run: ./windows/verify_tsf.sh --bin third_party/build/windows-x64/logic/bin

      - name: 離線稽核（原始碼層面:只有 net_gate.cc 碰得到網路 API）
        run: ./windows/audit_offline_win.sh

      # 與上面「框架必須會紅」同一個約定:--self-check 植入**兩個**真的
      # WinHttpOpen 呼叫,並要求腳本**非零結束**。一支只會印綠字的稽核
      # 腳本比沒有更糟 —— 它讓人以為有人在看。
      # 兩個植入分別是:普通檔案開始連網、以及**檔名與允許清單相同但
      # 路徑不同**的檔案 —— 後者是這條豁免最容易被繞過的方式。
      - name: 反向測試（離線稽核必須抓得到植入的違規）
        run: |
          if ./windows/audit_offline_win.sh --self-check; then
            echo "!! 植入了一個真的 WinHttpOpen 呼叫,稽核腳本卻以 0 結束 —— 它不會紅" >&2
            exit 1
          fi
          echo "反向測試通過:離線稽核會紅"

      # 安裝程式最貴的失敗模式是「忘了把執行期資料包進去」——
      # 那樣的話安裝程式編得出來、安裝成功、輸入法也註冊得上,
      # 然後一個字都打不出來,而且沒有任何錯誤訊息。
      # make_installer.sh 有一道逐項點名的 payload 檢查在擋它;
      # 這一步用一棵故意殘缺的樹去跑那道檢查,要求它真的紅。
      # 放在快速 job 是因為它只是 shell 邏輯,不需要 librime、也不需要 ISCC。
      - name: 反向測試（安裝包資料檢查必須會紅）
        run: ./windows/make_installer.sh --self-check

      # ⚠ 這一步存在的理由是**迴圈長度**。
      #
      # ISCC 是逐段解析的:前面一段語法錯了就中止,後面的 [Messages] / [Code]
      # 根本沒被看過。而真正的安裝程式建置在 core-x64 的最後面 —— 一輪二十分鐘,
      # 一次只能發現一個錯。(實測:第一次就是這樣,[UninstallRun] 的一個旗標
      # 讓整段 [Messages] 與 [Code] 都還沒被檢查過。)
      #
      # 這裡用一棵**假的** payload 把同一份 .iss 完整編一次。不需要 librime、
      # 不需要執行期資料,四分鐘就有答案。內容對不對不是這一步的事。
      # ⚠ 使用者走完整個解除安裝流程,在**最後一個對話框**撞到一句英文
      #   (Inno 內建的 UninstalledAndNeedsRestart),而標題與按鈕是中文。
      #   原因是我們原本只覆寫了自己想得到的 34 句,其餘 247 句照樣是英文 ——
      #   它們平常不會出現,所以「前面沒撞到」完全不代表沒有。
      #
      #   「我逐頁走了一遍」不是一個可以維護的答案:下一個人加一個區段、
      #   或 Inno 升版多了幾句,英文就又漏出來,而且一樣要等使用者回報。
      #   這一步拿 ISCC 自己的 Default.isl 逐句對帳(含佔位符),
      #   而且它會在**漏翻**與**打錯 ID**(ISCC 對打錯的 ID 是安靜忽略的)
      #   兩種情況下都紅。
      - name: 安裝程式的每一句話都在地化了嗎（含反向測試）
        run: ./windows/check_installer_messages.sh --self-check

      - name: 安裝程式腳本必須編得過（快速把關）
        run: ./windows/make_installer.sh --lint

      # ── 產品識別碼逐列對帳 ──────────────────────────────────────
      #
      # 寫進使用者磁碟與登錄檔的名字(資料夾、設定檔、視窗類別、COM 描述、
      # 具名管道…)必須逐字等於 scripts/lib/product.env 推出來的值。
      #
      # ⚠ 為什麼這是一個**獨立**的關卡而不是靠編譯期:改名改一半在
      #   編譯期、單元測試、發布關卡全部是綠的。Windows 端更安靜,因為
      #   這裡的名字有一半是目錄名 —— 解除安裝去刪一個不存在的資料夾時,
      #   它會回報成功。
      #
      # 這一步含**逐列反向測試**:每一列都會被真的改回舊名一次,
      # 要求它只紅在自己那一行。放在快速 job 是刻意的:它不需要
      # librime、不需要 Windows 的任何東西,幾秒鐘就有答案。
      - name: 產品識別碼逐列對帳（含逐列反向測試）
        run: ./windows/verify_product_names.sh

      - name: 上傳瘦 DLL 與測試執行檔
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-logic-${{ github.sha }}
          path: |
            third_party/build/windows-x64/logic/bin/
            third_party/build/windows-x64/*.log
            third_party/build/windows-x64/logic/bin/tsf-verify/
          if-no-files-found: warn

  # ────────────────────────────────────────────────────────────────
  # 重 job:librime + 核心驗證 + 服務進程 + 端到端 IPC 驗證。
  # ────────────────────────────────────────────────────────────────
  core-x64:
    runs-on: windows-latest
    timeout-minutes: 150

    defaults:
      run:
        shell: bash

    env:
      ARCH: x64
      BOOST_VERSION: 1.89.0
      # CMake 4 移除了 FindBoost,而 librime 靠 find_package(Boost) 找 header-only
      # 的 Boost —— 非 LINUX 分支不帶 REQUIRED,所以 4.x 上不會報錯,只會在編譯時
      # 噴一整片找不到 boost 標頭。釘住 3.x 的理由與 Android 端釘 cmake 3.22.1 相同。
      PINNED_CMAKE: 3.31.6

    steps:
      - name: 關掉 autocrlf
        run: |
          git config --global core.autocrlf input
          git config --global core.longpaths true

      - name: 取出原始碼
        uses: actions/checkout@v4

      - name: 釘住 CMake ${{ env.PINNED_CMAKE }}
        shell: pwsh
        run: |
          $ver = "${{ env.PINNED_CMAKE }}"
          $url = "https://github.com/Kitware/CMake/releases/download/v$ver/cmake-$ver-windows-x86_64.zip"
          $zip = "$env:RUNNER_TEMP\cmake.zip"
          $dst = "$env:RUNNER_TEMP\cmake"
          $bin = "$dst\cmake-$ver-windows-x86_64\bin"
          # 下載會偶發中斷 —— 2026-08-12 這條車道就紅在
          #   Invoke-WebRequest: The response ended prematurely. (ResponseEnded)
          # 那是網路,不是任何一份改動;但單次嘗試會讓整條車道紅在一個與
          # 產品完全無關的地方,而**那種紅看久了就會被當成雜訊**,
          # 真的缺陷混進來時就沒有人看了。所以重試,而不是重跑一次 CI。
          #
          # 解壓也放進重試裡:截斷的 zip 照樣是一個非空檔案,
          # 「解得開」才是這一步真正要的東西,所以用它當完整性檢查。
          $ok = $false
          foreach ($i in 1..4) {
            try {
              if (Test-Path $zip) { Remove-Item $zip -Force }
              if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
              Invoke-WebRequest -Uri $url -OutFile $zip
              Expand-Archive -Path $zip -DestinationPath $dst -Force
              if (-not (Test-Path "$bin\cmake.exe")) { throw "解開了但沒有 $bin\cmake.exe" }
              $ok = $true
              break
            } catch {
              Write-Host ("第 {0} 次取 CMake {1} 失敗:{2}" -f $i, $ver, $_.Exception.Message)
              Start-Sleep -Seconds (5 * $i)
            }
          }
          if (-not $ok) {
            Write-Host "::error::連續 4 次取不到 CMake $ver —— 這是網路,不是這份改動"
            exit 1
          }
          # 釘住的版本要真的是跑起來的那一個,不然 build.sh 會拿到「另一個
          # CMake」,而那件事會變成一個看不懂的建置錯誤,離成因很遠。
          $got = (& "$bin\cmake.exe" --version | Select-Object -First 1)
          Write-Host ("釘到的 CMake:{0}" -f $got)
          if ($got -notmatch [regex]::Escape($ver)) {
            Write-Host "::error::釘的是 $ver,實際跑起來的是「$got」"
            exit 1
          }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # 同時以絕對路徑交給 build.sh(它讀 $CMAKE)。vcvars 會把 VS 自帶的
          # CMake 加進 PATH,可能蓋掉這裡釘的版本 —— 絕對路徑不受 PATH 影響。
          "CMAKE=$bin\cmake.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Ninja(不用 Visual Studio 產生器)。理由見 windows/build.sh 的註解:
      # VS 產生器的名字裡帶著 VS 版本號,會把 CMake 版本和 runner 的 VS 版本綁死。
      # 上游 librime 的 Windows CI 同樣是 Ninja + MSVC。
      - name: 安裝 Ninja
        run: pip install ninja

      - name: 確認工具鏈
        run: |
          ver="$("$CMAKE" --version)"
          echo "$ver"
          ninja --version
          # 刻意不用 `cmake --version | head -1 | grep`:head 讀完就關掉 pipe,
          # cmake 可能收到 SIGPIPE 以 141 結束,配上 GitHub 預設的 pipefail
          # 就是**間歇性**失敗 —— 比明確的失敗難查得多。
          case "$ver" in
            *"${PINNED_CMAKE}"*) ;;
            *) echo "cmake 不是釘住的 ${PINNED_CMAKE}" >&2; exit 1 ;;
          esac

      # librime + 5 個相依編一次要十幾分鐘,而它們只由釘住的 commit 決定。
      # key 帶上 build.sh **與 scripts/fetch_librime.sh** 的雜湊:改了建置選項或
      # 換了 librime 的 commit,就必須重編。少了 fetch_librime.sh 那一半,
      # 「換引擎但快取沒失效」會安靜地拿舊 prefix 繼續跑 —— 那種漂移最難查。
      #
      # 用 restore + save 而不是 cache:save 那一步必須 `if: success()`。
      # actions/cache 的 post step 不管成敗都會存,那會把一份**建到一半就失敗的**
      # prefix 存進去,之後每一輪都命中它、跳過重建,然後以完全無關的方式失敗。
      - name: 還原已建置的 librime 與相依
        id: cache-prefix
        uses: actions/cache/restore@v4
        with:
          path: third_party/build/windows-x64/prefix
          key: winprefix-x64-${{ hashFiles('scripts/fetch_librime.sh', 'windows/build.sh') }}-v1

      # Boost 只有建 deps 時才用得到,所以整組跟著 prefix 的命中與否走。
      # 只取 header 樹(librime 不需要任何 Boost 二進位)。快取的是解壓後的結果:
      # 190MB 的 tarball 重抓不算慢,但在 NTFS 上解壓上萬個小檔很慢,那才是要省的。
      - name: 還原 Boost headers
        id: cache-boost
        if: steps.cache-prefix.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: third_party/boost
          key: boost-${{ env.BOOST_VERSION }}-headers-v1

      - name: 建置 librime 與 5 個相依
        if: steps.cache-prefix.outputs.cache-hit != 'true'
        run: ./windows/build.sh deps

      # 只有真的建成功(build.sh 末尾的 verify_prefix 過了)才存。
      - name: 保存已建置的 librime 與相依
        if: success() && steps.cache-prefix.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: third_party/build/windows-x64/prefix
          key: winprefix-x64-${{ hashFiles('scripts/fetch_librime.sh', 'windows/build.sh') }}-v1

      - name: 保存 Boost headers
        if: success() && steps.cache-prefix.outputs.cache-hit != 'true' && steps.cache-boost.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: third_party/boost
          key: boost-${{ env.BOOST_VERSION }}-headers-v1

      # 快取命中時 prefix 有了,但 collect_data.sh 要的 .ocd2 擺放位置沒有 ——
      # 那是每次都要重做的一步(只是複製檔案,很快)。
      - name: 從快取的 prefix 補上 opencc 詞典位置
        if: steps.cache-prefix.outputs.cache-hit == 'true'
        run: |
          dest=third_party/build/host-opencc-install/share/opencc
          mkdir -p "$dest"
          cp third_party/build/windows-x64/prefix/share/opencc/*.ocd2 "$dest/"
          cp third_party/build/windows-x64/prefix/share/opencc/*.json "$dest/"
          echo "$(ls "$dest"/*.ocd2 | wc -l) 個 .ocd2"

      - name: 取得方案原始資料（版本已釘死）
        run: ./scripts/fetch_rime_data.sh

      # core/data/shared 不在版控裡(見 .gitignore)。少了它,前面每一步都會成功,
      # 而 rime_console 會啟動、部署、然後一個候選都給不出來。
      - name: 組裝執行期資料
        run: ./scripts/collect_data.sh

      - name: 建置 rime_console（core/src/rime_shell.cc + tools/rime_console.cc）
        run: ./windows/build.sh console

      # 第一個里程碑:核心層真的打得出字。這一步紅了就不必看後面 ——
      # 引擎與資料都不對的話,再怎麼改 TSF 都沒用。
      - name: 核心驗證（nihao → 你好、注音 su3cl3 → 你好）
        run: ./windows/verify_console.sh

      - name: 建置 TSF DLL 與服務進程
        run: ./windows/build.sh ime

      - name: 二進位結構檢查（含服務進程）
        run: ./windows/check_binaries.sh third_party/build/windows-x64/ime/bin

      # ⚠ 沒有這一段,InitCommonControlsEx 拿到的是 comctl32 **v5** ——
      #   Windows 95/2000 那一代的控制項,而且**自繪救不了**
      #   (立體灰按鈕、鑿進去的清單外框、非佈景的核取方塊都是它畫的)。
      #   使用者實機回報:「你這個設定感覺就是 win95 的方案」。
      #   這一關有正負兩個對照組:三支有視窗的必須有、rime_probe 必須沒有 ——
      #   少了負對照,「每個 exe 都碰巧含那串字」也會全綠。
      - name: 資訊清單:執行檔真的內嵌了 comctl32 v6（含負對照）
        shell: pwsh
        run: ./windows/verify_manifest.ps1 -BinDir third_party/build/windows-x64/ime/bin

      # 走**真的**具名管道:probe → 線路格式 → 服務 → rime_shell → librime。
      # 也就是 DLL 會走的每一段,除了 TSF 本身。而 probe 用的 IpcClient 就是
      # DLL 用的同一份原始碼 —— 另寫一個測試用戶端的話,驗到的是那一份。
      - name: 端到端 IPC 驗證（經由具名管道:nihao → 你好）
        run: ./windows/verify_ime.sh

      # ── 安裝程式的檔名 ──────────────────────────────────────────
      #
      # 檔名 = CI 的 artifact 名 = scripts/publish_desktop.sh 要抓的名字。
      # 三者的唯一來源是 scripts/lib/product.env 的 CI_ARTIFACT_WINDOWS_SETUP。
      #
      # ⚠ 為什麼不直接把名字寫在 yml 裡:改名的時候,寫死的那一份與
      #   product.env 的那一份會分岔,而分岔的症狀是**發布安靜地抓不到東西**
      #   —— CI 三個 job 全綠、安裝程式也真的建出來了,只是下載頁上那個版本
      #   永遠停在舊的。上一次改名就是這樣被發現的(見 product.env 檔頭)。
      - name: 讀出安裝程式的檔名（唯一來源:scripts/lib/product.env）
        run: |
          . windows/product_win.sh
          echo "  artifact = ${RS_WIN_SETUP_BASE}"
          echo "  檔名     = ${RS_WIN_SETUP_EXE}"
          {
            echo "SETUP_ARTIFACT=${RS_WIN_SETUP_BASE}"
            echo "SETUP_FILE=${RS_WIN_SETUP_EXE}"
          } >> "$GITHUB_ENV"

      # ── 安裝程式 ────────────────────────────────────────────────
      # 打包工具是 Inno Setup(理由見 .iss 檔頭)。
      # 這一步同時會逐項點名檢查要裝進去的東西 —— 尤其是 core/data/shared,
      # 少了它會裝出一個「註冊得上但一個字都打不出來」的輸入法。
      - name: 建置安裝程式（${{ env.SETUP_FILE }}）
        run: ./windows/make_installer.sh

      - name: 上傳建置與驗證日誌
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-logs-${{ github.sha }}
          path: |
            third_party/build/windows-x64/*.log
            third_party/build/windows-x64/verify/logs/
            third_party/build/windows-x64/ime-verify/
            third_party/build/windows-x64/ime/bin/*.map
            third_party/build/windows-x64/installer/iscc*.log
          if-no-files-found: warn

      - name: 上傳產物（DLL、服務、console、驗證工具）
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rime-windows-x64-${{ github.sha }}
          path: |
            third_party/build/windows-x64/ime/bin/rime_tsf.dll
            third_party/build/windows-x64/ime/bin/rime_service.exe
            third_party/build/windows-x64/ime/bin/rime_ime_setup.exe
            third_party/build/windows-x64/ime/bin/rime_probe.exe
            third_party/build/windows-x64/ime/bin/rime_tsf_host.exe
            third_party/build/windows-x64/console/bin/rime_console.exe
          if-no-files-found: error

      # ⚠ 名字是固定的(不帶 sha)。協調端的發布流程會照這個名字來抓。
      #   改名字等於讓發布流程安靜地抓不到東西 —— 所以它不寫在這裡,
      #   而是上面那一步從 scripts/lib/product.env 讀出來的。
      - name: 上傳安裝程式
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SETUP_ARTIFACT }}
          # ⚠ version.txt 跟著一起走。scripts/publish_desktop.sh 靠它寫出
          #   線上的 version-windows.json —— 那個 version_code 必須與裝進
          #   使用者機器的那一份**逐字相同**,所以它只在打包時算一次,
          #   發布端讀,不重算。少了它,發布端會明確地拒絕發布。
          path: |
            third_party/build/windows-x64/installer/${{ env.SETUP_FILE }}
            third_party/build/windows-x64/installer/version.txt
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────
  # 安裝驗證:在一台**乾淨的** runner 上真的裝一次、驗一次、解除安裝一次。
  #
  # ⚠ 這個 job 是這一輪最有價值的東西,比安裝程式本身還有價值。
  #
  # 上一輪把「regsvr32 是否真的註冊成功、輸入法是否出現在系統的清單上」
  # 列在「只有人做得到」那一欄。那個判斷有一半是錯的:windows-latest 的
  # runner 上我們是系統管理員,所以這一整條跑得動 ——
  #
  #   靜默安裝 → 斷言登錄檔真的長出東西 → 用 TSF 的 API 列舉出自己
  #   → 用**安裝好的**服務與資料經由真的具名管道打出「你好」
  #   → 靜默解除安裝 → 斷言登錄檔清乾淨、而使用者詞典還在
  #
  # 刻意獨立成一個 job 而不是接在 core-x64 後面:那台機器上有完整的建置樹,
  # 而「裝出來的東西自己就夠了」正是要驗的事。在建置樹旁邊驗,
  # 驗到的可能是建置樹裡的檔案。
  # ────────────────────────────────────────────────────────────────
  install-x64:
    runs-on: windows-latest
    needs: core-x64
    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    steps:
      - name: 關掉 autocrlf
        run: |
          git config --global core.autocrlf input
          git config --global core.longpaths true

      # 只為了取得驗證腳本。二進位一律從 artifact 來 —— 這個 job 不建任何東西。
      - name: 取出原始碼
        uses: actions/checkout@v4

      # ── 安裝程式的檔名 ──────────────────────────────────────────
      #
      # 檔名 = CI 的 artifact 名 = scripts/publish_desktop.sh 要抓的名字。
      # 三者的唯一來源是 scripts/lib/product.env 的 CI_ARTIFACT_WINDOWS_SETUP。
      #
      # ⚠ 為什麼不直接把名字寫在 yml 裡:改名的時候,寫死的那一份與
      #   product.env 的那一份會分岔,而分岔的症狀是**發布安靜地抓不到東西**
      #   —— CI 三個 job 全綠、安裝程式也真的建出來了,只是下載頁上那個版本
      #   永遠停在舊的。上一次改名就是這樣被發現的(見 product.env 檔頭)。
      - name: 讀出安裝程式的檔名（唯一來源:scripts/lib/product.env）
        run: |
          . windows/product_win.sh
          echo "  artifact = ${RS_WIN_SETUP_BASE}"
          echo "  檔名     = ${RS_WIN_SETUP_EXE}"
          {
            echo "SETUP_ARTIFACT=${RS_WIN_SETUP_BASE}"
            echo "SETUP_FILE=${RS_WIN_SETUP_EXE}"
          } >> "$GITHUB_ENV"


      # ── 這兩包**必須**是同一次建置的產物 ────────────────────────
      #
      # 不是的話,症狀會是「連上了但握手不合」—— 而那與「服務根本沒在監聽」
      # 在舊版的錯誤訊息裡長得一模一樣(都是那句「連不上服務或握手失敗」)。
      #
      # 為什麼現在是成立的,寫下來免得日後有人動了名字才發現:
      #   · 這個 job `needs: core-x64`,兩包都是那個 job 在**同一個 run**
      #     裡上傳的。
      #   · download-artifact@v4 不帶 run-id 時只看目前這個 run,
      #     所以那個不帶 sha 的固定 artifact 名(見上一步)不會撈到別輪的。
      #
      # 而且現在線路上也驗得到:rime_probe 握手成功時會印出協商到的線路
      # 版本與服務回報的 shell ABI,失敗時會印出雙方各自宣稱的值。
      # 也就是說「兩邊不是同一次建置」這件事不再只靠這裡的推論撐著。
      - name: 下載安裝程式
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SETUP_ARTIFACT }}
          path: dist

      - name: 下載驗證工具（probe、setup）
        uses: actions/download-artifact@v4
        with:
          name: rime-windows-x64-${{ github.sha }}
          path: tools-dl

      # ⚠ 不要假設 artifact 裡的檔案是攤平的。
      #
      # upload-artifact@v4 會保留「所有來源路徑的最短共同祖先」以下的結構,
      # 而那一包同時來自 ime/bin/ 與 console/bin/,於是解出來是
      # tools-dl/ime/bin/rime_probe.exe,不是 tools-dl/rime_probe.exe。
      # 用 find 定位,並且**找不到就明確失敗** —— 讓路徑猜錯以
      # 「找不到檔案」的形式在後面某一步爆掉,是最難查的一種。
      - name: 定位下載回來的檔案
        run: |
          find dist tools-dl -type f | sed 's/^/  /'
          locate_one() {
            local name="$1" hit
            hit="$(find tools-dl -name "$name" -type f | head -1)"
            [ -n "$hit" ] || { echo "!! artifact 裡找不到 $name" >&2; exit 1; }
            echo "$hit"
          }
          [ -f "dist/${SETUP_FILE}" ] \
            || { echo "!! 缺少 dist/${SETUP_FILE}" >&2; exit 1; }
          {
            echo "SETUP_EXE=dist/${SETUP_FILE}"
            echo "PROBE_EXE=$(locate_one rime_probe.exe)"
            echo "TOOL_EXE=$(locate_one rime_ime_setup.exe)"
            echo "HOST_EXE=$(locate_one rime_tsf_host.exe)"
          } >> "$GITHUB_ENV"

      # runner 本身就是系統管理員,所以靜默安裝跑得動。
      - name: 安裝、斷言、解除安裝、斷言
        run: |
          ./windows/verify_installer.sh \
            --setup "$SETUP_EXE" \
            --probe "$PROBE_EXE" \
            --tool  "$TOOL_EXE" \
            --host  "$HOST_EXE"

      - name: 上傳安裝驗證日誌
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-install-verify-${{ github.sha }}
          path: dist/verify/
          if-no-files-found: warn
