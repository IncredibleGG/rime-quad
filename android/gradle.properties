org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

kotlin.code.style=official

# ─────────────────────────────────────────────────────────────────────────────
# 應用身分。applicationId / package 已知未來會改名，全部集中在這裡。
#
# 改名時要一起動的東西只有三處：
#   1. 本檔的 rime.applicationId / rime.namespace / rime.jniClass
#   2. app/src/main/java/ 底下的目錄結構與 Kotlin `package` 宣告
#   3. 無（AndroidManifest、method.xml、JNI 符號都是從這裡衍生出來的）
#
# rime.jniClass 會以 -DRIME_JNI_CLASS 傳進 CMake，JNI 走 RegisterNatives，
# 因此 C++ 端不含任何寫死的套件名。
# ─────────────────────────────────────────────────────────────────────────────
rime.applicationId=org.rimequad.ime
rime.namespace=org.rimequad.ime
rime.jniClass=org/rimequad/ime/core/RimeCore
