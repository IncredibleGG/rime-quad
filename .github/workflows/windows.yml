name: Windows (核心驗證 + TSF)

# 這個 workflow 分成兩個 job,分界線是「要不要 librime」:
#
#   logic-x64  幾分鐘。瘦 DLL、單元測試、真實鍵盤佈局測試、二進位結構檢查。
#              **不需要 librime** —— 那本身就是架構的驗證:TSF 的 DLL 被載入到
#              每一個宿主進程裡,它如果需要 librime 才編得起來,就代表
#              librime 跑進了瀏覽器與提權進程。
#   core-x64   十幾分鐘(有快取時幾分鐘)。librime + 服務進程 + 端到端 IPC 驗證。
#
# ⚠ **綠燈不等於能用。** TSF 需要註冊 COM in-proc server 並有真實的文字輸入
#   情境,`windows-latest` runner 上做不到。所以:
#
#   CI 驗得到:編得起來、匯出的 COM 進入點齊全、DLL 沒有意外的相依、
#             按鍵映射(含真實的德文/法文佈局)、線路格式的編解碼、
#             組字政策、候選窗排版、fail-open 狀態機、
#             以及**經由真的具名管道**驅動服務打出「你好」。
#
#   CI 驗不到:regsvr32 註冊、TSF 的 Activate/組字/edit session、
#             候選窗的樣子與位置、在記事本或瀏覽器裡真的打得出字、
#             以及「每一顆鍵是不是都真的做了它宣稱的事」。
#             這些只有人在真 Windows 上跑得到,清單見 windows/README.md。
#
#   這個專案吃過「編得出來不等於能用」的虧:編譯成功、單元測試全過、
#   發布關卡全綠,而使用者一裝就按鍵永久變灰。**不要因為這裡綠了就說做完了。**

on:
  push:
    branches: [main, windows]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────
  # 快速 job:不碰 librime。開發時最常紅的就是這一組,所以讓它先跑完。
  # ────────────────────────────────────────────────────────────────
  logic-x64:
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    env:
      ARCH: x64

    steps:
      # runner 的系統 gitconfig 預設 core.autocrlf=true。不關掉的話 checkout
      # 會把所有 LF 換成 CRLF,bash 腳本的 shebang 變成 `#!/usr/bin/env bash\r`
      # 而直接無法執行。必須在 checkout **之前**設。
      - name: 關掉 autocrlf
        run: |
          git config --global core.autocrlf input
          git config --global core.longpaths true

      - name: 取出原始碼
        uses: actions/checkout@v4

      - name: 安裝 Ninja
        run: pip install ninja

      # 這一組不需要釘住 CMake 3.x —— 那個限制來自 librime 的
      # find_package(Boost),與瘦 DLL 和單元測試無關。runner 自帶的就夠。
      - name: 建置瘦 DLL、單元測試、probe
        run: ./windows/build.sh logic

      - name: 單元測試
        run: ./third_party/build/windows-x64/logic/bin/rime_tests.exe

      # 反向測試。這個專案有過「測試是綠的,因為它沒在測」:
      # 發布關卡的升級測試因步驟順序寫反被判「略過」而報出一片全綠。
      # 這一步故意讓一個斷言失敗,並要求它**非零結束** ——
      # 上面那一步的綠燈要成立,得先證明它會紅。
      - name: 反向測試（框架必須會紅）
        run: |
          if ./third_party/build/windows-x64/logic/bin/rime_tests.exe --self-check; then
            echo "!! --self-check 竟然以 0 結束 —— 測試框架不會紅,上面的綠燈都不算數" >&2
            exit 1
          fi
          echo "反向測試通過:框架會紅"

      # 匯出的四個 COM 進入點齊不齊、DLL 有沒有意外的相依。
      # 後者守的是 /MT:相依到 VCRUNTIME140.dll 的話,在沒裝 VC++ 執行檔套件
      # 的機器上 DLL 會在載入階段失敗,而症狀是「輸入法在某些程式裡不存在」。
      - name: 二進位結構檢查（匯出符號、相依白名單、**沒有網路相依**）
        run: ./windows/check_binaries.sh third_party/build/windows-x64/logic/bin

      # 離線稽核。Android 端的 scripts/audit_offline.sh 在原始碼層面守
      # 「整個 app 只有一個檔案碰得到網路」,這一支是 Windows 端的對應物。
      # 目前的主張更強:**一個檔案都沒有**。
      - name: 離線稽核（原始碼層面:沒有任何檔案碰網路 API）
        run: ./windows/audit_offline_win.sh

      # 與上面「框架必須會紅」同一個約定:--self-check 植入一個真的
      # WinHttpOpen 呼叫,並要求腳本**非零結束**。一支只會印綠字的稽核
      # 腳本比沒有更糟 —— 它讓人以為有人在看。
      - name: 反向測試（離線稽核必須抓得到植入的違規）
        run: |
          if ./windows/audit_offline_win.sh --self-check; then
            echo "!! 植入了一個真的 WinHttpOpen 呼叫,稽核腳本卻以 0 結束 —— 它不會紅" >&2
            exit 1
          fi
          echo "反向測試通過:離線稽核會紅"

      # 安裝程式最貴的失敗模式是「忘了把執行期資料包進去」——
      # 那樣的話安裝程式編得出來、安裝成功、輸入法也註冊得上,
      # 然後一個字都打不出來,而且沒有任何錯誤訊息。
      # make_installer.sh 有一道逐項點名的 payload 檢查在擋它;
      # 這一步用一棵故意殘缺的樹去跑那道檢查,要求它真的紅。
      # 放在快速 job 是因為它只是 shell 邏輯,不需要 librime、也不需要 ISCC。
      - name: 反向測試（安裝包資料檢查必須會紅）
        run: ./windows/make_installer.sh --self-check

      # ⚠ 這一步存在的理由是**迴圈長度**。
      #
      # ISCC 是逐段解析的:前面一段語法錯了就中止,後面的 [Messages] / [Code]
      # 根本沒被看過。而真正的安裝程式建置在 core-x64 的最後面 —— 一輪二十分鐘,
      # 一次只能發現一個錯。(實測:第一次就是這樣,[UninstallRun] 的一個旗標
      # 讓整段 [Messages] 與 [Code] 都還沒被檢查過。)
      #
      # 這裡用一棵**假的** payload 把同一份 .iss 完整編一次。不需要 librime、
      # 不需要執行期資料,四分鐘就有答案。內容對不對不是這一步的事。
      - name: 安裝程式腳本必須編得過（快速把關）
        run: ./windows/make_installer.sh --lint

      - name: 上傳瘦 DLL 與測試執行檔
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-logic-${{ github.sha }}
          path: |
            third_party/build/windows-x64/logic/bin/
            third_party/build/windows-x64/*.log
          if-no-files-found: warn

  # ────────────────────────────────────────────────────────────────
  # 重 job:librime + 核心驗證 + 服務進程 + 端到端 IPC 驗證。
  # ────────────────────────────────────────────────────────────────
  core-x64:
    runs-on: windows-latest
    timeout-minutes: 150

    defaults:
      run:
        shell: bash

    env:
      ARCH: x64
      BOOST_VERSION: 1.89.0
      # CMake 4 移除了 FindBoost,而 librime 靠 find_package(Boost) 找 header-only
      # 的 Boost —— 非 LINUX 分支不帶 REQUIRED,所以 4.x 上不會報錯,只會在編譯時
      # 噴一整片找不到 boost 標頭。釘住 3.x 的理由與 Android 端釘 cmake 3.22.1 相同。
      PINNED_CMAKE: 3.31.6

    steps:
      - name: 關掉 autocrlf
        run: |
          git config --global core.autocrlf input
          git config --global core.longpaths true

      - name: 取出原始碼
        uses: actions/checkout@v4

      - name: 釘住 CMake ${{ env.PINNED_CMAKE }}
        shell: pwsh
        run: |
          $ver = "${{ env.PINNED_CMAKE }}"
          $url = "https://github.com/Kitware/CMake/releases/download/v$ver/cmake-$ver-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\cmake.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\cmake.zip" -DestinationPath "$env:RUNNER_TEMP\cmake" -Force
          $bin = "$env:RUNNER_TEMP\cmake\cmake-$ver-windows-x86_64\bin"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # 同時以絕對路徑交給 build.sh(它讀 $CMAKE)。vcvars 會把 VS 自帶的
          # CMake 加進 PATH,可能蓋掉這裡釘的版本 —— 絕對路徑不受 PATH 影響。
          "CMAKE=$bin\cmake.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Ninja(不用 Visual Studio 產生器)。理由見 windows/build.sh 的註解:
      # VS 產生器的名字裡帶著 VS 版本號,會把 CMake 版本和 runner 的 VS 版本綁死。
      # 上游 librime 的 Windows CI 同樣是 Ninja + MSVC。
      - name: 安裝 Ninja
        run: pip install ninja

      - name: 確認工具鏈
        run: |
          ver="$("$CMAKE" --version)"
          echo "$ver"
          ninja --version
          # 刻意不用 `cmake --version | head -1 | grep`:head 讀完就關掉 pipe,
          # cmake 可能收到 SIGPIPE 以 141 結束,配上 GitHub 預設的 pipefail
          # 就是**間歇性**失敗 —— 比明確的失敗難查得多。
          case "$ver" in
            *"${PINNED_CMAKE}"*) ;;
            *) echo "cmake 不是釘住的 ${PINNED_CMAKE}" >&2; exit 1 ;;
          esac

      # librime + 5 個相依編一次要十幾分鐘,而它們只由釘住的 commit 決定。
      # key 帶上 build.sh **與 scripts/fetch_librime.sh** 的雜湊:改了建置選項或
      # 換了 librime 的 commit,就必須重編。少了 fetch_librime.sh 那一半,
      # 「換引擎但快取沒失效」會安靜地拿舊 prefix 繼續跑 —— 那種漂移最難查。
      #
      # 用 restore + save 而不是 cache:save 那一步必須 `if: success()`。
      # actions/cache 的 post step 不管成敗都會存,那會把一份**建到一半就失敗的**
      # prefix 存進去,之後每一輪都命中它、跳過重建,然後以完全無關的方式失敗。
      - name: 還原已建置的 librime 與相依
        id: cache-prefix
        uses: actions/cache/restore@v4
        with:
          path: third_party/build/windows-x64/prefix
          key: winprefix-x64-${{ hashFiles('scripts/fetch_librime.sh', 'windows/build.sh') }}-v1

      # Boost 只有建 deps 時才用得到,所以整組跟著 prefix 的命中與否走。
      # 只取 header 樹(librime 不需要任何 Boost 二進位)。快取的是解壓後的結果:
      # 190MB 的 tarball 重抓不算慢,但在 NTFS 上解壓上萬個小檔很慢,那才是要省的。
      - name: 還原 Boost headers
        id: cache-boost
        if: steps.cache-prefix.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: third_party/boost
          key: boost-${{ env.BOOST_VERSION }}-headers-v1

      - name: 建置 librime 與 5 個相依
        if: steps.cache-prefix.outputs.cache-hit != 'true'
        run: ./windows/build.sh deps

      # 只有真的建成功(build.sh 末尾的 verify_prefix 過了)才存。
      - name: 保存已建置的 librime 與相依
        if: success() && steps.cache-prefix.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: third_party/build/windows-x64/prefix
          key: winprefix-x64-${{ hashFiles('scripts/fetch_librime.sh', 'windows/build.sh') }}-v1

      - name: 保存 Boost headers
        if: success() && steps.cache-prefix.outputs.cache-hit != 'true' && steps.cache-boost.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: third_party/boost
          key: boost-${{ env.BOOST_VERSION }}-headers-v1

      # 快取命中時 prefix 有了,但 collect_data.sh 要的 .ocd2 擺放位置沒有 ——
      # 那是每次都要重做的一步(只是複製檔案,很快)。
      - name: 從快取的 prefix 補上 opencc 詞典位置
        if: steps.cache-prefix.outputs.cache-hit == 'true'
        run: |
          dest=third_party/build/host-opencc-install/share/opencc
          mkdir -p "$dest"
          cp third_party/build/windows-x64/prefix/share/opencc/*.ocd2 "$dest/"
          cp third_party/build/windows-x64/prefix/share/opencc/*.json "$dest/"
          echo "$(ls "$dest"/*.ocd2 | wc -l) 個 .ocd2"

      - name: 取得方案原始資料（版本已釘死）
        run: ./scripts/fetch_rime_data.sh

      # core/data/shared 不在版控裡(見 .gitignore)。少了它,前面每一步都會成功,
      # 而 rime_console 會啟動、部署、然後一個候選都給不出來。
      - name: 組裝執行期資料
        run: ./scripts/collect_data.sh

      - name: 建置 rime_console（core/src/rime_shell.cc + tools/rime_console.cc）
        run: ./windows/build.sh console

      # 第一個里程碑:核心層真的打得出字。這一步紅了就不必看後面 ——
      # 引擎與資料都不對的話,再怎麼改 TSF 都沒用。
      - name: 核心驗證（nihao → 你好、注音 su3cl3 → 你好）
        run: ./windows/verify_console.sh

      - name: 建置 TSF DLL 與服務進程
        run: ./windows/build.sh ime

      - name: 二進位結構檢查（含服務進程）
        run: ./windows/check_binaries.sh third_party/build/windows-x64/ime/bin

      # 走**真的**具名管道:probe → 線路格式 → 服務 → rime_shell → librime。
      # 也就是 DLL 會走的每一段,除了 TSF 本身。而 probe 用的 IpcClient 就是
      # DLL 用的同一份原始碼 —— 另寫一個測試用戶端的話,驗到的是那一份。
      - name: 端到端 IPC 驗證（經由具名管道:nihao → 你好）
        run: ./windows/verify_ime.sh

      # ── 安裝程式 ────────────────────────────────────────────────
      # 打包工具是 Inno Setup(理由見 windows/installer/rimequad.iss 檔頭)。
      # 這一步同時會逐項點名檢查要裝進去的東西 —— 尤其是 core/data/shared,
      # 少了它會裝出一個「註冊得上但一個字都打不出來」的輸入法。
      - name: 建置安裝程式（RimeQuad-Setup-x64.exe）
        run: ./windows/make_installer.sh

      - name: 上傳建置與驗證日誌
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-logs-${{ github.sha }}
          path: |
            third_party/build/windows-x64/*.log
            third_party/build/windows-x64/verify/logs/
            third_party/build/windows-x64/ime-verify/
            third_party/build/windows-x64/ime/bin/*.map
            third_party/build/windows-x64/installer/iscc*.log
          if-no-files-found: warn

      - name: 上傳產物（DLL、服務、console、驗證工具）
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rime-windows-x64-${{ github.sha }}
          path: |
            third_party/build/windows-x64/ime/bin/rime_tsf.dll
            third_party/build/windows-x64/ime/bin/rime_service.exe
            third_party/build/windows-x64/ime/bin/rime_ime_setup.exe
            third_party/build/windows-x64/ime/bin/rime_probe.exe
            third_party/build/windows-x64/console/bin/rime_console.exe
          if-no-files-found: error

      # ⚠ 名字是固定的(不帶 sha)。協調端的發布流程會照這個名字來抓。
      #   改名字等於讓發布流程安靜地抓不到東西。
      - name: 上傳安裝程式
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RimeQuad-Setup-x64
          path: third_party/build/windows-x64/installer/RimeQuad-Setup-x64.exe
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────
  # 安裝驗證:在一台**乾淨的** runner 上真的裝一次、驗一次、解除安裝一次。
  #
  # ⚠ 這個 job 是這一輪最有價值的東西,比安裝程式本身還有價值。
  #
  # 上一輪把「regsvr32 是否真的註冊成功、輸入法是否出現在系統的清單上」
  # 列在「只有人做得到」那一欄。那個判斷有一半是錯的:windows-latest 的
  # runner 上我們是系統管理員,所以這一整條跑得動 ——
  #
  #   靜默安裝 → 斷言登錄檔真的長出東西 → 用 TSF 的 API 列舉出自己
  #   → 用**安裝好的**服務與資料經由真的具名管道打出「你好」
  #   → 靜默解除安裝 → 斷言登錄檔清乾淨、而使用者詞典還在
  #
  # 刻意獨立成一個 job 而不是接在 core-x64 後面:那台機器上有完整的建置樹,
  # 而「裝出來的東西自己就夠了」正是要驗的事。在建置樹旁邊驗,
  # 驗到的可能是建置樹裡的檔案。
  # ────────────────────────────────────────────────────────────────
  install-x64:
    runs-on: windows-latest
    needs: core-x64
    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    steps:
      - name: 關掉 autocrlf
        run: |
          git config --global core.autocrlf input
          git config --global core.longpaths true

      # 只為了取得驗證腳本。二進位一律從 artifact 來 —— 這個 job 不建任何東西。
      - name: 取出原始碼
        uses: actions/checkout@v4

      - name: 下載安裝程式
        uses: actions/download-artifact@v4
        with:
          name: RimeQuad-Setup-x64
          path: dist

      - name: 下載驗證工具（probe、setup）
        uses: actions/download-artifact@v4
        with:
          name: rime-windows-x64-${{ github.sha }}
          path: tools-dl

      # ⚠ 不要假設 artifact 裡的檔案是攤平的。
      #
      # upload-artifact@v4 會保留「所有來源路徑的最短共同祖先」以下的結構,
      # 而那一包同時來自 ime/bin/ 與 console/bin/,於是解出來是
      # tools-dl/ime/bin/rime_probe.exe,不是 tools-dl/rime_probe.exe。
      # 用 find 定位,並且**找不到就明確失敗** —— 讓路徑猜錯以
      # 「找不到檔案」的形式在後面某一步爆掉,是最難查的一種。
      - name: 定位下載回來的檔案
        run: |
          find dist tools-dl -type f | sed 's/^/  /'
          locate_one() {
            local name="$1" hit
            hit="$(find tools-dl -name "$name" -type f | head -1)"
            [ -n "$hit" ] || { echo "!! artifact 裡找不到 $name" >&2; exit 1; }
            echo "$hit"
          }
          [ -f dist/RimeQuad-Setup-x64.exe ] \
            || { echo "!! 缺少 dist/RimeQuad-Setup-x64.exe" >&2; exit 1; }
          {
            echo "SETUP_EXE=dist/RimeQuad-Setup-x64.exe"
            echo "PROBE_EXE=$(locate_one rime_probe.exe)"
            echo "TOOL_EXE=$(locate_one rime_ime_setup.exe)"
          } >> "$GITHUB_ENV"

      # runner 本身就是系統管理員,所以靜默安裝跑得動。
      - name: 安裝、斷言、解除安裝、斷言
        run: |
          ./windows/verify_installer.sh \
            --setup "$SETUP_EXE" \
            --probe "$PROBE_EXE" \
            --tool  "$TOOL_EXE"

      - name: 上傳安裝驗證日誌
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-install-verify-${{ github.sha }}
          path: dist/verify/
          if-no-files-found: warn
