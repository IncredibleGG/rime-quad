name: Android

# 這個 workflow 是整條發布流程,不只是「編得起來嗎」。
#
# ── 為什麼要這樣拆 ──────────────────────────────────────────────────────
# 原本正式發布只能在一台 Ubuntu 上做,因為簽章金鑰與 rclone 設定只在那裡。
# 那台機器是單點:它掛掉,使用者就再也收不到更新。現在金鑰與 R2 憑證都在
# GitHub Secrets(見 scripts/gh_set_secrets.py),所以建置、驗證、發布都在這裡。
#
#   fast      每次 push 都跑。單元測試、建置、APK 內容、離線稽核、簽章關卡。
#             ~8 分鐘。
#   emulator  推上 main 或手動觸發才跑。模擬器上的核心層、實體按鍵輸入、
#             **按住**回歸、以及升級路徑。~25 分鐘。
#   publish   **只有手動觸發**才跑,而且要勾 publish=true。
#             使用者手上的 rime-latest.apk 被無意間覆蓋是災難,所以不做成
#             push 就發。
#
# 拆成快慢兩條不是為了少驗東西:scripts/release_check.sh 的 16 項被
# `--skip-emu` 與 `--emu-only` 切成兩半,兩條加起來仍是原本那 16 項,
# 而且兩條都帶 `--strict`(略過一律算失敗)。publish 的 needs: 同時掛著兩條,
# 所以「沒驗到就發出去」在結構上做不到。
#
# ── 這個 workflow 為什麼看起來比一般 Android 專案複雜 ────────────────────
# 這個 App 的 assets 裡有 13MB 的輸入方案資料(詞庫、語言模型、opencc 詞典),
# 而那些資料是**產生出來的**,不在版控裡(見 .gitignore)。少了它們,建置照樣
# 會成功,但產出的是一個「裝得起來、鍵盤畫得出來、一個字都打不出來」的輸入法
# —— 而且沒有任何建置錯誤會提醒你。所以下面取上游資料與建 host 版 opencc
# 那兩步不是可選的。

on:
  push:
    # 一行一項:未來的支線各自把自己的分支加進來時,
    # 單行陣列 [main, a, b] 會讓每一條都改同一行 = 必然衝突。
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: '發布到 R2(會覆蓋使用者手上的 rime-latest.apk)'
        type: boolean
        default: false
      remote_dir:
        description: '發布路徑。只接受 rime 或 rime/ 底下(bucket 內其他路徑屬於別的專案)'
        type: string
        default: 'rime'
      notes:
        description: 'version.json 的更新說明。留空 = 取 HEAD commit 的標題行'
        type: string
        default: ''

concurrency:
  # 手動觸發(可能正在發布)與 push 分屬**不同的併發群組**。
  #
  # ⚠ 這裡原本是同一個群組,只靠 cancel-in-progress 區分,而那個判斷式問的是
  #   「**我**是不是 workflow_dispatch」—— 它擋住了「發布去取消 push」,
  #   卻擋不住「push 去取消發布」。方向是反的。
  #   實際踩到:發布跑到一半,我推了一個 commit,發布**當場被取消**,
  #   而 R2 上的 Android 還是舊版 —— 沒有任何東西紅,只是那件事沒發生。
  #
  #   註解本身寫的意圖是對的(「被後來的 push 取消掉會留下一個傳到一半的 R2」),
  #   實作沒有做到。分群組之後,兩邊互不干涉。
  group: android-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'ci' }}
  # 同群組內仍然取消舊的:連續推兩次時,前一次的 CI 沒有意義。
  # 但發布那一組刻意也留著 —— 連按兩次發布,後面那次才是他要的。
  cancel-in-progress: true

env:
  R2_BASE_URL: https://pub-d6a54d2e5f5947e2b0b23fb8e27ce0a5.r2.dev
  # ⚠ 這兩個變數指的是**兩份不同的東西**,不要合併。
  #   APK_PATH        = 使用者拿到的那一份(release)。發布、簽章關卡、
  #                     升級關卡都問它。
  #   APK_DEBUG_PATH  = 模擬器上那幾支驗證腳本用的(它們需要 run-as 與
  #                     src/debug 的 harness),**永遠不會被發布**。
  #   2026-08-10 之前只有前者而且指著 debug —— 於是整條流程每一關都綠,
  #   而綠的是一份 debuggable 的 APK,使用者拿到的也是它。
  APK_PATH: android/app/build/outputs/apk/release/app-release.apk
  APK_DEBUG_PATH: android/app/build/outputs/apk/debug/app-debug.apk

jobs:
  # ══════════════════════════════════════════════════════════════ 快車道 ══
  fast:
    name: 快車道(每次 push)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version_code: ${{ steps.vc.outputs.code }}

    steps:
      - name: 取出原始碼
        uses: actions/checkout@v4

      - name: 設定 Android 建置環境
        uses: ./.github/actions/setup-android

      - name: 取得方案原始資料(版本已釘死)
        run: ./scripts/fetch_rime_data.sh

      - name: 取得 librime 原始碼(版本已釘死)
        run: |
          # third_party/librime/ 在 .gitignore 裡(那是上游的原始碼,不進本倉庫),
          # 所以 CI 上必須自己取。只取 opencc:APK 建置本身用的是
          # third_party/prebuilt/ 底下已進版控的 .a,這裡要 opencc 只是為了產 .ocd2。
          ./scripts/fetch_librime.sh opencc

      - name: 建 host 版 opencc 以產生詞典
        run: |
          # 交叉編譯時 opencc 的 Dictionaries target 會執行剛編出來的 Android 版
          # opencc_dict,在交叉環境必炸,所以那一步被繞開了。.ocd2 只能用 host 版產生。
          cmake -S third_party/librime/deps/opencc -B third_party/build/host-opencc \
                -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
                -DENABLE_GTEST=OFF -DENABLE_BENCHMARK=OFF -DBUILD_PYTHON=OFF \
                -DBUILD_DOCUMENTATION=OFF -DOPENCC_ENABLE_INSTALL=ON \
                -DCMAKE_INSTALL_PREFIX="$PWD/third_party/build/host-opencc-install"
          cmake --build third_party/build/host-opencc -j"$(nproc)"
          cmake --install third_party/build/host-opencc

      - name: 組裝執行期資料
        run: ./scripts/collect_data.sh

      - name: 還原簽章環境(正式金鑰 + 輪替鏈)
        uses: ./.github/actions/restore-signing
        with:
          keystore-base64:       ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password:     ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias:             ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password:          ${{ secrets.ANDROID_KEY_PASSWORD }}
          lineage-base64:        ${{ secrets.ANDROID_LINEAGE_BASE64 }}
          old-keystore-base64:   ${{ secrets.ANDROID_OLD_KEYSTORE_BASE64 }}
          old-key-alias:         ${{ secrets.ANDROID_OLD_KEY_ALIAS }}
          # old-keystore-password / old-key-password 刻意不從 Secrets 來:
          # 那是 Android 工具的公開常數 "android",設成 secret 只會讓
          # GitHub 把日誌裡每一個 "android" 遮成 ***。見 restore-signing 的註解。

      - name: 決定 versionCode
        id: vc
        run: |
          set -euo pipefail
          # 版本號要以**這次要發到哪裡**的線上版本為基準。手動觸發若指定了
          # rime/test,基準就該是 rime/test/version.json ——
          # 拿正式路徑的號碼去比,測試路徑上那個刻意調高的版號會把發布擋下,
          # 而那個失敗跟「這份建置有問題」一點關係都沒有。
          TARGET_DIR="${{ inputs.remote_dir || 'rime' }}"
          CODE="$(./scripts/ci_version_code.sh --dir "$TARGET_DIR")"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          # 為什麼寫進 $HOME/.gradle 而不是 android/gradle.properties:
          # 後者在版控裡,寫進去會讓工作區變髒,而 release_check.sh 第 1 關
          # 正是「工作區乾淨,APK 對得上 commit」—— 為了設一個版本號而把那一關
          # 弄紅,或更糟、為此把那一關拿掉,都不划算。
          # Gradle 會把 $GRADLE_USER_HOME/gradle.properties 當成 project property。
          mkdir -p "$HOME/.gradle"
          echo "rime.versionCode=$CODE" >> "$HOME/.gradle/gradle.properties"
          echo "本次 versionCode = $CODE"

      # 放在發布關卡**之前**:它只讀檔案、兩秒跑完,而它擋的是「改名改一半」——
      # 顯示名改了識別碼沒改、或某支腳本又把 id 寫死了一份。那一類缺陷在編譯期、
      # 單元測試、發布關卡全部是綠的,只有使用者裝上去才發現。先讓它說話,
      # 免得後面十分鐘的關卡綠燈蓋掉一個「這份建置的 id 根本對不上」。
      - name: 產品識別碼只有一份(自帶反向測試)
        run: ./scripts/verify_product_ids.sh

      # ⚠ yaml.safe_load 對重複鍵是「後者覆蓋前者」,一聲不吭;
      #   而 GitHub Actions 會**整份檔案拒收**,那條 run 的名字會變成檔案路徑。
      #   實際發生過(0072f4f):聯集式的合併衝突解法把 `push:` 底下併出了
      #   兩個 `branches:`,本機 yaml 驗過、CI 上那一整條車道直接不存在。
      #   用聯集解衝突的時候最容易長出這種東西,而它不會讓任何一項變紅。
      - name: workflow 檔沒有重複鍵(自帶反向測試)
        run: |
          set -eu
          python3 scripts/verify_yaml_no_dup_keys.py .github/workflows/*.yml
          # 反向:植入一個重複鍵,這一關必須紅。沒有這一段就無從分辨
          # 「沒有重複鍵」與「這支腳本自己壞了」。
          cp .github/workflows/build.yml /tmp/dup.yml
          python3 -c "import io;p='/tmp/dup.yml';s=io.open(p,encoding='utf-8').read();i=s.index('  pull_request:');io.open(p,'w',encoding='utf-8').write(s[:i]+'    branches: [main]\n'+s[i:])"
          if python3 scripts/verify_yaml_no_dup_keys.py /tmp/dup.yml; then
            echo "植入了重複鍵卻沒有紅 —— 這一關沒有在檢查" >&2
            exit 1
          fi
          echo "反向測試通過:植入的重複鍵會被抓到"

      # 發布腳本的關卡自己有沒有在守。擋的是「發出去之後使用者裝不上來」——
      # 那種事一年撞不到幾次,所以關卡壞掉的話**不會有人發現**,除非有人
      # 每次 push 都逼它對著假清單表演一次。不需要 APK、不連網,~2 秒。
      - name: 發布關卡的反向測試(publish_apk.sh --self-check,36 條)
        run: ./scripts/publish_apk.sh --self-check
      # ── 消歧欄關卡的反向測試(不需要模擬器的那兩個)────────────────
      # verify_syllables.sh 的檔頭從第一天就宣告了三種 --plant「證明它會紅」,
      # 而這個 workflow 一次都沒有呼叫過 —— 專案裡其他每一支守門的反向測試
      # 都接上了,只有這一支沒有,而「宣告了」與「在跑」在日誌上長得一模一樣。
      #
      # 分兩條車道:stale-schema / narrow-scope 只讀主機上的檔案(第 0/1 關),
      # 一秒跑完,放這裡;bad-slot-ids 斷言的是畫面像素,只能跟著模擬器那條跑。
      # 三種都有跑,沒有靜靜地少驗哪一個 —— 而下面那一關就是在盯這件事。
      # `cmd | grep -q P` 在 pipefail 之下,命中時的退出碼可能是 141
      # (grep -q 一命中就結束 → 上游 SIGPIPE),於是「有命中」被判成「沒命中」。
      # 它是機率性的:小輸出永遠正常,`adb logcat -d` / `dumpsys` 這種大輸出才發作,
      # 而症狀是「等不到就緒訊號」—— 看起來像產品沒起來,不像關卡自己壞了。
      # 這個專案已經在四支腳本的註解裡各自寫過一次「不可以這樣寫」,
      # 四次都是撞到之後才補的。註解攔不住第五次。
      - name: 就緒判斷不會被 SIGPIPE 判成「沒命中」(自帶自我測試)
        run: |
          ./scripts/verify_no_sigpipe_probe.sh --self-test
          ./scripts/verify_no_sigpipe_probe.sh

      - name: 消歧欄反向測試的接線檢查(自帶自我測試)
        run: |
          # 先證明這一關會紅(拆掉一條接線),再問實際的接線齊不齊。
          ./scripts/verify_syllables.sh --check-ci --self-test
          ./scripts/verify_syllables.sh --check-ci

      - name: 消歧欄反向測試:方案漂移(第 0 關必須紅)
        run: ./scripts/verify_syllables.sh --plant stale-schema

      - name: 消歧欄反向測試:掃描範圍變窄(第 1 關必須紅)
        run: ./scripts/verify_syllables.sh --plant narrow-scope

      # 「這份 APK 系統還認不認得它是輸入法」的判斷本體。純函式 + 16 條
      # 反向測試,其中兩條是**對照組**:斷言舊的子字串寫法在那個變異上
      # 仍然說綠 —— 少了對照組,新檢查到底比舊的多擋了什麼沒有人驗得到。
      # 不需要 APK、不需要模擬器,~0.1 秒。
      - name: APK 形狀判讀的反向測試(apk_ime_shape.py --self-test,16 條)
        run: python3 scripts/apk_ime_shape.py --self-test

      - name: 發布關卡(不需要模擬器的部分)
        run: ./scripts/release_check.sh --skip-emu --strict

      # ── 底下兩支是「守門腳本自己有沒有在守」的驗證 ──────────────────
      # release_check.sh 第 0 關會跑 audit_offline.sh,但那只證明它「沒有紅」。
      # 一支全綠的 grep 腳本有兩種可能:真的沒有違規,或它其實什麼都沒在看。
      # 這個專案已經被同一件事咬過三次(升級測試被判略過、LayoutEscapeTest
      # 漏掉 8 份佈局、grep -oP 在 BSD 上永遠印「都齊全」)。
      - name: Lua 沙盒探針(真的 Lua 直譯器,39 條 x 3 階段 + 4 個變異測試)
        # 不驗「patch 檔還在」——那是 audit_offline.sh 第 8 項的事。
        # 這裡把兩段沙盒從 patch 套用後的原始碼抽出來,裝進 librime-lua 出貨
        # 的那一份 Lua 5.4.8,真的去 os.execute / io.popen / 讀資料目錄外面的檔案。
        run: ./scripts/verify_lua_sandbox.sh

      - name: 字集守門的純函式測試(51 條 + 8 個變異測試)
        # core/data/lua/luminakey_charset.lua 是**出貨的程式碼**,它在每一台裝置上
        # 決定每一個候選字要不要留下來,而 ./gradlew test 碰不到它(不是 Kotlin)。
        # 這一關用 librime-lua 出貨的那份 Lua 原始碼編一個直譯器把它跑起來,
        # 最後對它植入八個真缺陷(濾到空不退回、無視關閉開關、連標點都比對、
        # 不再惰性、兩份字集其實同一份,以及**候選變成 0** 的那三條:出錯時
        # 緩衝被吞掉、把錯誤丟給 librime、問不到開關就整段陣亡),
        # 確認每一個都會被測出來。
        run: ./scripts/verify_charset_guard.sh

      # ⚠ 這一關是 2026-08-12 那次撤回換來的。那一批改的是 core/data/,
      #   只在 emulator 上驗過,併進 main 之後 macOS 與 Android 兩條車道
      #   同時紅,整批被 revert。core/data/ 是四端共用的執行期資料,
      #   而支線只跑得到自己接了線的那幾條車道 —— 沒接的不是紅的,
      #   是**根本不跑**,而 checks 上被跳過的 job 是灰色的勾。
      #   細節與怎麼修都寫在腳本的檔頭。
      - name: 動到 core/data/ 就要四條車道都跑得到
        run: |
          ./scripts/verify_core_data_fanout.sh --self-test
          ./scripts/verify_core_data_fanout.sh

      - name: 手感的反向測試(音檔比對 + 植入 6 個真缺陷)
        # 兩件 ./gradlew test 做不到的事:
        #   1. res/raw/key_*.ogg 是**出貨的資料**,它的來源是
        #      scripts/gen_key_sounds.py。重新合成一次跟現有檔案的波形比對,
        #      有人手動塞了別的音檔進去這裡會紅。
        #   2. 對 FeedbackPlan 植入六個真缺陷(其中兩個就是改動前的實作:
        #      三個不相干的觸覺常數、一律送 FX_KEYPRESS_STANDARD),
        #      確認每一個都會被 FeedbackPlanTest / FeelPrefsTest 抓到。
        #
        # ⚠ 這一步**不裝任何 pip 套件**,而且不要為了它加。gen_key_sounds.py
        #   原本用 numpy,而 runner 上沒有 —— 2026-08-12 這條車道就是紅在
        #   `ModuleNotFoundError: No module named 'numpy'`,產品一點事都沒有。
        #   合成已經改成純標準函式庫(見那支腳本的檔頭)。唯一的外部相依是
        #   ffmpeg(Vorbis 編解碼,標準函式庫沒有)。
        #
        # ⚠ ffmpeg **不是** ubuntu runner 內建的 —— 上一版的註解在這裡寫錯,
        #   而開發機上有,所以本機一直綠、只有 CI 紅。這是 numpy 那件事的
        #   同一個形狀第二次:守門跑不起來,而畫面上長得像出貨資料壞了。
        #   所以下面那一行 apt-get 是這一關的一部分,不要「順手拿掉」。
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          python3 ./scripts/verify_key_feedback.py

      - name: 守門腳本的反向測試(植入 16 條真違規,確認它會紅)
        # 放在發布關卡**之後**:其中一條要用已建置的 APK
        # (產物層的「只有 NetworkGate 碰得到 HttpURLConnection」)。
        run: ./scripts/verify_audit_offline.sh

      # ⚠ 上面那一關驗的是判斷邏輯(fixture)。這一關驗的是**這一次真的建出來
      #   的那份 APK 走過同一條路會不會紅** —— 兩件事會分岔:aapt2 換版、
      #   AGP 改 manifest 合併、打包方式改變,任何一個都可能讓判讀在真的
      #   產物上失效,而 fixture 永遠不會發現。
      #
      #   變異挑的正是舊寫法擋不住的那一個:把我們自己的 librime_jni.so 從
      #   x86_64 拿掉,lib/x86_64/ 底下留著相依函式庫的 .so。舊的
      #   `grep -oE 'lib/[a-z0-9_-]+/'` 對這種 APK 是綠的。
      - name: 對真的 APK 做一次變異(拿掉 x86_64 的 JNI,這一關必須紅)
        run: |
          set -eu
          AAPT2="$(ls -1d "$ANDROID_SDK_ROOT"/build-tools/*/aapt2 | sort -Vr | head -1)"
          # 正控:沒動過的那一份必須是綠的。少了它,一個「永遠回紅」的
          # 判讀也會通過下面的反向測試。
          python3 scripts/apk_ime_shape.py --apk "$APK_PATH" --aapt2 "$AAPT2"
          cp "$APK_PATH" /tmp/mutant.apk
          zip -q -d /tmp/mutant.apk 'lib/x86_64/librime_jni.so'
          if python3 scripts/apk_ime_shape.py --apk /tmp/mutant.apk --aapt2 "$AAPT2" \
               > /tmp/mutant.out 2>&1; then
            echo "把 x86_64 的 JNI 拿掉之後這一關還是綠的 —— 它沒有在檢查" >&2
            cat /tmp/mutant.out >&2
            exit 1
          fi
          grep -q 'lib/x86_64/librime_jni.so' /tmp/mutant.out || {
            echo "紅了,但訊息沒指名少掉的是哪一個檔 —— 紅的理由可能不對" >&2
            cat /tmp/mutant.out >&2
            exit 1
          }
          echo "反向測試通過:x86_64 少了我們自己的 .so 會被抓到"

      - name: 簽章與單調性關卡(沿用 publish_apk.sh 的檢查)
        run: |
          # 不另寫一套簽章檢查。publish_apk.sh 裡那三項(輪替鏈逐一相符、
          # API 28+ 的簽章者是鏈上最後一把、API 26–27 的簽章者是鏈的根)
          # 就是「發出去會不會害既有使用者裝不上來」的全部。
          # 寫第二份遲早會與這一份漂移,而漂移時會過的那一份說了算。
          ./scripts/publish_apk.sh --check-only --apk "$APK_PATH"

      - name: 上傳 APK
        # 關卡紅了的時候更需要拿到那份 APK —— 「簽章不對」這種判定,
        # 不把檔案撈下來親自驗一次是查不出原因的。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rime-apk
          # 兩份都收。上傳時的共同祖先是 …/apk/,所以 artifact 裡會保留
          # release/ 與 debug/ 兩層 —— 下載端只要指到 …/apk 就還原成原樣。
          path: |
            ${{ env.APK_PATH }}
            ${{ env.APK_DEBUG_PATH }}
          if-no-files-found: error

      - name: 上傳執行期資料(給模擬器那條車道用)
        uses: actions/upload-artifact@v4
        with:
          # 模擬器 job 的核心層測試要把這 13MB 推到裝置上。重跑一次
          # fetch + opencc 也可以,但那樣驗到的就不是這份 APK 裡的那批資料了。
          name: rime-runtime-data
          path: core/data
          if-no-files-found: error

      - name: 上傳測試報告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            android/app/build/reports/tests/
            build/release-check/
          if-no-files-found: ignore

  # ════════════════════════════════════════════════════════════ 慢車道 ══
  emulator:
    name: 慢車道(模擬器驗證)
    needs: fast
    # 每次 push 都開模擬器太慢,會逼人繞過 CI。推上 main 與手動觸發時跑,
    # 而 publish 掛在它後面 —— 所以「發布前沒驗過」做不到。
    # ⚠ 支線想讓慢車道在自己這邊跑的話,**上面的 on: push: branches: 與這裡的
    #   if: 兩邊都要加**,而且合併回 main 之後兩邊都要拿掉
    #   (這一輪的 fix3-cand 與 t9hole 就是照這條拿掉的)。
    #   這條規矩是買來的:新增的慢車道關卡曾經一次都沒跑過,而**一支從來沒有
    #   在 CI 上跑過的關卡,看起來與一切正常一模一樣**。先是「檔頭寫著、
    #   workflow 沒接」(verify_syllables.sh 的三個反向測試踩過的坑),後來是
    #   **workflow 接了、分支沒接** —— 兩道閘門各自都足以讓新關卡一次都
    #   不跑,而**被跳過的 job 在 checks 上是灰色的勾**,和跑過而且通過長得
    #   一模一樣。現在 verify_syllables.sh --check-ci 看得懂這兩道閘門了
    #   (scripts/ci_branch_gate.py),再漏一次會當場紅。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 取出原始碼
        uses: actions/checkout@v4

      - name: 設定 Android 建置環境
        uses: ./.github/actions/setup-android

      - name: 取回快車道建好的 APK
        uses: actions/download-artifact@v4
        with:
          name: rime-apk
          # 指到 apk/ 這一層(不是 apk/debug):artifact 裡有 release/ 與
          # debug/ 兩個子目錄,指錯一層會把兩份 APK 攤平到同一個資料夾,
          # 而 release_check.sh 找的是 …/apk/release/app-release.apk。
          path: android/app/build/outputs/apk

      - name: 取回執行期資料
        uses: actions/download-artifact@v4
        with:
          name: rime-runtime-data
          path: core/data

      - name: 取回線上正在服役的 APK(當作升級測試的「舊版」)
        run: |
          set -euo pipefail
          # 這一步是整條流程的決定性驗收所需:release/ 底下這一份是**在那台
          # Ubuntu 上、用同一把金鑰簽的**、而且正是使用者手機上裝著的那一份。
          # release_check.sh 第 6c 關會先把它裝上去、讓它種下資料,再用 CI 建的
          # APK 覆蓋安裝。裝得上去 = CI 的簽章確實與本機同一條鏈。
          mkdir -p release
          curl -fsSL --retry 3 -o release/rime-online-latest.apk \
            "$R2_BASE_URL/rime/rime-latest.apk"
          ls -l release/
          "$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | sort -Vr | head -1)aapt2" \
            dump badging release/rime-online-latest.apk | grep -E "^package:"

      - name: 建輸入測試靶 APK
        run: ./scripts/build_testapp.sh

      - name: 建輸入矩陣 App(消歧欄關卡的輸入靶)
        run: ./scripts/build_input_matrix_app.sh

      - name: 安裝 OCR(消歧欄關卡讀的是畫面上的字,不是內部狀態)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
          tesseract --version | head -1
          # 裁切用 Pillow。runner 的 python3 預設沒有它,少了這一行,
          # 關卡會用「消歧欄上讀不到 ni/mi」的說法報一個不存在的產品問題。
          python3 -m pip install --quiet --user pillow
          python3 -c "import PIL; print('Pillow', PIL.__version__)"

      - name: 啟用 KVM(沒有它模擬器會慢到超時)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 模擬器上的發布關卡
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 8192M
          force-avd-creation: false
          # -no-snapshot:每一輪都要是全新的機器。帶著上一輪殘留的狀態驗證
          # 會同時製造假失敗(別條線改過預設方案)與假通過(舊資料掩蓋了
          # 首次部署的問題),而使用者拿到的是全新安裝。
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -no-snapshot -camera-back none
          disable-animations: true
          # ⚠ 這個 script 是被 /bin/sh(在 runner 上是 dash)執行的,不是 bash。
          #   `set -o pipefail` 在 dash 不存在,寫了會直接
          #   `set: Illegal option -o pipefail` 然後退出 2 —— 而那個失敗看起來
          #   像模擬器有問題。所以這裡只用 POSIX 的 set -eu,真正的邏輯交給
          #   release_check.sh(它自己的 shebang 是 bash)。
          script: |
            set -eu
            RIME_SERIAL=emulator-5554; export RIME_SERIAL
            ANDROID_SERIAL=emulator-5554; export ANDROID_SERIAL
            adb wait-for-device
            # release_check 的第 5–7 關。--strict:略過一律算失敗。
            # 這一條的綠燈不是「發布關卡通過」,只是它的一半 —— 腳本自己會說。
            bash ./scripts/release_check.sh --emu-only --strict
            # 九宮格拼音消歧欄。**斷言的是畫面上的像素**(截圖 → 裁到消歧欄
            # 該在的那一塊 → OCR),不是內部狀態:這個功能交付時只有純函式的
            # 單元測試加上人工看的截圖,而這個專案已經吃過七次
            # 「測試綠、使用者打開看不到」的虧。
            # 它自己會驗三份九宮格佈局都畫得出來(§2-G:掃到的份數有下界),
            # 並且先檢查裝置上的方案與 core/data/schemas/ 沒有漂移。
            adb install -r -g -t build/inputmatrix/rime-inputmatrix.apk
            # ⚠ 一行寫完,**不可以用反斜線換行**。這個 action 是把 script 逐行
            #   交給 sh -c 的(日誌裡每一行都是一次 [command]/usr/bin/sh -c …),
            #   所以行末的 `\` 會原樣變成一個參數,腳本收到之後回「未知參數: \」
            #   然後以 2 結束。YAML 是合法的,命令是壞的 —— 驗 YAML 驗不到這件事。
            bash ./scripts/verify_syllables.sh --apk "$APK_DEBUG_PATH"
            # 反向測試:把佈局的 syllable_slots 指到不存在的 key id(「有人把
            # pu_comma 改名」的真實形狀),格位替換就不會發生,畫面照常顯示標點
            # —— 第 2 關必須紅。三種植入裡只有這一種斷言的是畫面像素,
            # 所以只有它非得在模擬器上跑不可。帶 --plant 時退出碼是反的,
            # 而且腳本會確認紅的是**指名的那一條**(踩紅別條照樣算失敗)。
            # ⚠ 一行寫完,理由同上面那一行(這個 action 逐行交給 sh -c)。
            bash ./scripts/verify_syllables.sh --plant bad-slot-ids --out build/verify-syllables-plant
            # 反向測試:第 5 關(沒被接管的那一格)的兩個。這兩個改的是**原始碼**
            # —— 腳本自己 patch KeyboardView.kt、跑一次 assembleDebug、還原檔案,
            # 再拿建出來的那份 APK 去驗(所以不能帶 --apk),而且只跑第一份佈局。
            # 為什麼非得走這條路:tap-swallowed 那個形狀在 `./gradlew test` 610 條
            # 全綠、連掃原始碼那條檢查也全綠,而使用者按下左欄那顆標點鍵什麼都不會
            # 發生。只有「在模擬器上點下去、再問宿主輸入框有沒有多出那個字」看得到。
            # ⚠ 一行寫完,理由同上(這個 action 逐行交給 sh -c)。
            bash ./scripts/verify_syllables.sh --plant tap-swallowed --out build/verify-syllables-tapswallowed
            # tap-passthrough:點擊一律走原鍵的 onEvent → 被接管的那幾格只剩
            # tap = NOOP,點讀音沒有反應 → 第 4 關必須紅(點了 pin 還有 qin)。
            # 這一條證明的是既有的第 4 關真的有牙齒 —— 它從來沒有在植入下跑過。
            # ⚠ 一行寫完,理由同上(這個 action 逐行交給 sh -c)。
            bash ./scripts/verify_syllables.sh --plant tap-passthrough --out build/verify-syllables-tappass
            # 情境:裝置上放一份舊的單編碼方案(collect_data.sh 沒跑過的機器)。
            # 那種方案上 rs_set_input("niGAM") 照樣回 true,而使用者點下第一個
            # 候選就上屏「ni好」—— 真機回報過的那一條。斷言的是**消歧欄整條
            # 不得出現**:引擎接不住的東西,不可以在畫面上長成一顆可以按的鍵。
            # ⚠ 這不是 --plant,退出碼不反轉:植入的是環境,不是缺陷。
            # ⚠ 一行寫完,理由同上(這個 action 逐行交給 sh -c)。
            bash ./scripts/verify_syllables.sh --scenario stale-schema --out build/verify-syllables-stale
            # 候選列本身:左端不印按鍵代碼(真機回報 A-2)、翻得到第 2 頁而且
            # 選得下去(A-4)。與上面那一支互補 —— 那一支驗的是消歧欄那一欄,
            # 這一支驗的是候選列。兩條都只有畫面上才看得出來:純函式測試在
            # CandidateBarModelTest,而「畫出來了沒、點不點得到」它驗不到。
            # ⚠ 一行寫完,理由同上(這個 action 逐行交給 sh -c)。
            bash ./scripts/verify_candbar.sh --apk "$APK_DEBUG_PATH"
            # 匯出/匯入的完整往返。**這一支以前沒有被任何 workflow 呼叫過**,
            # 而 docs/backup-format.md §343 把它當成「整條往返實跑過」的證據 ——
            # 那句話在它被跑的那一天是真的,之後沒有任何東西讓它保持為真。
            #
            # 現在它是承重的:下載頁叫改名前的使用者「先匯出詞庫再解除安裝」,
            # 匯出要是壞的,那句話會直接毀掉他的詞庫。
            #
            # ⚠ 它驗的東西單元測試守不住:剛學到的詞還在 librime 的 WriteBatch 裡,
            #   直接複製 *.userdb/ 拿到的是上一輪的詞庫 —— 能開、能用、大小差不多,
            #   只是少了最近學的,而且沒有任何錯誤訊息。
            bash ./scripts/verify_backup_roundtrip.sh --apk "$APK_DEBUG_PATH"

      - name: 上傳模擬器 artifact(截圖、logcat、升級紀錄)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-artifacts
          # ⚠ 消歧欄那一關失敗時會印出 build/verify-syllables/... 的截圖路徑,
          #   但以前沒有收進 artifact —— 於是訊息指著一個 run 結束就消失的路徑,
          #   紅了也看不到畫面。這一輪就是因此得靠本機模擬器重跑一次。
          # ⚠ 用萬用字元收**全部**的 verify-syllables*/:每加一種 --plant 就多一個
          #   `--out` 目錄(-tapswallowed / -tappass / -stale),而漏收的那一個
          #   在紅掉的時候正好是唯一的現場。第一次跑慢車道就漏了 ——
          #   `--plant tap-swallowed` 的 plant-build.log 不在 artifact 裡,
          #   於是「安裝失敗」這四個字沒有任何東西可以往下查。
          path: |
            build/release-check/
            build/verify-syllables*/
            build/verify-candbar/
            build/verify-backup/
          if-no-files-found: ignore

  # ══════════════════════════════════════════════════════════════ 發布 ══
  publish:
    name: 發布到 R2(手動觸發)
    needs: [fast, emulator]
    # 兩個條件缺一不可:必須是人按下去的,而且必須明確勾了 publish。
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 取出原始碼
        uses: actions/checkout@v4

      - name: 設定 Android 建置環境(不需要 NDK,只要 aapt2 與 apksigner)
        uses: ./.github/actions/setup-android
        with:
          ndk: 'false'

      - name: 還原簽章環境(這裡只拿 lineage 當比對基準,不重簽)
        uses: ./.github/actions/restore-signing
        with:
          keystore-base64:       ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password:     ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias:             ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password:          ${{ secrets.ANDROID_KEY_PASSWORD }}
          lineage-base64:        ${{ secrets.ANDROID_LINEAGE_BASE64 }}
          old-keystore-base64:   ${{ secrets.ANDROID_OLD_KEYSTORE_BASE64 }}
          old-key-alias:         ${{ secrets.ANDROID_OLD_KEY_ALIAS }}
          # old-keystore-password / old-key-password 刻意不從 Secrets 來:
          # 那是 Android 工具的公開常數 "android",設成 secret 只會讓
          # GitHub 把日誌裡每一個 "android" 遮成 ***。見 restore-signing 的註解。

      - name: 取回快車道建好的 APK
        uses: actions/download-artifact@v4
        with:
          name: rime-apk
          path: android/app/build/outputs/apk

      - name: 還原 rclone 的 [r2] 設定
        env:
          RCLONE_CONF_B64: ${{ secrets.R2_RCLONE_CONF_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "$RCLONE_CONF_B64" ] || { echo "R2_RCLONE_CONF_BASE64 沒設,發不了" >&2; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > "$RUNNER_TEMP/rclone.conf"
          # 只有 [r2] 這一段(gh_set_secrets.py 只抽這一段)。bucket 內其他路徑
          # 屬於別的專案,publish_apk.sh 另有一道「只准寫 rime/ 底下」的硬性護欄。
          grep -q '^\[r2\]' "$RUNNER_TEMP/rclone.conf" || { echo "設定裡沒有 [r2] 段" >&2; exit 1; }
          echo "RCLONE_CONFIG=$RUNNER_TEMP/rclone.conf" >> "$GITHUB_ENV"

      - name: 發布
        env:
          NOTES: ${{ inputs.notes }}
          REMOTE_DIR: ${{ inputs.remote_dir }}
        run: |
          set -euo pipefail
          # publish_apk.sh 自己會做:發布前驗簽章(輪替鏈 + API 28+ + API 26–27)、
          # versionCode 不得降級、上傳後用 curl 驗證對外網址真的取得到
          # (HTTP 200 + 大小相符 + 檔頭是 PK\x03\x04 + version.json 讀得到 version_code)。
          # 這裡不重複那些檢查,也不繞過它們。
          ARGS=(--apk "$APK_PATH" --dir "$REMOTE_DIR")
          if [ -n "$NOTES" ]; then ARGS+=(--notes "$NOTES"); fi
          ./scripts/publish_apk.sh "${ARGS[@]}"

      - name: 上傳這次發布的 version.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-version
          path: release/version.json
          if-no-files-found: ignore
