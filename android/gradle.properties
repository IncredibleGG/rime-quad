org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

kotlin.code.style=official

# ─────────────────────────────────────────────────────────────────────────────
# 應用身分。applicationId / package 已知未來會改名，全部集中在這裡。
#
# 改名時要一起動的東西（2026-08 RimeQuad → LuminaKey 那次實際走過一遍，
# 原本這裡寫「只有三處」，是錯的）：
#   1. 本檔的 rime.applicationId / rime.namespace / rime.jniClass
#   2. app/src/{main,test}/java/ 底下的目錄結構與 Kotlin `package` 宣告，
#      以及 KDoc 裡的 [org.…] 連結
#   3. res/values*/themes.xml 的 style 名 + AndroidManifest 的 android:theme
#      —— 這個**不是**從這裡衍生的
#   4. res/values*/strings.xml 的 app_name / ime_label / subtype_label_zh
#   5. SharedPreferences 檔名（KeyboardChoice / StoreController /
#      UpdateController 的 PREFS 常數）—— 裡面沒有套件名，grep 套件名找不到
#   6. cpp/CMakeLists.txt 與 cpp/jni_bridge.cc 裡 RIME_JNI_CLASS 的**預設值**
#
# AndroidManifest 的 activity/service 名、method.xml 的 settingsActivity
# 確實是衍生的（相對類名 + resValue），那部分原本的說法沒錯。
#
# ⚠ android/ 之外還有一份，改名時必須一起對帳，否則關卡會紅：
#   scripts/release_check.sh（IME_ID、uninstall/run-as/dumpsys 的套件名）、
#   verify_*.sh 的 --ime 預設值、audit_offline.sh 的 GATE_REL、
#   dex_network_refs.py 釘死的 Lorg/…/NetworkGate; 清單。
#
# ⚠ 刻意**不**跟著改：`rimequad-backup.json` / `rimequad-store.json` /
#   `rimequad-layouts.json`。那是 docs/backup-format.md 定義的四端共用容器
#   格式，改它等於改格式，要四端一起來。見 store/BackupFormat.kt。
#
# rime.jniClass 會以 -DRIME_JNI_CLASS 傳進 CMake，JNI 走 RegisterNatives，
# 所以 C++ 端沒有 Java_xxx 形式的符號名；但第 6 點那兩個預設值仍寫著套件名，
# 不經 Gradle 的建置會用到它們，改錯只在執行期 FindClass 失敗時才看得出來。
# ─────────────────────────────────────────────────────────────────────────────
rime.applicationId=org.luminakey.ime
rime.namespace=org.luminakey.ime
rime.jniClass=org/luminakey/ime/core/RimeCore
