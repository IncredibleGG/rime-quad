# ─────────────────────────────────────────────────────────────────────────────
#  qwerty — 標準英數 26 鍵（行動端）
#
#  這是最保守的一份佈局，用來釘住格式的基本形狀：
#  layers → rows → keys，每個鍵有寬度權重、長按彈出、以及「送出什麼」。
#
#  ⚠ 送出的是 X11 keysym（librime 的輸入貨幣），不是字元。
#     本檔所有可見字元鍵都走 send.keysym，讓 librime 的 speller / punctuator
#     有機會消費；只有 librime 不認得的字元才用 send.text 直接上屏。
#
#  規範：docs/theme-format.md §9「鍵盤佈局格式」
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
#  ⚠ swipe 現在按不到 —— 這份佈局裡的每一條 `swipe:` 都還沒有人接
#
#  §9.6 明訂 `swipe` 是 OPTIONAL 能力：渲染器**必須**解析得了它、**可以**
#  完全忽略它的行為，而且忽略不得產生 WARNING。四端至今**沒有一端**做了
#  滑動分派（Android 的 `KeyboardView` 只有 `detectTapGestures`），所以底下
#  每一條 `swipe:` 目前**使用者一次都觸發不到**。
#
#  留著它們是刻意的：規範規定佈局作者 MUST NOT 把功能設計成只有 swipe 觸達，
#  所以每一條都只是某個既有操作的捷徑（對照表見 `docs/theme-format.md` §9.6）。
#  寫在這裡是為了不讓它讀起來像「做好了」。
#
#  Android 端由 `LayoutSwipeReachabilityTest` 逐條守著：哪一天有人把滑動分派
#  接上去，那一支會紅，提醒把這段註解連同對照表一起更新。
# ─────────────────────────────────────────────────────────────────────────────

format: rime-layout/1
id: qwerty
revision: 1

name:
  en: "QWERTY"
  zh-Hant: "QWERTY 英數"
  zh-Hans: "QWERTY 英数"

description:
  zh-Hant: "標準 26 鍵，適用於拼音、倉頡等以拉丁字母為輸入碼的方案。"

author: "rime-quad"
license: "CC0-1.0"

kind: alphabetic
targets: [android, ios]
for_schema: ["*"]
direction: ltr
default_layer: lower
primary: true

metrics:
  row_spacing: null
  key_spacing: null
  height_scale: 1.0

layers:

  # ── 小寫層 ───────────────────────────────────────────────────────────────
  - id: "lower"
    label: "abc"
    units: 10
    rows:

      - weight: 1.0
        keys:
          - { id: "q", label: "q", hint: "1", send: { keysym: "q" }, swipe: { up: { send: { keysym: "1" } } }, popup: { keys: [ { label: "1", send: { keysym: "1" } } ] } }
          - { id: "w", label: "w", hint: "2", send: { keysym: "w" }, swipe: { up: { send: { keysym: "2" } } }, popup: { keys: [ { label: "2", send: { keysym: "2" } } ] } }
          - { id: "e", label: "e", hint: "3", send: { keysym: "e" }, swipe: { up: { send: { keysym: "3" } } }, popup: { keys: [ { label: "3", send: { keysym: "3" } } ] } }
          - { id: "r", label: "r", hint: "4", send: { keysym: "r" }, swipe: { up: { send: { keysym: "4" } } }, popup: { keys: [ { label: "4", send: { keysym: "4" } } ] } }
          - { id: "t", label: "t", hint: "5", send: { keysym: "t" }, swipe: { up: { send: { keysym: "5" } } }, popup: { keys: [ { label: "5", send: { keysym: "5" } } ] } }
          - { id: "y", label: "y", hint: "6", send: { keysym: "y" }, swipe: { up: { send: { keysym: "6" } } }, popup: { keys: [ { label: "6", send: { keysym: "6" } } ] } }
          - { id: "u", label: "u", hint: "7", send: { keysym: "u" }, swipe: { up: { send: { keysym: "7" } } }, popup: { keys: [ { label: "7", send: { keysym: "7" } } ] } }
          - { id: "i", label: "i", hint: "8", send: { keysym: "i" }, swipe: { up: { send: { keysym: "8" } } }, popup: { keys: [ { label: "8", send: { keysym: "8" } } ] } }
          - { id: "o", label: "o", hint: "9", send: { keysym: "o" }, swipe: { up: { send: { keysym: "9" } } }, popup: { keys: [ { label: "9", send: { keysym: "9" } } ] } }
          - { id: "p", label: "p", hint: "0", send: { keysym: "p" }, swipe: { up: { send: { keysym: "0" } } }, popup: { keys: [ { label: "0", send: { keysym: "0" } } ] } }

      - weight: 1.0
        keys:
          - { spacer: true, width: 0.5 }
          - { id: "a", label: "a", send: { keysym: "a" } }
          - { id: "s", label: "s", send: { keysym: "s" } }
          - { id: "d", label: "d", send: { keysym: "d" } }
          - { id: "f", label: "f", send: { keysym: "f" } }
          - { id: "g", label: "g", send: { keysym: "g" } }
          - { id: "h", label: "h", send: { keysym: "h" } }
          - { id: "j", label: "j", send: { keysym: "j" } }
          - { id: "k", label: "k", send: { keysym: "k" } }
          - { id: "l", label: "l", send: { keysym: "l" } }
          - { spacer: true, width: 0.5 }

      - weight: 1.0
        keys:
          - id: "shift"
            icon: shift
            style: modifier
            width: 1.5
            tap: "layer_once:upper"
            double_tap: "layer_lock:upper"
          - { id: "z", label: "z", send: { keysym: "z" } }
          - { id: "x", label: "x", send: { keysym: "x" } }
          - { id: "c", label: "c", send: { keysym: "c" } }
          - { id: "v", label: "v", send: { keysym: "v" } }
          - { id: "b", label: "b", send: { keysym: "b" } }
          - { id: "n", label: "n", send: { keysym: "n" } }
          - { id: "m", label: "m", send: { keysym: "m" } }
          - id: "backspace"
            icon: backspace
            style: modifier
            width: 1.5
            send: { keysym: "BackSpace" }
            repeat: true
            swipe:
              left: { tap: "clear" }

      - weight: 1.0
        keys:
          - id: "to_symbols"
            label: "?123"
            style: modifier
            width: 1.5
            tap: "switch_layout:numeric-symbol"
          - id: "lang"
            label_from: input_mode_pair
            style: modifier
            width: 1.25
            tap: "input_mode:toggle"
            long_press: "schema:picker"
          - id: "space"
            icon: space
            style: space
            width: 4.5
            label_from: schema_name
            send: { keysym: "space" }
            swipe:
              left:  { tap: "cursor:left" }
              right: { tap: "cursor:right" }
            long_press: "schema:next"
          - id: "comma"
            label: "，"
            width: 1.25
            send: { keysym: "comma" }
            popup:
              layout: row
              keys:
                - { label: "。", send: { keysym: "period" } }
                - { label: "？", send: { keysym: "question" } }
                - { label: "！", send: { keysym: "exclam" } }
                - { label: "、", send: { text: "、" } }
                - { label: "…", send: { text: "…" } }
                # 分詞符。拼音有一整類詞在沒有它的時候打不出來:
                # `xian` 是「先」,`xi'an` 才是「西安」;`fangan` 是「反感」,
                # `fang'an` 才是「方案」。桌面端按鍵盤上的 ' 就有,行動端
                # 在這之前**一顆鍵都送不出它** —— 那不是進階功能,
                # 是「這幾個詞打不出來」。
                #
                # 放在逗號的長按盤而不是給它一顆常駐鍵:它的使用頻率遠低於
                # 標點,而底列已經滿了。送 keysym 而不是 text:它要進 speller
                # 當分隔符,走 text 會直接上屏一個撇號。
                - { label: "'", send: { keysym: "apostrophe" } }
          - id: "enter"
            icon: enter
            style: action
            width: 1.5
            send: { keysym: "Return" }

  # ── 大寫層 ───────────────────────────────────────────────────────────────
  #  刻意完整寫出而不採用「自動大寫」的隱式規則：四端各自實作解析器時，
  #  隱式規則是行為分歧的主要來源。層是顯式的，因此是可驗證的。
  - id: "upper"
    label: "ABC"
    units: 10
    rows:

      - weight: 1.0
        keys:
          - { id: "q", label: "Q", hint: "1", send: { keysym: "Q", modifiers: [Shift] } }
          - { id: "w", label: "W", hint: "2", send: { keysym: "W", modifiers: [Shift] } }
          - { id: "e", label: "E", hint: "3", send: { keysym: "E", modifiers: [Shift] } }
          - { id: "r", label: "R", hint: "4", send: { keysym: "R", modifiers: [Shift] } }
          - { id: "t", label: "T", hint: "5", send: { keysym: "T", modifiers: [Shift] } }
          - { id: "y", label: "Y", hint: "6", send: { keysym: "Y", modifiers: [Shift] } }
          - { id: "u", label: "U", hint: "7", send: { keysym: "U", modifiers: [Shift] } }
          - { id: "i", label: "I", hint: "8", send: { keysym: "I", modifiers: [Shift] } }
          - { id: "o", label: "O", hint: "9", send: { keysym: "O", modifiers: [Shift] } }
          - { id: "p", label: "P", hint: "0", send: { keysym: "P", modifiers: [Shift] } }

      - weight: 1.0
        keys:
          - { spacer: true, width: 0.5 }
          - { id: "a", label: "A", send: { keysym: "A", modifiers: [Shift] } }
          - { id: "s", label: "S", send: { keysym: "S", modifiers: [Shift] } }
          - { id: "d", label: "D", send: { keysym: "D", modifiers: [Shift] } }
          - { id: "f", label: "F", send: { keysym: "F", modifiers: [Shift] } }
          - { id: "g", label: "G", send: { keysym: "G", modifiers: [Shift] } }
          - { id: "h", label: "H", send: { keysym: "H", modifiers: [Shift] } }
          - { id: "j", label: "J", send: { keysym: "J", modifiers: [Shift] } }
          - { id: "k", label: "K", send: { keysym: "K", modifiers: [Shift] } }
          - { id: "l", label: "L", send: { keysym: "L", modifiers: [Shift] } }
          - { spacer: true, width: 0.5 }

      - weight: 1.0
        keys:
          - id: "shift"
            icon: shift
            style: modifier
            width: 1.5
            active: true
            tap: "layer:lower"
            double_tap: "layer_lock:upper"
          - { id: "z", label: "Z", send: { keysym: "Z", modifiers: [Shift] } }
          - { id: "x", label: "X", send: { keysym: "X", modifiers: [Shift] } }
          - { id: "c", label: "C", send: { keysym: "C", modifiers: [Shift] } }
          - { id: "v", label: "V", send: { keysym: "V", modifiers: [Shift] } }
          - { id: "b", label: "B", send: { keysym: "B", modifiers: [Shift] } }
          - { id: "n", label: "N", send: { keysym: "N", modifiers: [Shift] } }
          - { id: "m", label: "M", send: { keysym: "M", modifiers: [Shift] } }
          - id: "backspace"
            icon: backspace
            style: modifier
            width: 1.5
            send: { keysym: "BackSpace" }
            repeat: true
            swipe:
              left: { tap: "clear" }

      - weight: 1.0
        keys:
          - id: "to_symbols"
            label: "?123"
            style: modifier
            width: 1.5
            tap: "switch_layout:numeric-symbol"
          - id: "lang"
            label_from: input_mode_pair
            style: modifier
            width: 1.25
            tap: "input_mode:toggle"
            long_press: "schema:picker"
          - id: "space"
            icon: space
            style: space
            width: 4.5
            label_from: schema_name
            send: { keysym: "space" }
            swipe:
              left:  { tap: "cursor:left" }
              right: { tap: "cursor:right" }
            long_press: "schema:next"
          - id: "comma"
            label: "，"
            width: 1.25
            send: { keysym: "comma" }
          - id: "enter"
            icon: enter
            style: action
            width: 1.5
            send: { keysym: "Return" }
