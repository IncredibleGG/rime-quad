name: macOS (核心 + 輸入法 + 設定介面)

# 這個 workflow 分兩層,對應 docs/handoff-macos.md §7:
#
#   (a) CI 驗得了的 —— 純邏輯單元測試、核心層打得出字、.app 編得起來、
#       bundle 結構與 IMKit 宣告齊全、二進位真的連上 librime、
#       **.pkg 真的裝到正確的位置**、單一連網出口沒有破功。
#   (b) 只有人做得到的 —— 在真的 Mac 上裝起來實際用。**這裡一項都驗不到。**
#
# ⚠ macos runner **沒有登入的圖形工作階段**,系統不會從 ~/Library/Input Methods
#   載入輸入法。所以「候選窗有沒有出現」「設定視窗長什麼樣」「按下去有沒有反應」
#   在這裡全部驗不了。這個 workflow 全綠**不代表能用**。
#   沒被驗到的完整清單見 apple/README.md §3。
#
# 步驟順序是刻意的:不需要 librime 的檢查排在前面。單元測試 40 秒就跑完,
# 而從原始碼建 librime 要 4 分鐘 —— Kit 壞掉時不該讓人等那 4 分鐘。

on:
  push:
    branches: [main, macos, rename-apple, dictfix]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-verify:
    runs-on: macos-latest
    timeout-minutes: 75

    steps:
      - name: 取出原始碼
        uses: actions/checkout@v4

      - name: 記錄工具鏈版本（失敗時要能重建現場）
        run: |
          sw_vers
          echo "arch: $(uname -m)"
          cmake --version | head -1
          clang++ --version | head -1
          swift --version
          bash --version | head -1

      # ── (a-0) 名字:不編譯、不需要 macOS,30 毫秒,所以排最前面 ──
      # 改名最典型的失敗是「改了一半」,而它的症狀全都是
      # 「裝得起來、看得到、不能用,而且沒有錯誤訊息」。這一關把
      # bundle id / TISInputSourceID / .lproj 的鍵 / @objc 類別名 /
      # 腳本裡的產物路徑釘在一起,順便擋住「這個 workflow 自己掉了一關」。
      - name: 名字一致性的反向測試（證明它真的會紅）
        run: python3 ./apple/scripts/verify_names.py --self-test

      - name: 名字一致性（bundle id / 輸入模式 id / 類別名 / 產物路徑）
        run: python3 ./apple/scripts/verify_names.py

      # ── (a-0b) 定位:一行 grep 就該看得完 ──────────────────────
      - name: 單一連網出口的反向測試（證明它真的會紅）
        run: ./apple/scripts/verify_single_egress.sh --expect-fail

      - name: 整個 app 只有一個地方連得上網
        run: ./apple/scripts/verify_single_egress.sh

      # ── (a-1) 純邏輯:不需要 librime,所以排最前面 ──────────────
      - name: 單元測試（主題 / keysym / 排版 / 上屏 / 設定 / 市集 / 詞庫 / 輸入模式）
        run: ./apple/scripts/run_kit_tests.sh

      # ── (a-2) 核心層:與上一輪相同,不得回歸 ────────────────────
      - name: 取得方案原始資料（版本已釘死）
        run: ./scripts/fetch_rime_data.sh

      - name: 編譯原生層（librime + 5 個依賴 + librime-lua + rime_console）
        run: ./apple/scripts/build_macos.sh

      - name: 組裝執行期資料
        run: ./scripts/collect_data.sh

      - name: 確認執行期資料真的齊全
        run: ./apple/scripts/verify_data.sh

      - name: 確認四個方案真的部署成功
        run: |
          # rime_console 的 deploy-only 模式（keys 傳 "-"）會印出機器可讀的
          # "[schema] <id><TAB><name>"。少了這一步，某個方案靜靜地從部署裡掉
          # 出去不會有人發現 —— 底下兩個打字斷言只碰得到 luna_pinyin_tw 與
          # bopomofo_tw，t9_pinyin / luna_pinyin 壞掉照樣全綠。
          set -uo pipefail
          OUT="$(./apple/build/rime_console core/data/shared core/data/user - 2>&1)"
          rc=$?
          printf '%s\n' "$OUT" | grep -E '^\[deploy-only\]' || true
          if [ "$rc" -ne 0 ]; then
            printf '%s\n' "$OUT"
            echo "!! rime_console 結束碼 $rc"
            exit 1
          fi
          printf '%s\n' "$OUT" \
            | awk -F'\t' '/^\[schema\] /{ sub(/^\[schema\] /, "", $1); print $1 }' \
            > /tmp/deployed_schemas.txt
          echo "已部署方案："; sed 's/^/    /' /tmp/deployed_schemas.txt
          fail=0
          for s in luna_pinyin_tw bopomofo_tw luna_pinyin t9_pinyin; do
            if grep -qx "$s" /tmp/deployed_schemas.txt; then
              echo "  ✓ $s"
            else
              echo "  !! 方案 $s 沒有部署成功"; fail=1
            fi
          done
          exit $fail

      - name: 斷言本體的反向測試（證明它真的會紅）
        run: |
          # 先證明斷言會失敗，再相信它的成功。
          ./apple/scripts/verify_console.sh --expect-fail nihao luna_pinyin_tw 這不可能是結果

      - name: 核心驗證 — 拼音 nihao → 你好
        run: ./apple/scripts/verify_console.sh nihao luna_pinyin_tw 你好

      - name: 核心驗證 — 注音 su3cl3 → 你好
        run: ./apple/scripts/verify_console.sh su3cl3 bopomofo_tw 你好

      # ── (a-2b) 使用者加的詞:證明那份 TSV 真的會影響輸出 ────────
      # 這一關驗的是 docs/settings-model.md §5 的格式。純邏輯測試只能證明
      # 我們**寫出**了正確的檔案,證明不了 librime **讀得懂**它 ——
      # 而「檔案格式其實沒生效」正是那種畫面完全正常的缺陷。
      #
      # ⚠ **這一關曾經是 `continue-on-error: true`**,因為它是紅的,
      #   而「自己加的詞」那一頁據此被下架。2026-08-09 找到原因(編碼欄的空格)
      #   並修好之後,它變成硬失敗,那一頁也回到線上。
      #   **它紅了就代表那一頁又變成「按得下去但什麼都不會發生」——
      #   那時要做的是修它,或把那一頁再拿下來,不是把這裡改回 continue-on-error。**
      - name: 使用者加的詞真的會改變輸出（綠了才准上架那一頁）
        run: ./apple/scripts/verify_user_dict.sh

      # ── (a-3) 輸入法本體 + 設定介面 ────────────────────────────
      - name: 建 LuminaKey.app（輸入法 + 內嵌的設定介面）
        run: ./apple/scripts/build_app.sh

      - name: 驗證 .app 的結構與 IMKit 宣告
        run: ./apple/scripts/verify_app_bundle.sh

      # ⚠ 一次植入三個違規、只斷言「有東西紅了」是不夠的:那證明不了
      #   **哪一條**斷言在做事,而沒在做事的那幾條看起來完全一樣。
      #   改成一次一個違規,而且斷言紅的是**它自己那一行**。
      #   其中「多打包了 core/layouts/」那條反向斷言在這之前從來沒有被
      #   反向驗過 —— 它可以整條被刪掉而 CI 全綠。
      - name: bundle 驗證的反向測試（5 個變異,每個都要紅在自己那一條）
        run: |
          set -uo pipefail
          # ⚠ Actions 的預設 shell 是 `bash -e {0}` —— errexit **本來就開著**,
          #   而 `set -uo pipefail` 不會把它關掉。留著的話,底下
          #   `out="$(verify_app_bundle.sh --expect-fail ...)"` 一旦回非零,
          #   整個 step 會在**印出原因之前**就被掐掉,於是唯一需要那段診斷的
          #   時候它不存在。失敗由這支腳本自己判定,所以明確關掉。
          set +e
          SRC=apple/build/LuminaKey.app
          PB=/usr/libexec/PlistBuddy
          BROKEN=/tmp/Broken.app
          fails=0

          fresh() { rm -rf "$BROKEN"; cp -R "$SRC" "$BROKEN"; }

          expect() {  # expect <這個變異的名字> <輸出裡必須出現的那一行>
            local label="$1" want="$2" out rc
            out="$(./apple/scripts/verify_app_bundle.sh --expect-fail "$BROKEN" 2>&1)"
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "!! [$label] 壞掉的 bundle 竟然通過了全部斷言（結束碼 $rc）"
              printf '%s\n' "$out"
              fails=$((fails + 1))
              return
            fi
            # ⚠ 不用 `grep -q`:本步驟開了 pipefail,命中即結束會讓上游收到
            #   SIGPIPE,整條 pipeline 判失敗（這個專案已經被咬過兩次）。
            #   用 shell 自己的 case 比對,不經管線。
            case "$out" in
              *"$want"*) echo "  ✓ [$label] 紅在對的地方：$want" ;;
              *) echo "!! [$label] 紅了,但不是因為「$want」："
                 printf '%s\n' "$out"
                 fails=$((fails + 1)) ;;
            esac
          }

          # 1. 少了連線名 → IMKServer 建不起來（裝得起來、按鍵沒反應）
          fresh
          "$PB" -c "Delete :InputMethodConnectionName" "$BROKEN/Contents/Info.plist"
          expect "少了 InputMethodConnectionName" "✗ InputMethodConnectionName"

          # 2. 類別名對不上 → NSClassFromString 回 nil。這一條由二進位自己
          #    照 IMKit 的作法查一次（--self-check），不是 grep 符號表。
          fresh
          "$PB" -c "Set :InputMethodServerControllerClass NoSuchClass" \
            "$BROKEN/Contents/Info.plist"
          expect "ServerControllerClass 指向不存在的類別" "✗ 二進位 --self-check 失敗"

          # 3. TISInputSourceID 沒有以 bundle id 為前綴 → 系統不列出這個輸入模式
          fresh
          "$PB" -c "Set :ComponentInputModeDict:tsInputModeListKey:org.luminakey.inputmethod.LuminaKey.Hant:TISInputSourceID com.example.NotOurs" \
            "$BROKEN/Contents/Info.plist"
          expect "TISInputSourceID 前綴不對" "✗ 每個 TISInputSourceID"

          # 4. 資源沒進 bundle
          fresh
          rm -rf "$BROKEN/Contents/Resources/themes"
          expect "沒有隨附主題" "✗ 隨附主題"

          # 5. **反過來的那一條**：多帶了東西也是錯的。
          #    桌面沒有軟鍵盤,core/layouts/ 進了 bundle 會讓人以為有。
          fresh
          mkdir -p "$BROKEN/Contents/Resources/layouts"
          expect "多打包了 core/layouts/" "✗ 沒有打包 core/layouts"

          rm -rf "$BROKEN"
          if [ "$fails" -ne 0 ]; then
            echo "!! $fails 個反向測試沒有紅在對的地方" >&2
            exit 1
          fi
          echo "5 個變異全部紅在自己那一條 ✓"

      # ── (a-4) 安裝:這一輪新增,對應真機回報的兩個缺陷 ──────────
      - name: 做出 .pkg 安裝檔
        run: ./apple/scripts/build_pkg.sh

      - name: 真的裝一次,並問系統認不認得這個輸入法
        run: ./apple/scripts/verify_pkg.sh

      - name: 打包核心產物
        run: ./apple/scripts/package_core.sh

      - name: 上傳核心產物
        uses: actions/upload-artifact@v4
        with:
          name: rime-macos-core
          path: apple/build/dist/*.tar.gz
          if-no-files-found: error

      - name: 打包 .app
        run: |
          cd apple/build
          # 用 tar 而不是讓 upload-artifact 直接吃目錄:zip 會丟掉執行權限
          # 與符號連結,解開之後的 .app 是壞的。
          tar czf LuminaKey-app-$(uname -m).tar.gz LuminaKey.app
          ls -lh LuminaKey-app-*.tar.gz

      - name: 上傳 .app
        uses: actions/upload-artifact@v4
        with:
          name: rime-macos-app
          path: apple/build/LuminaKey-app-*.tar.gz
          if-no-files-found: error

      # ⚠ 這是使用者實際會拿到的東西。上傳成獨立的 artifact,
      #   免得他又要從一包 tar 裡自己找出 .app 並手動放進隱藏目錄。
      - name: 上傳 .pkg（使用者雙擊安裝的那一份）
        uses: actions/upload-artifact@v4
        with:
          name: rime-macos-installer
          path: apple/build/dist/LuminaKey-*.pkg
          if-no-files-found: error
