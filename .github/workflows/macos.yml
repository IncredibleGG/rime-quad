name: macOS (核心 + 輸入法)

# 這個 workflow 分兩層,對應 docs/handoff-macos.md §7:
#
#   (a) CI 驗得了的 —— 純邏輯單元測試、核心層打得出字、.app 編得起來、
#       bundle 結構與 IMKit 宣告齊全、二進位真的連上 librime。
#   (b) 只有人做得到的 —— 在真的 Mac 上裝起來實際用。**這裡一項都驗不到。**
#
# ⚠ macos runner **沒有登入的圖形工作階段**,系統不會從 ~/Library/Input Methods
#   載入輸入法。所以「候選窗有沒有出現」「在真的 app 裡打不打得出字」
#   「按下去有沒有反應」在這裡全部驗不了。這個 workflow 全綠**不代表能用**。
#   沒被驗到的完整清單見 apple/README.md。
#
# 步驟順序是刻意的:不需要 librime 的檢查排在前面。單元測試 40 秒就跑完,
# 而從原始碼建 librime 要 4 分鐘 —— Kit 壞掉時不該讓人等那 4 分鐘。

on:
  push:
    branches: [main, macos]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-verify:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: 取出原始碼
        uses: actions/checkout@v4

      - name: 記錄工具鏈版本（失敗時要能重建現場）
        run: |
          sw_vers
          echo "arch: $(uname -m)"
          cmake --version | head -1
          clang++ --version | head -1
          swift --version
          bash --version | head -1

      # ── (a-1) 純邏輯:不需要 librime,所以排最前面 ──────────────
      - name: 單元測試（主題解析 / keysym 映射 / 候選窗排版 / 上屏狀態機）
        run: ./apple/scripts/run_kit_tests.sh

      # ── (a-2) 核心層:與上一輪相同,不得回歸 ────────────────────
      - name: 取得方案原始資料（版本已釘死）
        run: ./scripts/fetch_rime_data.sh

      - name: 編譯原生層（librime + 5 個依賴 + librime-lua + rime_console）
        run: ./apple/scripts/build_macos.sh

      - name: 組裝執行期資料
        run: ./scripts/collect_data.sh

      - name: 確認執行期資料真的齊全
        run: ./apple/scripts/verify_data.sh

      - name: 確認四個方案真的部署成功
        run: |
          # rime_console 的 deploy-only 模式（keys 傳 "-"）會印出機器可讀的
          # "[schema] <id><TAB><name>"。少了這一步，某個方案靜靜地從部署裡掉
          # 出去不會有人發現 —— 底下兩個打字斷言只碰得到 luna_pinyin_tw 與
          # bopomofo_tw，t9_pinyin / luna_pinyin 壞掉照樣全綠。
          set -uo pipefail
          OUT="$(./apple/build/rime_console core/data/shared core/data/user - 2>&1)"
          rc=$?
          printf '%s\n' "$OUT" | grep -E '^\[deploy-only\]' || true
          if [ "$rc" -ne 0 ]; then
            printf '%s\n' "$OUT"
            echo "!! rime_console 結束碼 $rc"
            exit 1
          fi
          # 用 awk 以 TAB 切欄，避免在 YAML 裡塞字面 TAB
          printf '%s\n' "$OUT" \
            | awk -F'\t' '/^\[schema\] /{ sub(/^\[schema\] /, "", $1); print $1 }' \
            > /tmp/deployed_schemas.txt
          echo "已部署方案："; sed 's/^/    /' /tmp/deployed_schemas.txt
          fail=0
          for s in luna_pinyin_tw bopomofo_tw luna_pinyin t9_pinyin; do
            if grep -qx "$s" /tmp/deployed_schemas.txt; then
              echo "  ✓ $s"
            else
              echo "  !! 方案 $s 沒有部署成功"; fail=1
            fi
          done
          exit $fail

      - name: 斷言本體的反向測試（證明它真的會紅）
        run: |
          # 先證明斷言會失敗，再相信它的成功。
          # docs/handoff-macos.md §7:「測試是綠的，因為它沒在測。」
          # 這一步故意餵一個錯的預期值，斷言必須判定失敗；
          # 若它通過了，代表斷言邏輯本身壞掉，後面兩步的綠沒有意義。
          ./apple/scripts/verify_console.sh --expect-fail nihao luna_pinyin_tw 這不可能是結果

      - name: 核心驗證 — 拼音 nihao → 你好
        run: ./apple/scripts/verify_console.sh nihao luna_pinyin_tw 你好

      - name: 核心驗證 — 注音 su3cl3 → 你好
        run: ./apple/scripts/verify_console.sh su3cl3 bopomofo_tw 你好

      # ── (a-3) 輸入法本體 ──────────────────────────────────────
      - name: 建 RimeQuad.app（IMKServer + IMKInputController + 候選窗）
        run: ./apple/scripts/build_app.sh

      - name: 驗證 .app 的結構與 IMKit 宣告
        run: ./apple/scripts/verify_app_bundle.sh

      - name: bundle 驗證的反向測試（證明它真的會紅）
        run: |
          # 與核心斷言同一個紀律：先證明它會失敗。
          # 這裡刻意破壞三件**各自獨立**的東西，因為 verify_app_bundle.sh
          # 有二十幾條斷言，只壞一條證明不了其他條有在跑。
          set -e
          BROKEN=/tmp/Broken.app
          rm -rf "$BROKEN"
          cp -R apple/build/RimeQuad.app "$BROKEN"
          /usr/libexec/PlistBuddy -c "Delete :InputMethodConnectionName" \
            "$BROKEN/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :InputMethodServerControllerClass NoSuchClass" \
            "$BROKEN/Contents/Info.plist"
          rm -rf "$BROKEN/Contents/Resources/themes"
          ./apple/scripts/verify_app_bundle.sh --expect-fail "$BROKEN"
          rm -rf "$BROKEN"

      - name: 打包核心產物
        run: ./apple/scripts/package_core.sh

      - name: 上傳核心產物
        uses: actions/upload-artifact@v4
        with:
          name: rime-macos-core
          path: apple/build/dist/*.tar.gz
          if-no-files-found: error

      - name: 打包 .app
        run: |
          cd apple/build
          # 用 tar 而不是讓 upload-artifact 直接吃目錄:zip 會丟掉執行權限
          # 與符號連結,解開之後的 .app 是壞的。
          tar czf RimeQuad-app-$(uname -m).tar.gz RimeQuad.app
          ls -lh RimeQuad-app-*.tar.gz

      - name: 上傳 .app
        uses: actions/upload-artifact@v4
        with:
          name: rime-macos-app
          path: apple/build/RimeQuad-app-*.tar.gz
          if-no-files-found: error
