# ─────────────────────────────────────────────────────────────────────────────
#  t9-pinyin — 九宮格拼音（4 欄 × 4 列）【已由 cn-t9-pinyin 取代，不再是預設】
#
#  ⚠ **這份佈局的 4 欄結構是錯的，請改用 `cn-t9-pinyin`（5 欄）。**
#
#     競品實測（S24U，cn-compact-* 主題）：
#         本檔（4 欄）  平均鍵寬 105.6 dp ÷ 鍵高 54 dp = **1.95**
#         語燕                                          1.36
#         三星（5 欄）                                  1.53
#     根因是**把缺掉的第五欄寬度攤給了四顆鍵**：華語九宮格是
#     「左整欄標點 ＋ 中間 3×3 字母 ＋ 右整欄功能鍵」，不是 4×4。
#     少掉那一欄，每顆鍵就寬了 25%，長寬比被拉到快 2:1。
#     補上那一欄（`cn-t9-pinyin`）長寬比自動落回 1.53，不必調任何數字。
#
#     本檔保留的理由只有兩個：讓已經選過它的使用者不會突然掉鍵盤，
#     以及它是「西式 4 欄 T9」的參考實作。`auto_for_schema: []`
#     把自動命中讓給 `cn-t9-pinyin`，所以新使用者不會再遇到它。
#
#  ⚠ 本佈局需要一個對應的 T9 方案（schema）才會動。
#     見 docs/theme-format.md §9.4 與本次交付報告的「九宮格技術路線」。
#
#  ── 為什麼佈局檔不需要「一鍵多值」的能力 ───────────────────────────────
#
#  九宮格是**模糊輸入**：一顆「ABC」鍵要能打出 a、b、c 任一個。直覺上會以為
#  格式必須支援「一顆鍵送出多個候選字元」。**這個直覺是錯的。**
#
#  librime 的 `Engine::ProcessKey(const KeyEvent&)` 一次只吃一個 keycode，
#  沒有「送出一組候選 keysym」的 API。模糊性完全由方案端的 prism 承擔：
#  T9 方案的 `speller/algebra` 會把**詞典裡的拼音音節**轉寫成按鍵序列，
#  於是 prism 裡「A」這條邊本來就同時通往所有含 a/b/c 的音節。
#
#  所以前端這顆鍵送出的就是**單一 keysym**，「ABC」只是畫在鍵面上的字。
#  這正是本格式 label / hint / send 三者分離的第二個實證
#  —— 與注音大千同一個機制，不同的用途。
#
#  ── 按鍵 → keysym 對照（與方案的 speller/alphabet 必須一致）─────────────
#
#  採 YuyanIme（語燕，BSD-3）驗證過的做法：每組字母取一個**代表大寫字母**
#  當作 speller 的 alphabet，而不是用數字 2-9。
#
#      ABC → A      JKL → J      PQRS → P
#      DEF → D      MNO → M      TUV  → T
#      GHI → G                   WXYZ → W
#
#  用字母而非數字的好處：方案的 alphabet 不必含 0-9，數字鍵因此不會被
#  speller 吃掉（社群的 rime-ice / 萬象 T9 方案都得另外用 key_binder 把
#  數字輸出救回來，這裡不必）。
#
#  驗證用例：「你好」= ni + hao
#      ni  → n(MNO)=M, i(GHI)=G          → M G
#      hao → h(GHI)=G, a(ABC)=A, o(MNO)=M → G A M
#      完整按鍵序列：M G G A M（五鍵）
#
#  ── 這份佈局需要什麼才會動 ─────────────────────────────────────────────
#
#  對應方案 `t9_pinyin`（core/data/schemas/t9_pinyin.schema.yaml，共用
#  luna_pinyin 詞典、只多編一份 prism）。其 speller 契約為：
#    speller/alphabet: 'ADGJMPTW'（上表的八個代表字母）
#    speller/algebra:  把詞典音節逐字母 xlit 成代表字母，
#                      外加 `abbrev/^([a-z]).+$/$1/` 超級簡拼（九宮格天然模糊，
#                      靠簡拼補召回）
#    translator/prism: 另取名，避免與全拼方案的 prism 撞檔
#  核心層已實測：MGGAM → 「你好」為第一候選（preedit "MG GAM"）。
#  數字鍵不會被 speller 吃掉（送 2 回報未消費，透傳給宿主）——
#  這正是選字母而非數字 2-9 的理由。
#
#  規範：docs/theme-format.md §9
# ─────────────────────────────────────────────────────────────────────────────

format: rime-layout/1
id: t9-pinyin
revision: 1

name:
  en: "Pinyin 9-key"
  zh-Hant: "九宮格拼音"
  zh-Hans: "九宫格拼音"

description:
  zh-Hant: "4x4 九宮格（已由 5 欄的 cn-t9-pinyin 取代）。鍵面印 ABC、送出 keysym A。"

kind: grid
targets: [android, ios]
# §9.1.1：資格仍在（speller 契約與 cn-t9-pinyin 相同，兩者可互換），
# 但自動命中讓給 cn-t9-pinyin —— 5 欄那份才是華語慣例。
for_schema: ["t9_pinyin"]
auto_for_schema: []
direction: ltr
default_layer: t9
primary: false

author: "rime-quad"
license: "CC0-1.0"

metrics:
  row_spacing: null
  key_spacing: null
  height_scale: 1.0

layers:

  - id: t9
    label: "九宮格"
    units: 4
    rows:

      - weight: 1.0
        keys:
          # 「1」鍵在 T9 方案裡通常被 key_binder 綁成分詞符（apostrophe）。
          # 前端老實送 keysym "1"，要不要當分詞符由方案決定 —— 同 §9.4 的原則。
          - id: "k1"
            label: "'"
            hint: "1"
            send: { keysym: "1" }
            popup:
              layout: grid
              columns: 3
              keys:
                - { label: "，", send: { keysym: "comma" } }
                - { label: "。", send: { keysym: "period" } }
                - { label: "？", send: { keysym: "question" } }
                - { label: "！", send: { keysym: "exclam" } }
                - { label: "、", send: { text: "、" } }
                - { label: "…", send: { text: "…" } }
          - { id: "k2", label: "ABC",  hint: "2", send: { keysym: "A" } }
          - { id: "k3", label: "DEF",  hint: "3", send: { keysym: "D" } }
          - id: "backspace"
            icon: backspace
            style: modifier
            send: { keysym: "BackSpace" }
            repeat: true
            swipe:
              left: { tap: "clear" }

      - weight: 1.0
        keys:
          - { id: "k4", label: "GHI",  hint: "4", send: { keysym: "G" } }
          - { id: "k5", label: "JKL",  hint: "5", send: { keysym: "J" } }
          - { id: "k6", label: "MNO",  hint: "6", send: { keysym: "M" } }
          - id: "to_symbols"
            label: "符"
            style: modifier
            tap: "switch_layout:numeric-symbol"

      - weight: 1.0
        keys:
          - { id: "k7", label: "PQRS", hint: "7", send: { keysym: "P" } }
          - { id: "k8", label: "TUV",  hint: "8", send: { keysym: "T" } }
          - { id: "k9", label: "WXYZ", hint: "9", send: { keysym: "W" } }
          - id: "lang"
            label_from: input_mode
            style: modifier
            tap: "toggle:ascii_mode"
            long_press: "schema:picker"

      - weight: 1.0
        keys:
          - id: "to_alpha"
            label: "ABC"
            style: modifier
            tap: "layer:en"
          - id: "space"
            icon: space
            style: space
            width: 2.0
            label_from: schema_name
            send: { keysym: "space" }
            swipe:
              left: { tap: "cursor:left" }
              right: { tap: "cursor:right" }
            long_press: "schema:next"
          - id: "enter"
            icon: enter
            style: action
            send: { keysym: "Return" }

  # ── 英數層（en / en_upper）─────────────────────────────────────────────
  #
  #  為什麼英數層要**放在本檔裡**，而不是 `switch_layout:@primary` 跳到 qwerty：
  #
  #  跳過去是單程票。qwerty 是 primary，它的鍵面上沒有、也不該有一顆
  #  「回九宮格」的鍵 —— 對絕大多數使用者來說 qwerty 就是家，那顆鍵沒有意義。
  #  於是九宮格使用者一按 ABC 就再也回不來（真機回報的正是這個）。
  #  層切換（`layer:`）永遠在同一份佈局檔內，回程鍵指向的層必然存在，
  #  **結構上不可能**走進死路。這是本格式對「進得去出不來」的解法。
  #
  #  排列與 qwerty 同款，好讓肌肉記憶通用；差別只在左下角那顆回程鍵。

  - id: en
    label: "abc"
    units: 10
    rows:

      - weight: 1.0
        keys:
          - { id: "q", label: "q", hint: "1", send: { keysym: "q" }, swipe: { up: { send: { keysym: "1" } } } }
          - { id: "w", label: "w", hint: "2", send: { keysym: "w" }, swipe: { up: { send: { keysym: "2" } } } }
          - { id: "e", label: "e", hint: "3", send: { keysym: "e" }, swipe: { up: { send: { keysym: "3" } } } }
          - { id: "r", label: "r", hint: "4", send: { keysym: "r" }, swipe: { up: { send: { keysym: "4" } } } }
          - { id: "t", label: "t", hint: "5", send: { keysym: "t" }, swipe: { up: { send: { keysym: "5" } } } }
          - { id: "y", label: "y", hint: "6", send: { keysym: "y" }, swipe: { up: { send: { keysym: "6" } } } }
          - { id: "u", label: "u", hint: "7", send: { keysym: "u" }, swipe: { up: { send: { keysym: "7" } } } }
          - { id: "i", label: "i", hint: "8", send: { keysym: "i" }, swipe: { up: { send: { keysym: "8" } } } }
          - { id: "o", label: "o", hint: "9", send: { keysym: "o" }, swipe: { up: { send: { keysym: "9" } } } }
          - { id: "p", label: "p", hint: "0", send: { keysym: "p" }, swipe: { up: { send: { keysym: "0" } } } }

      - weight: 1.0
        keys:
          - { spacer: true, width: 0.5 }
          - { id: "a", label: "a", send: { keysym: "a" } }
          - { id: "s", label: "s", send: { keysym: "s" } }
          - { id: "d", label: "d", send: { keysym: "d" } }
          - { id: "f", label: "f", send: { keysym: "f" } }
          - { id: "g", label: "g", send: { keysym: "g" } }
          - { id: "h", label: "h", send: { keysym: "h" } }
          - { id: "j", label: "j", send: { keysym: "j" } }
          - { id: "k", label: "k", send: { keysym: "k" } }
          - { id: "l", label: "l", send: { keysym: "l" } }
          - { spacer: true, width: 0.5 }

      - weight: 1.0
        keys:
          - id: "shift"
            icon: shift
            style: modifier
            width: 1.5
            tap: "layer_once:en_upper"
            double_tap: "layer_lock:en_upper"
          - { id: "z", label: "z", send: { keysym: "z" } }
          - { id: "x", label: "x", send: { keysym: "x" } }
          - { id: "c", label: "c", send: { keysym: "c" } }
          - { id: "v", label: "v", send: { keysym: "v" } }
          - { id: "b", label: "b", send: { keysym: "b" } }
          - { id: "n", label: "n", send: { keysym: "n" } }
          - { id: "m", label: "m", send: { keysym: "m" } }
          - id: "backspace"
            icon: backspace
            style: modifier
            width: 1.5
            send: { keysym: "BackSpace" }
            repeat: true
            swipe:
              left: { tap: "clear" }

      - weight: 1.0
        keys:
          # 回程鍵。與 t9 層左下角那顆 ABC 位置相同、大小相同 —— 同一個位置
          # 進、同一個位置出，這是這類切換唯一不會被使用者弄丟的擺法。
          - id: "to_t9"
            label: "九宮"
            style: modifier
            width: 1.5
            tap: "layer:t9"
          - id: "lang"
            label_from: input_mode
            style: modifier
            width: 1.25
            tap: "toggle:ascii_mode"
            long_press: "schema:picker"
          - id: "space"
            icon: space
            style: space
            width: 4.5
            send: { keysym: "space" }
            swipe:
              left:  { tap: "cursor:left" }
              right: { tap: "cursor:right" }
          - id: "period"
            label: "."
            width: 1.25
            send: { keysym: "period" }
            popup:
              layout: row
              keys:
                - { label: ",", send: { keysym: "comma" } }
                - { label: "?", send: { keysym: "question" } }
                - { label: "!", send: { keysym: "exclam" } }
                - { label: "@", send: { keysym: "at" } }
          - id: "enter"
            icon: enter
            style: action
            width: 1.5
            send: { keysym: "Return" }

  - id: en_upper
    label: "ABC"
    units: 10
    rows:

      - weight: 1.0
        keys:
          - { id: "q", label: "Q", hint: "1", send: { keysym: "Q", modifiers: [Shift] } }
          - { id: "w", label: "W", hint: "2", send: { keysym: "W", modifiers: [Shift] } }
          - { id: "e", label: "E", hint: "3", send: { keysym: "E", modifiers: [Shift] } }
          - { id: "r", label: "R", hint: "4", send: { keysym: "R", modifiers: [Shift] } }
          - { id: "t", label: "T", hint: "5", send: { keysym: "T", modifiers: [Shift] } }
          - { id: "y", label: "Y", hint: "6", send: { keysym: "Y", modifiers: [Shift] } }
          - { id: "u", label: "U", hint: "7", send: { keysym: "U", modifiers: [Shift] } }
          - { id: "i", label: "I", hint: "8", send: { keysym: "I", modifiers: [Shift] } }
          - { id: "o", label: "O", hint: "9", send: { keysym: "O", modifiers: [Shift] } }
          - { id: "p", label: "P", hint: "0", send: { keysym: "P", modifiers: [Shift] } }

      - weight: 1.0
        keys:
          - { spacer: true, width: 0.5 }
          - { id: "a", label: "A", send: { keysym: "A", modifiers: [Shift] } }
          - { id: "s", label: "S", send: { keysym: "S", modifiers: [Shift] } }
          - { id: "d", label: "D", send: { keysym: "D", modifiers: [Shift] } }
          - { id: "f", label: "F", send: { keysym: "F", modifiers: [Shift] } }
          - { id: "g", label: "G", send: { keysym: "G", modifiers: [Shift] } }
          - { id: "h", label: "H", send: { keysym: "H", modifiers: [Shift] } }
          - { id: "j", label: "J", send: { keysym: "J", modifiers: [Shift] } }
          - { id: "k", label: "K", send: { keysym: "K", modifiers: [Shift] } }
          - { id: "l", label: "L", send: { keysym: "L", modifiers: [Shift] } }
          - { spacer: true, width: 0.5 }

      - weight: 1.0
        keys:
          - id: "shift"
            icon: shift
            style: modifier
            width: 1.5
            active: true
            tap: "layer:en"
            double_tap: "layer_lock:en_upper"
          - { id: "z", label: "Z", send: { keysym: "Z", modifiers: [Shift] } }
          - { id: "x", label: "X", send: { keysym: "X", modifiers: [Shift] } }
          - { id: "c", label: "C", send: { keysym: "C", modifiers: [Shift] } }
          - { id: "v", label: "V", send: { keysym: "V", modifiers: [Shift] } }
          - { id: "b", label: "B", send: { keysym: "B", modifiers: [Shift] } }
          - { id: "n", label: "N", send: { keysym: "N", modifiers: [Shift] } }
          - { id: "m", label: "M", send: { keysym: "M", modifiers: [Shift] } }
          - id: "backspace"
            icon: backspace
            style: modifier
            width: 1.5
            send: { keysym: "BackSpace" }
            repeat: true
            swipe:
              left: { tap: "clear" }

      - weight: 1.0
        keys:
          - id: "to_t9"
            label: "九宮"
            style: modifier
            width: 1.5
            tap: "layer:t9"
          - id: "lang"
            label_from: input_mode
            style: modifier
            width: 1.25
            tap: "toggle:ascii_mode"
            long_press: "schema:picker"
          - id: "space"
            icon: space
            style: space
            width: 4.5
            send: { keysym: "space" }
          - { id: "period", label: ".", width: 1.25, send: { keysym: "period" } }
          - id: "enter"
            icon: enter
            style: action
            width: 1.5
            send: { keysym: "Return" }
