# ─────────────────────────────────────────────────────────────────────────────
#  cn-t9-pinyin — 九宮格拼音（華語慣例版，5 欄 × 4 列）
#
#  ── 它模仿的是什麼慣例 ───────────────────────────────────────────────────
#
#  依據使用者本人的 Galaxy S24U 實機照片（docs/reference/samsung/photo_1）
#  重建，並與語燕輸入法（YuyanIme，BSD-3）的 t9_pinyin 截圖、搜狗／百度／
#  訊飛的公開骨架交叉比對。四者的結構一致：
#
#      ┌──────┬───────┬───────┬───────┬──────┐
#      │  ，  │ 分詞¹ │ abc²  │ def³  │  ⌫  │
#      ├──────┼───────┼───────┼───────┼──────┤
#      │  。  │ ghi⁴  │ jkl⁵  │ mno⁶  │ 重輸 │
#      ├──────┼───────┼───────┼───────┼──────┤
#      │  ？  │ pqrs⁷ │ tuv⁸  │ wxyz⁹ │  0   │
#      ├──────┼───────┼───────┼───────┼──────┤
#      │ !@#  │ 中/英 │  ␣    │  123  │  ⏎  │
#      └──────┴───────┴───────┴───────┴──────┘
#
#  **這是 5 欄 × 4 列，不是 4 × 4。** 這一點是華語九宮格與西方 T9 最大的
#  外觀差異，也是使用者一眼認出「這是中文輸入法」的依據：
#
#  * **最左整欄是標點**（，。？ + 符號層入口）。中文標點的使用密度遠高於
#    英文，且中文沒有「打完單字按空白」的節奏，標點不該藏在 ?123 層裡。
#  * **最右整欄是功能鍵**（⌫、重輸、0、⏎）。
#  * **中間 3×3 才是 T9 字母**，而且左上角是「分詞」不是「1」。
#  * **數字以右上角上標（hint）呈現**，1–9 對應九宮格位置；`0` 因為沒有
#    對應的字母組，被放進右欄自成一鍵。這正是規範 §9.4 label / hint / send
#    三欄位分離的用途：鍵面主字是 `abc`、角標是 `2`、送出的卻是 keysym `A`。
#  * **字母是小寫**（abc / def / ghi），不是大寫。三星、搜狗、微信鍵盤皆然。
#
#  ── 「分詞」與「重輸」對應到什麼？（不是 ABI 缺口，兩者都已有對應）─────
#
#  * **分詞** = 手動切分音節。RIME 的音節分隔符由方案的 `speller/delimiter`
#    定義，`t9_pinyin.schema.yaml` 是 `" '"`，所以這顆鍵送
#    `send: { keysym: "apostrophe" }` 即可，**不需要新的 action verb**。
#    例：「西安」在九宮格是 W G ＋ A M，中間不分詞會被理解成 xian（先）。
#  * **重輸** = 清空目前整串輸入碼重來。對應 §9.5 既有的 `tap: "clear"`
#    （門面層的 `rs_clear_composition`）。**也不需要新 verb。**
#    九宮格一顆鍵代表 3–4 個字母，打錯時整串重打比逐鍵退格快得多，
#    所以華語輸入法一律有這顆鍵，而西方鍵盤沒有。
#
#  ── 和現有 `t9-pinyin.yaml` 的差別 ───────────────────────────────────────
#
#  | | t9-pinyin（現有） | cn-t9-pinyin（本檔） |
#  |---|---|---|
#  | 結構 | 4 欄 × 4 列 | **5 欄 × 4 列**（+ 左標點欄、+ 右功能欄） |
#  | 分詞 | 無此概念；「1」鍵送 keysym "1"，靠方案的 key_binder 兜 | **獨立鍵，直接送 apostrophe**（方案的 delimiter） |
#  | 重輸 | 無；只有退格左滑（swipe 是 OPTIONAL 能力，可能未實作） | **常駐鍵**，`tap: "clear"`，不依賴 swipe |
#  | 標點 | 全部藏在「'」的長按盤裡 | **，。？三顆常駐鍵**，各自另有長按盤 |
#  | 0 | 打不出來 | **獨立鍵**（右欄第三格），與實機一致 |
#  | 數字 | hint 印了 2–9 但按不出數字 | 1–9 為 hint（維持 T9 語義）＋ **`num` 層是真的數字盤** |
#  | 字母 | 大寫 ABC | **小寫 abc**（與三星／搜狗／微信一致） |
#  | 符號 | 「符」→ numeric-symbol（10 欄西式符號表） | **「!@#」→ cn-symbols**（7 欄、中英分頁、可翻頁） |
#
#  送出的 keysym 與方案 `t9_pinyin` 的 speller 契約完全相同
#  （abc→A、def→D、ghi→G、jkl→J、mno→M、pqrs→P、tuv→T、wxyz→W），
#  所以本檔與 t9-pinyin.yaml 可以互換，**不需要改方案**。
#
#  ── 佈版數字的由來 ───────────────────────────────────────────────────────
#
#  `units: 10`（不是 5，也不是 23）。單純是為了讓 1.7 / 2.2 這組欄寬有整齊的
#  整數刻度：1.7 + 2.2×3 + 1.7 = 10.0。**units 不再影響鍵高** ——
#  §8.8.0 改成「固定高度預算 ÷ Σweight」之後，鍵高只看主題的參考格
#  （`reference_grid`，預設 10 欄 4 列）與裝置寬度，與本層的 units 無關。
#  舊模型下 units 一大鍵高就崩到下界（units=23 時鍵高 17.8 dp），
#  那個陷阱已經不存在，但 10 這個值仍然最好讀，所以留著。
#
#  S24U（456.2 dp 寬）＋ cn-compact-* 主題（key_spacing 8、key_height 54–56）：
#      預算 = 54 × 4 + 12 × 3 + 8 = 260 dp（與 QWERTY、與加不加數字列都相同）
#      本層 4 列 × weight 1.0 → 列高 = (260 − 8 − 36) / 4 = **54 dp**
#      單位寬 = (456.2 − 10 − 8×4) / 10 = 41.4 dp
#      → 中欄鍵 2.2 × 41.4 = 91.1 dp、側欄鍵 1.7 × 41.4 = 70.4 dp
#      → 平均鍵寬 82.8 dp，長寬比 82.8 / 54 = **1.53**
#  實機九宮格鍵高 54.4 dp、長寬比 1.53 —— 逐項對上。
#
#  欄寬 1.7 / 2.2 量自實機照片：側欄 67.7 dp、中欄 88.5 dp（比值 0.765）。
#  **四列全部使用同一組欄寬**，所以整個鍵盤是對齊的方格 —— 實機亦然。
#
#  ── 鍵的顏色代表什麼（`style` 的取用規則）─────────────────────────────────
#
#  使用者問過：「分詞的顏色不一樣，這又是為啥？是故意的還是 bug？」
#  ——**是順手，不是故意**。`分詞` 原本寫成 `style: modifier`（灰），與 ⌫／重輸／
#  `123` 同一組，而三星實機上它與字母鍵**同色**。現在改回 `default`（白）。
#
#  這一份採用的規則，寫在這裡是為了下一個人不必再問一次：
#
#    · **白（`default`）＝ 這顆鍵送出的東西會進入組字或文字流。**
#      字母鍵、以及 `分詞` —— 它送的是方案的音節分隔符（`speller/delimiter`），
#      「西安 = W G ＋ 分詞 ＋ A M」裡的那一下，和按 `abc` 是同一種動作，
#      **是打字的一部分**。染成功能鍵的灰色會讓人以為它是某種開關。
#    · **灰（`modifier`）＝ 這顆鍵作用在鍵盤或組字狀態本身。**
#      ⌫、重輸、`!@#`、`123`、`中／En`。
#    · **強調色（`action`）＝ 送出、換行。** 只有 ⏎。
#
#  兩個**刻意的例外**，理由是版面而不是語義：
#
#    · **左邊整條標點欄（，。？）維持灰。** 它們在中間 3×3 的**外面**，
#      灰色是那道欄界；把它們染白，五欄會讀成「4 欄 T9 + 一條漂浮的右欄」。
#      `分詞` 的情形正好相反 —— 它就**坐在 3×3 裡面**（見上面的示意圖），
#      灰色是在字母方塊中間挖一個洞，那正是使用者一眼看出不對勁的原因。
#    · **右欄的 `0` 維持灰。** 同理：它是右功能欄的一格，白色會讓那一欄變成
#      灰灰白＋強調色。若哪天要照語義一致到底，`0` 與標點欄要一起改，
#      而那是版面的重新取捨，不是這次要回答的問題。
#
#  ── 組字中的左欄：拼音消歧欄 ─────────────────────────────────────────────
#
#  一開始打字，左欄的 **，。？** 三格會換成**這串按鍵可能是哪些音節**
#  （例如 `MG` → `ni` / `mi`），點一下就只留那個讀音的候選。九宮格一顆鍵代表
#  三四個字母，不消歧就只能靠猜 —— 這是 `docs/competitive-review.md` §3.3 與
#  P1-1 記錄的、語燕與三星都有的互動。
#
#  · **為什麼蓋掉標點：** 兩者從不同時被需要。標點是「詞打完了」才用得上，
#    而那個時刻沒有在組字；消歧只在組字中存在。它們共用同三格，因此
#    **不佔任何額外高度** —— 多一列會撞上 §8.8.0「鍵盤總高固定」。
#  · **只吃前三格，底列的 `!@#` 不動。** 那是一顆導覽鍵（`switch_layout`），
#    而 LayoutEscape 的死路檢查走的是**佈局檔的靜態內容**，看不見執行期替換；
#    在底列動手等於在那張圖上開一個測不到的洞。這與鍵盤內面板
#    「底列全程露在外面」是同一條規矩。
#  · 讀音只有一個時**不換**：那一格點下去什麼都不會發生，而「看得到摸不到」
#    是這個專案抓過六次的缺陷形狀。
#
#  ⚠ 哪幾格被接管，目前宣告在 Android 端的 `keyboard/T9Syllables.kt`，
#    **本該是這裡的一個欄位**（例如 layer 上的 `syllable_slots:`）。
#    佈局格式（docs/theme-format.md §9）與它的解析器不屬於九宮格這條支線，
#    照 docs/coordination.md §2 只能回報，已寫進 §5。
#
#  ── 進得去也出得來 ───────────────────────────────────────────────────────
#
#  本佈局的每一個離開路徑（規範沒有「佈局選單」，所以必須自帶）：
#    · 「!@#」        → cn-symbols（其底列的「中文」再走 @previous 回來）
#    · 「123」        → 本檔 `num` 層（其「返回」鍵回到 `t9` 層）
#    · 長按「123」    → cn-t9-pinyin-numrow（數字行版本）
#    · 長按「␣」      → switch_layout:@primary（回到主要英數佈局）
#    · 長按「中/英」  → schema:picker
#    · 候選列工具列   → globe / 九鍵 / 全鍵（見 cn-compact-* 主題）
#
#  規範：docs/theme-format.md §9
# ─────────────────────────────────────────────────────────────────────────────

format: rime-layout/1
id: cn-t9-pinyin
revision: 1

name:
  en: "Pinyin 9-key (CN)"
  zh-Hant: "九宮格拼音"
  zh-Hans: "九宫格拼音"

description:
  zh-Hant: "5 欄 × 4 列九宮格：左標點欄、右功能欄、分詞鍵、重輸鍵、獨立 0 鍵。依三星 S24U 實機重建。"
  zh-Hans: "5 列 × 4 行九宫格：左标点列、右功能列、分词键、重输键、独立 0 键。依三星 S24U 实机重建。"

author: "rime-quad"
license: "CC0-1.0"

kind: grid
targets: [android, ios]
# §9.1.1：資格與自動命中。這份是 t9_pinyin 的**預設**九宮格 ——
# 使用者切到 t9_pinyin 而沒有另外指定時，看到的就是這一份（5 欄版）。
# 舊的 4 欄 `t9-pinyin.yaml` 仍可手動選，但已交出自動命中。
for_schema: ["t9_pinyin"]
auto_for_schema: ["t9_pinyin"]
direction: ltr
default_layer: t9
# 「中／En」進英文模式時換上的層（見 en 層的檔頭）。
alpha_layer: en
primary: false

metrics:
  row_spacing: null
  key_spacing: null
  height_scale: 1.0

layers:

  # ── 九宮格主層 ───────────────────────────────────────────────────────────
  - id: "t9"
    # 拼音消歧欄借用左邊那一直欄(§8.6.6.3 的 keyboard_slot)。
    # 只吃前三格,底列那一格不動:!@# 是 switch_layout 導覽鍵,
    # 而 LayoutEscape 走佈局檔的靜態內容、看不見執行期替換。
    syllable_slots: ["pu_comma", "pu_period", "pu_question"]
    label: "九宮格"
    units: 10
    rows:

      - weight: 1.0
        keys:
          # 左標點欄。走 send.keysym 而非 send.text —— 讓 librime 的 punctuator
          # 依 ascii_punct 開關自己決定要吐「，」還是「,」（§9.4 形態 B 的警告）。
          # 符號**面板**的情形不同，見 cn-symbols.yaml 檔頭。
          - id: "pu_comma"
            label: "，"
            width: 1.7
            style: modifier
            send: { keysym: "comma" }
            popup:
              layout: row
              keys:
                - { label: "、", send: { text: "、" } }
                - { label: "；", send: { keysym: "semicolon" } }
                - { label: "：", send: { keysym: "colon" } }
          # 分詞：方案的 delimiter（t9_pinyin 為 " '"）。實機在這個位置印的是
          # 「分词」而不是「1」，hint 才是 1 —— label / hint / send 三者分離。
          #
          # ⚠ **沒有 `style`（＝ default，白色），這是刻意的。** 它送的是音節
          # 分隔符，屬於「打字」而不是「操作鍵盤」；而且它就坐在中間 3×3 裡面，
          # 灰色等於在字母方塊中間挖一個洞。完整規則見檔頭「鍵的顏色代表什麼」。
          - id: "delim"
            label: "分詞"
            hint: "1"
            width: 2.2
            send: { keysym: "apostrophe" }
          - { id: "k_abc",  label: "abc",  hint: "2", width: 2.2, send: { keysym: "A" } }
          - { id: "k_def",  label: "def",  hint: "3", width: 2.2, send: { keysym: "D" } }
          - id: "backspace"
            icon: backspace
            width: 1.7
            style: modifier
            send: { keysym: "BackSpace" }
            repeat: true

      - weight: 1.0
        keys:
          - id: "pu_period"
            label: "。"
            width: 1.7
            style: modifier
            send: { keysym: "period" }
            popup:
              layout: row
              keys:
                - { label: "…", send: { text: "…" } }
                - { label: "—", send: { text: "—" } }
                - { label: "～", send: { text: "～" } }
          - { id: "k_ghi", label: "ghi", hint: "4", width: 2.2, send: { keysym: "G" } }
          - { id: "k_jkl", label: "jkl", hint: "5", width: 2.2, send: { keysym: "J" } }
          - { id: "k_mno", label: "mno", hint: "6", width: 2.2, send: { keysym: "M" } }
          # 重輸 = rs_clear_composition（§9.5 的 `clear`）。不依賴 swipe，
          # 因為 swipe 是 OPTIONAL 能力，不能是唯一觸達路徑（§9.6）。
          - id: "clear"
            label: "重輸"
            width: 1.7
            style: modifier
            tap: "clear"

      - weight: 1.0
        keys:
          - id: "pu_question"
            label: "？"
            width: 1.7
            style: modifier
            send: { keysym: "question" }
            popup:
              layout: row
              keys:
                - { label: "！", send: { keysym: "exclam" } }
                - { label: "·", send: { text: "·" } }
                - { label: "…", send: { text: "…" } }
          - { id: "k_pqrs", label: "pqrs", hint: "7", width: 2.2, send: { keysym: "P" } }
          - { id: "k_tuv",  label: "tuv",  hint: "8", width: 2.2, send: { keysym: "T" } }
          - { id: "k_wxyz", label: "wxyz", hint: "9", width: 2.2, send: { keysym: "W" } }
          # 「0」沒有對應的字母組（T9 的 0 歷來是空白／符號），所以自成一鍵，
          # 放在右欄第三格。實機如此。speller/alphabet 不含 0-9，
          # 所以這一鍵不會被 speller 吃掉，會原樣透傳給宿主。
          - { id: "d0", label: "0", width: 1.7, style: modifier, send: { keysym: "0" } }

      - weight: 1.0
        keys:
          - id: "to_symbols"
            label: "!@#"
            width: 1.7
            style: modifier
            tap: "switch_layout:cn-symbols"
          - id: "lang"
            label_from: input_mode_pair
            label: "中/En"
            width: 2.2
            style: modifier
            tap: "input_mode:toggle"
            long_press: "schema:picker"
          - id: "space"
            icon: space
            style: space
            width: 2.2
            label_from: schema_name
            send: { keysym: "space" }
            swipe:
              left:  { tap: "cursor:left" }
              right: { tap: "cursor:right" }
            # 離開本佈局的主要出口。規範沒有「佈局選單」UI，所以每一份佈局
            # 都必須自帶一顆回得去主要英數佈局的鍵，否則使用者會被鎖死。
            long_press: "switch_layout:@primary"
          - id: "to_num"
            label: "123"
            width: 2.2
            style: modifier
            tap: "layer:num"
            long_press: "switch_layout:cn-t9-pinyin-numrow"
          - id: "enter"
            icon: enter
            style: action
            width: 1.7
            send: { keysym: "Return" }

  # ── 數字層（由「123」進入，「返回」離開）─────────────────────────────────
  #
  #  華語輸入法的「123」開的是**電話式九宮數字盤**（1-2-3 在上排），不是
  #  西方鍵盤那條 1234567890 的橫列。左欄放運算符，右欄放 ⌫ / . / @
  #  ——「.」與「@」在此是為了打小數與 email，搜狗／百度／語燕排法一致。
  #  欄寬與 `t9` 層完全相同，切換時鍵盤不會跳動。
  - id: "num"
    label: "123"
    units: 10
    rows:

      - weight: 1.0
        keys:
          - { id: "op_percent", label: "%", width: 1.7, style: modifier, send: { keysym: "percent" } }
          - { id: "d1", label: "1", width: 2.2, send: { keysym: "1" } }
          - { id: "d2", label: "2", width: 2.2, send: { keysym: "2" } }
          - { id: "d3", label: "3", width: 2.2, send: { keysym: "3" } }
          - id: "backspace"
            icon: backspace
            width: 1.7
            style: modifier
            send: { keysym: "BackSpace" }
            repeat: true

      - weight: 1.0
        keys:
          - { id: "op_slash", label: "/", width: 1.7, style: modifier, send: { keysym: "slash" } }
          - { id: "d4", label: "4", width: 2.2, send: { keysym: "4" } }
          - { id: "d5", label: "5", width: 2.2, send: { keysym: "5" } }
          - { id: "d6", label: "6", width: 2.2, send: { keysym: "6" } }
          - { id: "dot", label: ".", width: 1.7, style: modifier, send: { keysym: "period" } }

      - weight: 1.0
        keys:
          - id: "op_minus"
            label: "-"
            width: 1.7
            style: modifier
            send: { keysym: "minus" }
            popup:
              layout: row
              keys:
                - { label: "+", send: { keysym: "plus" } }
                - { label: "*", send: { keysym: "asterisk" } }
                - { label: "=", send: { keysym: "equal" } }
                - { label: "#", send: { keysym: "numbersign" } }
          - { id: "d7", label: "7", width: 2.2, send: { keysym: "7" } }
          - { id: "d8", label: "8", width: 2.2, send: { keysym: "8" } }
          - { id: "d9", label: "9", width: 2.2, send: { keysym: "9" } }
          - { id: "at", label: "@", width: 1.7, style: modifier, send: { keysym: "at" } }

      - weight: 1.0
        keys:
          - id: "to_symbols"
            label: "!@#"
            width: 1.7
            style: modifier
            tap: "switch_layout:cn-symbols"
          # 本層的出口。缺了它使用者只能靠「!@#」繞路離開。
          - id: "back"
            label: "返回"
            width: 2.2
            style: modifier
            tap: "layer:t9"
          - id: "space"
            icon: space
            style: space
            width: 2.2
            send: { keysym: "space" }
            long_press: "switch_layout:@primary"
          - { id: "d0", label: "0", width: 2.2, send: { keysym: "0" } }
          - id: "enter"
            icon: enter
            style: action
            width: 1.7
            send: { keysym: "Return" }

  # ── 英數層（alpha_layer）────────────────────────────────────
  #
  #  這一層是本佈局的 `alpha_layer`：「中／En」鍵進英文模式時自動換上。
  #
  #  為什麼非得在本檔裡不可，而不是 `switch_layout:@primary` 跳到 qwerty：
  #  跳過去是單程票。qwerty 是 primary，它的鍵面上沒有、也不該有一顆
  #  「回九宮格」的鍵。層切換永遠在同一份佈局檔內，回程**結構上**存在：
  #  切回中文一定落在 `default_layer`，不靠這一層自己記得放一顆回程鍵。
  #
  #  排列與 qwerty 同款，好讓肌肉記憶通用；底列與主層對齊，
  #  「中／En」永遠在同一格 —— 同一個位置進、同一個位置出。
  - id: "en"
    label: "abc"
    units: 10
    rows:

      - weight: 1.0
        keys:
          - { id: "e_q", label: "q", hint: "1", send: { keysym: "q" } }
          - { id: "e_w", label: "w", hint: "2", send: { keysym: "w" } }
          - { id: "e_e", label: "e", hint: "3", send: { keysym: "e" } }
          - { id: "e_r", label: "r", hint: "4", send: { keysym: "r" } }
          - { id: "e_t", label: "t", hint: "5", send: { keysym: "t" } }
          - { id: "e_y", label: "y", hint: "6", send: { keysym: "y" } }
          - { id: "e_u", label: "u", hint: "7", send: { keysym: "u" } }
          - { id: "e_i", label: "i", hint: "8", send: { keysym: "i" } }
          - { id: "e_o", label: "o", hint: "9", send: { keysym: "o" } }
          - { id: "e_p", label: "p", hint: "0", send: { keysym: "p" } }

      - weight: 1.0
        keys:
          - { spacer: true, width: 0.5 }
          - { id: "e_a", label: "a", send: { keysym: "a" } }
          - { id: "e_s", label: "s", send: { keysym: "s" } }
          - { id: "e_d", label: "d", send: { keysym: "d" } }
          - { id: "e_f", label: "f", send: { keysym: "f" } }
          - { id: "e_g", label: "g", send: { keysym: "g" } }
          - { id: "e_h", label: "h", send: { keysym: "h" } }
          - { id: "e_j", label: "j", send: { keysym: "j" } }
          - { id: "e_k", label: "k", send: { keysym: "k" } }
          - { id: "e_l", label: "l", send: { keysym: "l" } }
          - { spacer: true, width: 0.5 }

      - weight: 1.0
        keys:
          - id: "shift"
            icon: shift
            style: modifier
            width: 1.5
            tap: "layer_once:en_upper"
            double_tap: "layer_lock:en_upper"
          - { id: "e_z", label: "z", send: { keysym: "z" } }
          - { id: "e_x", label: "x", send: { keysym: "x" } }
          - { id: "e_c", label: "c", send: { keysym: "c" } }
          - { id: "e_v", label: "v", send: { keysym: "v" } }
          - { id: "e_b", label: "b", send: { keysym: "b" } }
          - { id: "e_n", label: "n", send: { keysym: "n" } }
          - { id: "e_m", label: "m", send: { keysym: "m" } }
          - id: "backspace"
            icon: backspace
            style: modifier
            width: 1.5
            send: { keysym: "BackSpace" }
            repeat: true
            swipe:
              left: { tap: "clear" }

      # 底列與主層對齊：「中／En」永遠在左起第二格 —— 同一個位置進、
      # 同一個位置出，這是這類切換唯一不會被使用者弄丟的擺法。
      - weight: 1.0
        keys:
          - id: "to_symbols"
            label: "!@#"
            width: 1.7
            style: modifier
            tap: "switch_layout:cn-symbols"
          - id: "lang"
            label_from: input_mode_pair
            label: "中/En"
            width: 2.2
            style: modifier
            tap: "input_mode:toggle"
            long_press: "schema:picker"
          - id: "space"
            icon: space
            style: space
            width: 2.2
            send: { keysym: "space" }
            swipe:
              left:  { tap: "cursor:left" }
              right: { tap: "cursor:right" }
            long_press: "switch_layout:@primary"
          - id: "period"
            label: "."
            width: 2.2
            send: { keysym: "period" }
            popup:
              layout: row
              keys:
                - { label: ",", send: { keysym: "comma" } }
                - { label: "?", send: { keysym: "question" } }
                - { label: "!", send: { keysym: "exclam" } }
                - { label: "@", send: { keysym: "at" } }
          - id: "enter"
            icon: enter
            style: action
            width: 1.7
            send: { keysym: "Return" }

  - id: "en_upper"
    label: "ABC"
    units: 10
    rows:

      - weight: 1.0
        keys:
          - { id: "e_q", label: "Q", hint: "1", send: { keysym: "Q", modifiers: [Shift] } }
          - { id: "e_w", label: "W", hint: "2", send: { keysym: "W", modifiers: [Shift] } }
          - { id: "e_e", label: "E", hint: "3", send: { keysym: "E", modifiers: [Shift] } }
          - { id: "e_r", label: "R", hint: "4", send: { keysym: "R", modifiers: [Shift] } }
          - { id: "e_t", label: "T", hint: "5", send: { keysym: "T", modifiers: [Shift] } }
          - { id: "e_y", label: "Y", hint: "6", send: { keysym: "Y", modifiers: [Shift] } }
          - { id: "e_u", label: "U", hint: "7", send: { keysym: "U", modifiers: [Shift] } }
          - { id: "e_i", label: "I", hint: "8", send: { keysym: "I", modifiers: [Shift] } }
          - { id: "e_o", label: "O", hint: "9", send: { keysym: "O", modifiers: [Shift] } }
          - { id: "e_p", label: "P", hint: "0", send: { keysym: "P", modifiers: [Shift] } }

      - weight: 1.0
        keys:
          - { spacer: true, width: 0.5 }
          - { id: "e_a", label: "A", send: { keysym: "A", modifiers: [Shift] } }
          - { id: "e_s", label: "S", send: { keysym: "S", modifiers: [Shift] } }
          - { id: "e_d", label: "D", send: { keysym: "D", modifiers: [Shift] } }
          - { id: "e_f", label: "F", send: { keysym: "F", modifiers: [Shift] } }
          - { id: "e_g", label: "G", send: { keysym: "G", modifiers: [Shift] } }
          - { id: "e_h", label: "H", send: { keysym: "H", modifiers: [Shift] } }
          - { id: "e_j", label: "J", send: { keysym: "J", modifiers: [Shift] } }
          - { id: "e_k", label: "K", send: { keysym: "K", modifiers: [Shift] } }
          - { id: "e_l", label: "L", send: { keysym: "L", modifiers: [Shift] } }
          - { spacer: true, width: 0.5 }

      - weight: 1.0
        keys:
          - id: "shift"
            icon: shift_lock
            style: modifier
            active: true
            width: 1.5
            tap: "layer:en"
          - { id: "e_z", label: "Z", send: { keysym: "Z", modifiers: [Shift] } }
          - { id: "e_x", label: "X", send: { keysym: "X", modifiers: [Shift] } }
          - { id: "e_c", label: "C", send: { keysym: "C", modifiers: [Shift] } }
          - { id: "e_v", label: "V", send: { keysym: "V", modifiers: [Shift] } }
          - { id: "e_b", label: "B", send: { keysym: "B", modifiers: [Shift] } }
          - { id: "e_n", label: "N", send: { keysym: "N", modifiers: [Shift] } }
          - { id: "e_m", label: "M", send: { keysym: "M", modifiers: [Shift] } }
          - id: "backspace"
            icon: backspace
            style: modifier
            width: 1.5
            send: { keysym: "BackSpace" }
            repeat: true
            swipe:
              left: { tap: "clear" }

      # 底列與主層對齊：「中／En」永遠在左起第二格 —— 同一個位置進、
      # 同一個位置出，這是這類切換唯一不會被使用者弄丟的擺法。
      - weight: 1.0
        keys:
          - id: "to_symbols"
            label: "!@#"
            width: 1.7
            style: modifier
            tap: "switch_layout:cn-symbols"
          - id: "lang"
            label_from: input_mode_pair
            label: "中/En"
            width: 2.2
            style: modifier
            tap: "input_mode:toggle"
            long_press: "schema:picker"
          - id: "space"
            icon: space
            style: space
            width: 2.2
            send: { keysym: "space" }
            swipe:
              left:  { tap: "cursor:left" }
              right: { tap: "cursor:right" }
            long_press: "switch_layout:@primary"
          - id: "period"
            label: "."
            width: 2.2
            send: { keysym: "period" }
            popup:
              layout: row
              keys:
                - { label: ",", send: { keysym: "comma" } }
                - { label: "?", send: { keysym: "question" } }
                - { label: "!", send: { keysym: "exclam" } }
                - { label: "@", send: { keysym: "at" } }
          - id: "enter"
            icon: enter
            style: action
            width: 1.7
            send: { keysym: "Return" }
