# Rime schema
# encoding: utf-8
#
# 九宮格拼音 —— 本專案自行撰寫，非改自任何既有方案。
#
# 為什麼九宮格要是一套 RIME 方案，而不是前端硬湊：
#   Engine::ProcessKey 一次只吃一個 keycode，「ABC」這顆鍵送出去的必須是**單一**
#   keysym。也就是說「一鍵三字母」的模糊性只能由 speller 的 algebra 與 prism 承擔，
#   前端無從介入。前端能做的只有把九顆鍵畫出來、送對 keysym。
#
# 為什麼用字母 A/D/G/J/M/P/T/W 而不是社群慣用的數字 2–9：
#   alphabet 只要含 0-9，數字鍵就會被 speller 吃掉，於是「打數字」這件事得再用
#   key_binder 繞回來（rime-ice、萬象等方案都是這樣繞的）。改用每組的**首字母**
#   當代表，數字鍵完全不進 speller，這個麻煩就不存在。
#
# 詞典共用 luna_pinyin.dict.yaml，不需要新詞庫；只會多編出一份 t9_pinyin.prism.bin。

schema:
  schema_id: t9_pinyin
  name: 九宮格拼音
  version: '1.0'
  author:
    - rime-quad 專案
  description: |
    手機九宮格鍵盤的拼音方案。

    每顆鍵代表三到四個字母，以該組首字母為代表：
      ABC→A  DEF→D  GHI→G  JKL→J  MNO→M  PQRS→P  TUV→T  WXYZ→W

    例：「你好」= ni hao → M G ＋ G A M，共五鍵。

    模糊性全部由 prism 展開，候選字由八股文語言模型排序。
    另支援超級簡拼：每個音節只打第一鍵也能成句。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
    abbrev: [ 中, Ａ ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - options:
      - zh_hant
      - zh_hans
      - zh_hant_hk
      - zh_hant_tw
    states:
      - 傳統漢字
      - 简化字
      - 香港字形
      - 臺灣字形
    abbrev: [ 漢, 简, 港, 臺 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - simplifier@zh_hans
    - simplifier@zh_hant_hk
    - simplifier@zh_hant_tw
    - uniquifier

speller:
  # ⚠ **雙編碼**：小寫拼音與九宮格鍵位**同時**存在於這一個 prism 裡。
  #
  #   為什麼:九宮格的音節消歧(一顆鍵三四個字母,「MG」可能是 ni 也可能是 mi)
  #   在 librime 裡**沒有**「選擇拼寫」的 API —— 上游作者明講過(rime/librime#123):
  #   那是前端的工作,做法是**把輸入串改寫掉**,把已確定的那一段換成精確的拼音,
  #   後面仍然留著模糊碼。改寫之後 prism 必須同時認得兩種形式,否則整串解不開。
  #
  #   這是萬象的 拼音选择器 用的辦法 —— 目前唯一有在出貨的實作。
  #
  # ⚠ 刻意**不**用 rime-ice 那種逐字元 `derive/[abc]/2/` 串接:那會產生
  #   2^n 條拼寫,音節一長就爆掉。這裡是「一條 derive + 一條 xlit」,線性。
  alphabet: 'abcdefghijklmnopqrstuvwxyzADGJMPTW'
  delimiter: " '"
  algebra:
    # 1. 先複製一份全大寫的拼寫。原本的小寫**留著** —— 那就是精確拼音那一半。
    - derive/^(.*)$/\U$1/
    # 2. 只有大寫那一份會被折成九宮格鍵位(小寫的不受影響)。
    #    ü 在 luna_pinyin.dict.yaml 裡寫作 v，歸在 TUV → T。
    - xlit|ABCDEFGHIJKLMNOPQRSTUVWXYZ|AAADDDGGGJJJMMMPPPPTTTWWWW|
    # 3. 超級簡拼：每個音節只打第一鍵。
    #    折疊後的音節都是 A/D/G/J/M/P/T/W，所以這條規則等同「取首鍵」。
    - abbrev/^([ADGJMPTW]).+$/$1/

translator:
  dictionary: luna_pinyin
  # 必須指定獨立的 prism：詞典雖然和朙月拼音同一本，拼寫規則完全不同，
  # 兩者共用 prism 會互相覆蓋。
  prism: t9_pinyin
  # ⚠ 這是**音節數**上限,不是字元數(ScriptSyllabifier::GetOriginalSpelling
  #   比對的是 cand.code().size())。設 5 的話,超過五個音節的候選**完全沒有
  #   comment** —— 而消歧欄正是從 comment 讀讀音的,於是長句一律取不到讀音。
  #   萬象用 50,rime-ice 用 100。
  spelling_hints: 50
  # 折疊之後重碼極多，靠語言模型組句比逐字選有用得多。
  enable_sentence: true
  enable_user_dict: true

punctuator:
  import_preset: symbols

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    punct: '^/([0-9]0?|[A-Za-z]+)$'

zh_hans:
  option_name: zh_hans
  opencc_config: t2s.json
  tips: none

zh_hant_hk:
  option_name: zh_hant_hk
  opencc_config: t2hk.json
  tips: none

zh_hant_tw:
  option_name: zh_hant_tw
  opencc_config: t2tw.json
  tips: none

__patch:
  # 使用八股文語言模型（rime-essay）
  - grammar:/hant?
  # 用家自選配置
  - t9_pinyin.custom:/patch?
