name: macOS (核心驗證)

# 這個 workflow 驗證的是：librime + 資料 + rime_shell 門面在 macOS 上
# 編得出來、跑得起來、而且真的打得出字。它是桌面端的品質基線 ——
# 這裡是綠的，之後 IMKit 或候選窗出問題就必在 UI 那一側。
#
# 與 Android 的 build.yml 的關係：
#   Android 的 .a 是預先編好入版控的，日常只組裝 APK + 跑 JUnit。
#   macOS 沒有預編的 .a（CI 是唯一的建置環境），所以這裡從原始碼全編。
#
# ⚠ 這裡刻意**不**驗證 UI。macos runner 沒有登入的圖形工作階段，
#   系統不會從 ~/Library/Input Methods 載入輸入法，候選窗與實際打字
#   在 CI 上驗不了（見 docs/handoff-macos.md §7）。這一層只保證核心。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-verify:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: 取出原始碼
        uses: actions/checkout@v4

      - name: 記錄工具鏈版本（失敗時要能重建現場）
        run: |
          sw_vers
          echo "arch: $(uname -m)"
          cmake --version | head -1
          clang++ --version | head -1
          bash --version | head -1

      - name: 取得方案原始資料（版本已釘死）
        run: ./scripts/fetch_rime_data.sh

      - name: 編譯原生層（librime + 5 個依賴 + librime-lua + rime_console）
        run: ./apple/scripts/build_macos.sh

      - name: 組裝執行期資料
        run: ./scripts/collect_data.sh

      - name: 確認執行期資料真的齊全
        run: |
          # 少了這些檔案，後面每一步都會「成功」，但輸入法一個字都打不出來。
          # 這是 Android 端 build.yml 檢查 APK assets 的同一個理由。
          fail=0
          for f in core/data/shared/essay.txt \
                   core/data/shared/luna_pinyin.dict.yaml \
                   core/data/shared/luna_pinyin_tw.schema.yaml \
                   core/data/shared/bopomofo_tw.schema.yaml \
                   core/data/shared/terra_pinyin.dict.yaml \
                   core/data/user/default.custom.yaml; do
            if [ -s "$f" ]; then echo "  ✓ $f"; else echo "  !! 缺少或空檔: $f"; fail=1; fi
          done
          n=$(ls core/data/shared/opencc/*.ocd2 2>/dev/null | wc -l | tr -d ' ')
          echo "  opencc 詞典: $n 個 .ocd2"
          [ "$n" -gt 0 ] || { echo "  !! 沒有任何 .ocd2，簡繁轉換會壞"; fail=1; }
          exit $fail

      - name: 斷言本體的反向測試（證明它真的會紅）
        run: |
          # 先證明斷言會失敗，再相信它的成功。
          # docs/handoff-macos.md §7:「測試是綠的，因為它沒在測。」
          # 這一步故意餵一個錯的預期值，斷言必須判定失敗；
          # 若它通過了，代表斷言邏輯本身壞掉，後面兩步的綠沒有意義。
          ./apple/scripts/verify_console.sh --expect-fail nihao luna_pinyin_tw 這不可能是結果

      - name: 核心驗證 — 拼音 nihao → 你好
        run: ./apple/scripts/verify_console.sh nihao luna_pinyin_tw 你好

      - name: 核心驗證 — 注音 su3cl3 → 你好
        run: ./apple/scripts/verify_console.sh su3cl3 bopomofo_tw 你好
