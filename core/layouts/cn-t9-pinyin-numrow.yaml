# ─────────────────────────────────────────────────────────────────────────────
#  cn-t9-pinyin-numrow — 九宮格拼音 ＋ 獨立數字列
#
#  ── 它模仿的是什麼慣例 ───────────────────────────────────────────────────
#
#  「數字行」是搜狗／百度／訊飛／語燕都有的一個**設定開關**：在字母區上方
#  釘一條 1234567890 的橫列，讓打數字不必切層。語燕的 README 把它列為
#  自家的三大貼心功能之一（「输入数字要么切换到数字键盘，要么长按按键，
#  对输入来说都不便捷，因此我开发了键盘数字行」）。
#
#  本檔＝`cn-t9-pinyin` 加上這條數字列。九宮格的 5 欄結構、hint 上標、
#  分詞／重輸／0 鍵一字不改，只是整體往下移一列。
#
#  ⚠ 鍵的顏色規則、以及組字中左欄變成**拼音消歧欄**這件事，都與
#  `cn-t9-pinyin.yaml` 完全相同，說明只寫在那一份（本檔的 `t9` 層同樣被
#  `T9Syllables.SLOTS` 接管 `pu_comma` / `pu_period` / `pu_question` 三格，
#  底列的 `!@#` 一樣不動）。兩份要一起改。
#
#  ── 多一列不會讓鍵盤長高（曾經需要 `height_scale: 0.80` 來補償）──────────
#
#  量使用者的 S24U 實機截圖：
#
#  | 截圖 | 列數 | 鍵盤區總高 | 單鍵高 |
#  |---|---|---|---|
#  | photo_1 九宮格 | 4 | **510 截圖 px** | **54.4 dp** |
#  | photo_2 全鍵盤＋數字列 | 5 | **505 截圖 px** | **43.2 dp** |
#
#  （比例尺：截圖 1182×2560 是 1440×3120 的等比縮圖，1 px = 0.3860 dp。）
#
#  兩者總高只差 1%：**三星是把鍵盤總高固定住、再除以列數**。使用者打開
#  「數字行」時預期多一列數字，不預期鍵盤整體長高 20% —— 鍵盤長高會把聊天
#  視窗擠掉一整段，那是很明顯的退步。
#
#  規範 §8.8.0 的舊模型（鍵高 = 鍵寬 × aspect、總高 = 鍵高 × 列數）與此相反，
#  所以本檔一度寫 `height_scale: 0.80` 手動把五列壓回四列的高度。那是繞路：
#  係數與主題的 `key_height` 夾制耦合，主題一換就得重算。
#
#  **§8.8.0 已改為「固定高度預算 ÷ Σweight」，補償整段拿掉。**
#  現在多一列＝每列矮一點，總高一模一樣，`height_scale` 回到 1.0。
#  數字列的 `weight: 0.83` 是實機比例（三星的數字列比字母列矮），
#  它讓數字列真的矮下來，其餘四列依比例分掉剩下的預算。
#
#  ── 和 `cn-t9-pinyin` 的差別 ─────────────────────────────────────────────
#
#  * 多一列 10 鍵的數字列（width 1.0 × 10，正好等於 units），`weight: 0.83`
#  * `auto_for_schema: []` —— 資格上它就是給 `t9_pinyin` 用的
#    （`for_schema` 老實這麼寫），但**自動命中讓給** `cn-t9-pinyin`。
#    §9.1.1 把兩件事拆成兩個欄位之前，這裡只能寫 `for_schema: ["*"]`，
#    而那句話照字面會把九宮格提供給 luna_pinyin —— 渲染正常、一個字打不出來。
#    進入方式：在 `cn-t9-pinyin` 長按「123」，或從鍵盤類型選單直接挑。
#  * 「123」鍵長按改為切回 `cn-t9-pinyin`（來回都走得通）
#
#  規範：docs/theme-format.md §9、§9.1.1、§9.2
# ─────────────────────────────────────────────────────────────────────────────

format: rime-layout/1
id: cn-t9-pinyin-numrow
revision: 1
inherits: cn-t9-pinyin

name:
  en: "Pinyin 9-key + number row"
  zh-Hant: "九宮格拼音・數字列"
  zh-Hans: "九宫格拼音・数字行"

description:
  zh-Hant: "九宮格加一條獨立數字列。總高與不加數字列時相同，只是每列矮一點。"
  zh-Hans: "九宫格加一条独立数字行。总高与不加数字行时相同，只是每行矮一点。"

kind: grid
# §9.1.1：資格上它只給 t9_pinyin 用（老實寫），但把自動命中讓給 cn-t9-pinyin。
for_schema: ["t9_pinyin"]
auto_for_schema: []
default_layer: t9
# 「中／En」進英文模式時換上的層（見 en 層的檔頭）。
alpha_layer: en
primary: false

metrics:
  row_spacing: null
  key_spacing: null
  # 1.0：多一列不再需要補償，§8.8.0 的預算模型會自己把總高壓住。
  height_scale: 1.0

# §7.2：序列一律整體取代，所以 layers 必須完整重寫（不能只加一列）。
layers:

  - id: "t9"
    # 拼音消歧欄借用左邊那一直欄（§8.6.6.3 的 keyboard_slot）。
    # ⚠ 只吃前三格,**底列那一格不動**:`!@#` 是 switch_layout,一顆導覽鍵,
    #   而 LayoutEscape 走的是佈局檔的靜態內容、看不見執行期替換 ——
    #   在那裡動手就是在死路檢查上開一個測不到的洞。
    syllable_slots: ["pu_comma", "pu_period", "pu_question"]
    label: "九宮格・數字列"
    units: 10
    rows:

      # ── 數字列。10 顆 × 1.0 單位，正好填滿 units，與下方九宮格對不齊
      #    是刻意的：實機亦然（數字列自成一套節奏）。
      #    `weight: 0.83` = 實機數字列與字母列的高度比（43.2 → 35.9 dp）。
      #    §8.8.0 用 Σweight 分預算，所以這一行真的會讓數字列矮下來，
      #    而不是把整份佈局撐高。
      - weight: 0.83
        keys:
          - { id: "n1", label: "1", send: { keysym: "1" } }
          - { id: "n2", label: "2", send: { keysym: "2" } }
          - { id: "n3", label: "3", send: { keysym: "3" } }
          - { id: "n4", label: "4", send: { keysym: "4" } }
          - { id: "n5", label: "5", send: { keysym: "5" } }
          - { id: "n6", label: "6", send: { keysym: "6" } }
          - { id: "n7", label: "7", send: { keysym: "7" } }
          - { id: "n8", label: "8", send: { keysym: "8" } }
          - { id: "n9", label: "9", send: { keysym: "9" } }
          - { id: "n0", label: "0", send: { keysym: "0" } }

      - weight: 1.0
        keys:
          - id: "pu_comma"
            label: "，"
            width: 1.7
            style: modifier
            send: { keysym: "comma" }
            popup:
              layout: row
              keys:
                - { label: "、", send: { text: "、" } }
                - { label: "；", send: { keysym: "semicolon" } }
                - { label: "：", send: { keysym: "colon" } }
          # ⚠ 沒有 `style`（＝ default，白色），與 cn-t9-pinyin 同步：分詞送的是
          # 音節分隔符，屬於打字而不是操作鍵盤，且它坐在中間 3×3 裡面。
          # 完整規則見 cn-t9-pinyin.yaml 檔頭「鍵的顏色代表什麼」。
          - { id: "delim", label: "分詞", hint: "1", width: 2.2, send: { keysym: "apostrophe" } }
          - { id: "k_abc", label: "abc", hint: "2", width: 2.2, send: { keysym: "A" } }
          - { id: "k_def", label: "def", hint: "3", width: 2.2, send: { keysym: "D" } }
          - id: "backspace"
            icon: backspace
            width: 1.7
            style: modifier
            send: { keysym: "BackSpace" }
            repeat: true

      - weight: 1.0
        keys:
          - id: "pu_period"
            label: "。"
            width: 1.7
            style: modifier
            send: { keysym: "period" }
            popup:
              layout: row
              keys:
                - { label: "…", send: { text: "…" } }
                - { label: "—", send: { text: "—" } }
                - { label: "～", send: { text: "～" } }
          - { id: "k_ghi", label: "ghi", hint: "4", width: 2.2, send: { keysym: "G" } }
          - { id: "k_jkl", label: "jkl", hint: "5", width: 2.2, send: { keysym: "J" } }
          - { id: "k_mno", label: "mno", hint: "6", width: 2.2, send: { keysym: "M" } }
          - { id: "clear", label: "重輸", width: 1.7, style: modifier, tap: "clear" }

      - weight: 1.0
        keys:
          - id: "pu_question"
            label: "？"
            width: 1.7
            style: modifier
            send: { keysym: "question" }
            popup:
              layout: row
              keys:
                - { label: "！", send: { keysym: "exclam" } }
                - { label: "·", send: { text: "·" } }
                - { label: "…", send: { text: "…" } }
          - { id: "k_pqrs", label: "pqrs", hint: "7", width: 2.2, send: { keysym: "P" } }
          - { id: "k_tuv",  label: "tuv",  hint: "8", width: 2.2, send: { keysym: "T" } }
          - { id: "k_wxyz", label: "wxyz", hint: "9", width: 2.2, send: { keysym: "W" } }
          - { id: "d0", label: "0", width: 1.7, style: modifier, send: { keysym: "0" } }

      - weight: 1.0
        keys:
          - id: "to_symbols"
            label: "!@#"
            width: 1.7
            style: modifier
            tap: "switch_layout:cn-symbols"
          - id: "lang"
            label_from: input_mode_pair
            label: "中/En"
            width: 2.2
            style: modifier
            tap: "input_mode:toggle"
            long_press: "schema:picker"
          - id: "space"
            icon: space
            style: space
            width: 2.2
            label_from: schema_name
            send: { keysym: "space" }
            swipe:
              left:  { tap: "cursor:left" }
              right: { tap: "cursor:right" }
            long_press: "switch_layout:@primary"
          - id: "to_num"
            label: "123"
            width: 2.2
            style: modifier
            tap: "layer:num"
            long_press: "switch_layout:cn-t9-pinyin"
          - id: "enter"
            icon: enter
            style: action
            width: 1.7
            send: { keysym: "Return" }

  # 數字層與 cn-t9-pinyin 相同（§7.2 序列整體取代，必須重寫）。
  # 它只有四列，所以 height_scale 0.80 會讓它比主層矮 —— 這是可接受的：
  # 切到數字盤時鍵盤高度不變（總高 = 5 列主層決定），鍵只是更寬鬆。
  - id: "num"
    label: "123"
    units: 10
    rows:

      - weight: 1.0
        keys:
          - { id: "op_percent", label: "%", width: 1.7, style: modifier, send: { keysym: "percent" } }
          - { id: "d1", label: "1", width: 2.2, send: { keysym: "1" } }
          - { id: "d2", label: "2", width: 2.2, send: { keysym: "2" } }
          - { id: "d3", label: "3", width: 2.2, send: { keysym: "3" } }
          - id: "backspace"
            icon: backspace
            width: 1.7
            style: modifier
            send: { keysym: "BackSpace" }
            repeat: true

      - weight: 1.0
        keys:
          - { id: "op_slash", label: "/", width: 1.7, style: modifier, send: { keysym: "slash" } }
          - { id: "d4", label: "4", width: 2.2, send: { keysym: "4" } }
          - { id: "d5", label: "5", width: 2.2, send: { keysym: "5" } }
          - { id: "d6", label: "6", width: 2.2, send: { keysym: "6" } }
          - { id: "dot", label: ".", width: 1.7, style: modifier, send: { keysym: "period" } }

      - weight: 1.0
        keys:
          - id: "op_minus"
            label: "-"
            width: 1.7
            style: modifier
            send: { keysym: "minus" }
            popup:
              layout: row
              keys:
                - { label: "+", send: { keysym: "plus" } }
                - { label: "*", send: { keysym: "asterisk" } }
                - { label: "=", send: { keysym: "equal" } }
                - { label: "#", send: { keysym: "numbersign" } }
          - { id: "d7", label: "7", width: 2.2, send: { keysym: "7" } }
          - { id: "d8", label: "8", width: 2.2, send: { keysym: "8" } }
          - { id: "d9", label: "9", width: 2.2, send: { keysym: "9" } }
          - { id: "at", label: "@", width: 1.7, style: modifier, send: { keysym: "at" } }

      - weight: 1.0
        keys:
          - id: "to_symbols"
            label: "!@#"
            width: 1.7
            style: modifier
            tap: "switch_layout:cn-symbols"
          - { id: "back", label: "返回", width: 2.2, style: modifier, tap: "layer:t9" }
          - id: "space"
            icon: space
            style: space
            width: 2.2
            send: { keysym: "space" }
            long_press: "switch_layout:@primary"
          - { id: "d0", label: "0", width: 2.2, send: { keysym: "0" } }
          - id: "enter"
            icon: enter
            style: action
            width: 1.7
            send: { keysym: "Return" }

  # ── 英數層（alpha_layer）────────────────────────────────────
  #
  #  這一層是本佈局的 `alpha_layer`：「中／En」鍵進英文模式時自動換上。
  #
  #  為什麼非得在本檔裡不可，而不是 `switch_layout:@primary` 跳到 qwerty：
  #  跳過去是單程票。qwerty 是 primary，它的鍵面上沒有、也不該有一顆
  #  「回九宮格」的鍵。層切換永遠在同一份佈局檔內，回程**結構上**存在：
  #  切回中文一定落在 `default_layer`，不靠這一層自己記得放一顆回程鍵。
  #
  #  排列與 qwerty 同款，好讓肌肉記憶通用；底列與主層對齊，
  #  「中／En」永遠在同一格 —— 同一個位置進、同一個位置出。
  - id: "en"
    label: "abc"
    units: 10
    rows:

      - weight: 1.0
        keys:
          - { id: "e_q", label: "q", hint: "1", send: { keysym: "q" } }
          - { id: "e_w", label: "w", hint: "2", send: { keysym: "w" } }
          - { id: "e_e", label: "e", hint: "3", send: { keysym: "e" } }
          - { id: "e_r", label: "r", hint: "4", send: { keysym: "r" } }
          - { id: "e_t", label: "t", hint: "5", send: { keysym: "t" } }
          - { id: "e_y", label: "y", hint: "6", send: { keysym: "y" } }
          - { id: "e_u", label: "u", hint: "7", send: { keysym: "u" } }
          - { id: "e_i", label: "i", hint: "8", send: { keysym: "i" } }
          - { id: "e_o", label: "o", hint: "9", send: { keysym: "o" } }
          - { id: "e_p", label: "p", hint: "0", send: { keysym: "p" } }

      - weight: 1.0
        keys:
          - { spacer: true, width: 0.5 }
          - { id: "e_a", label: "a", send: { keysym: "a" } }
          - { id: "e_s", label: "s", send: { keysym: "s" } }
          - { id: "e_d", label: "d", send: { keysym: "d" } }
          - { id: "e_f", label: "f", send: { keysym: "f" } }
          - { id: "e_g", label: "g", send: { keysym: "g" } }
          - { id: "e_h", label: "h", send: { keysym: "h" } }
          - { id: "e_j", label: "j", send: { keysym: "j" } }
          - { id: "e_k", label: "k", send: { keysym: "k" } }
          - { id: "e_l", label: "l", send: { keysym: "l" } }
          - { spacer: true, width: 0.5 }

      - weight: 1.0
        keys:
          - id: "shift"
            icon: shift
            style: modifier
            width: 1.5
            tap: "layer_once:en_upper"
            double_tap: "layer_lock:en_upper"
          - { id: "e_z", label: "z", send: { keysym: "z" } }
          - { id: "e_x", label: "x", send: { keysym: "x" } }
          - { id: "e_c", label: "c", send: { keysym: "c" } }
          - { id: "e_v", label: "v", send: { keysym: "v" } }
          - { id: "e_b", label: "b", send: { keysym: "b" } }
          - { id: "e_n", label: "n", send: { keysym: "n" } }
          - { id: "e_m", label: "m", send: { keysym: "m" } }
          - id: "backspace"
            icon: backspace
            style: modifier
            width: 1.5
            send: { keysym: "BackSpace" }
            repeat: true
            swipe:
              left: { tap: "clear" }

      # 底列與主層對齊：「中／En」永遠在左起第二格 —— 同一個位置進、
      # 同一個位置出，這是這類切換唯一不會被使用者弄丟的擺法。
      - weight: 1.0
        keys:
          - id: "to_symbols"
            label: "!@#"
            width: 1.7
            style: modifier
            tap: "switch_layout:cn-symbols"
          - id: "lang"
            label_from: input_mode_pair
            label: "中/En"
            width: 2.2
            style: modifier
            tap: "input_mode:toggle"
            long_press: "schema:picker"
          - id: "space"
            icon: space
            style: space
            width: 2.2
            send: { keysym: "space" }
            swipe:
              left:  { tap: "cursor:left" }
              right: { tap: "cursor:right" }
            long_press: "switch_layout:@primary"
          - id: "period"
            label: "."
            width: 2.2
            send: { keysym: "period" }
            popup:
              layout: row
              keys:
                - { label: ",", send: { keysym: "comma" } }
                - { label: "?", send: { keysym: "question" } }
                - { label: "!", send: { keysym: "exclam" } }
                - { label: "@", send: { keysym: "at" } }
          - id: "enter"
            icon: enter
            style: action
            width: 1.7
            send: { keysym: "Return" }

  - id: "en_upper"
    label: "ABC"
    units: 10
    rows:

      - weight: 1.0
        keys:
          - { id: "e_q", label: "Q", hint: "1", send: { keysym: "Q", modifiers: [Shift] } }
          - { id: "e_w", label: "W", hint: "2", send: { keysym: "W", modifiers: [Shift] } }
          - { id: "e_e", label: "E", hint: "3", send: { keysym: "E", modifiers: [Shift] } }
          - { id: "e_r", label: "R", hint: "4", send: { keysym: "R", modifiers: [Shift] } }
          - { id: "e_t", label: "T", hint: "5", send: { keysym: "T", modifiers: [Shift] } }
          - { id: "e_y", label: "Y", hint: "6", send: { keysym: "Y", modifiers: [Shift] } }
          - { id: "e_u", label: "U", hint: "7", send: { keysym: "U", modifiers: [Shift] } }
          - { id: "e_i", label: "I", hint: "8", send: { keysym: "I", modifiers: [Shift] } }
          - { id: "e_o", label: "O", hint: "9", send: { keysym: "O", modifiers: [Shift] } }
          - { id: "e_p", label: "P", hint: "0", send: { keysym: "P", modifiers: [Shift] } }

      - weight: 1.0
        keys:
          - { spacer: true, width: 0.5 }
          - { id: "e_a", label: "A", send: { keysym: "A", modifiers: [Shift] } }
          - { id: "e_s", label: "S", send: { keysym: "S", modifiers: [Shift] } }
          - { id: "e_d", label: "D", send: { keysym: "D", modifiers: [Shift] } }
          - { id: "e_f", label: "F", send: { keysym: "F", modifiers: [Shift] } }
          - { id: "e_g", label: "G", send: { keysym: "G", modifiers: [Shift] } }
          - { id: "e_h", label: "H", send: { keysym: "H", modifiers: [Shift] } }
          - { id: "e_j", label: "J", send: { keysym: "J", modifiers: [Shift] } }
          - { id: "e_k", label: "K", send: { keysym: "K", modifiers: [Shift] } }
          - { id: "e_l", label: "L", send: { keysym: "L", modifiers: [Shift] } }
          - { spacer: true, width: 0.5 }

      - weight: 1.0
        keys:
          - id: "shift"
            icon: shift_lock
            style: modifier
            active: true
            width: 1.5
            tap: "layer:en"
          - { id: "e_z", label: "Z", send: { keysym: "Z", modifiers: [Shift] } }
          - { id: "e_x", label: "X", send: { keysym: "X", modifiers: [Shift] } }
          - { id: "e_c", label: "C", send: { keysym: "C", modifiers: [Shift] } }
          - { id: "e_v", label: "V", send: { keysym: "V", modifiers: [Shift] } }
          - { id: "e_b", label: "B", send: { keysym: "B", modifiers: [Shift] } }
          - { id: "e_n", label: "N", send: { keysym: "N", modifiers: [Shift] } }
          - { id: "e_m", label: "M", send: { keysym: "M", modifiers: [Shift] } }
          - id: "backspace"
            icon: backspace
            style: modifier
            width: 1.5
            send: { keysym: "BackSpace" }
            repeat: true
            swipe:
              left: { tap: "clear" }

      # 底列與主層對齊：「中／En」永遠在左起第二格 —— 同一個位置進、
      # 同一個位置出，這是這類切換唯一不會被使用者弄丟的擺法。
      - weight: 1.0
        keys:
          - id: "to_symbols"
            label: "!@#"
            width: 1.7
            style: modifier
            tap: "switch_layout:cn-symbols"
          - id: "lang"
            label_from: input_mode_pair
            label: "中/En"
            width: 2.2
            style: modifier
            tap: "input_mode:toggle"
            long_press: "schema:picker"
          - id: "space"
            icon: space
            style: space
            width: 2.2
            send: { keysym: "space" }
            swipe:
              left:  { tap: "cursor:left" }
              right: { tap: "cursor:right" }
            long_press: "switch_layout:@primary"
          - id: "period"
            label: "."
            width: 2.2
            send: { keysym: "period" }
            popup:
              layout: row
              keys:
                - { label: ",", send: { keysym: "comma" } }
                - { label: "?", send: { keysym: "question" } }
                - { label: "!", send: { keysym: "exclam" } }
                - { label: "@", send: { keysym: "at" } }
          - id: "enter"
            icon: enter
            style: action
            width: 1.7
            send: { keysym: "Return" }
